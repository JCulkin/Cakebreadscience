<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>To do | Cakebread Science</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--cream:#eeeae0;--paper:#fff;--muted:#5a5a5a;--line:#d8d3c4;--soft:#f6f4ee;--green:#00a03a;--dk:#005e22;
  --bio:#2e7d32;--chem:#c8001e;--phys:#d08000;--s:#16a34a;--r:#ea580c;--l:#facc15;--n:#e7e2d6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.4;font-size:16px}
a{color:var(--dk)}
h1,h2,h3,.big,.btn{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:900;text-transform:uppercase;line-height:1.05}
header{background:#111;padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:46px}
header a.home{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:900;font-size:28px;text-transform:uppercase;color:var(--cream);text-decoration:none}
header a.home span{color:var(--green)}
header #cbs-account{margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
.hello{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.hello img{width:84px;image-rendering:pixelated;background:var(--paper);border:2px solid var(--ink)}
.hello h1{font-size:40px}.hello p{color:var(--muted)}
.btn{display:inline-block;background:#facc15;color:#111;border:2px solid #111;box-shadow:0 3px 0 #000;padding:7px 14px;font-size:19px;text-decoration:none;align-self:flex-start}
.btn.alt{background:var(--paper)}.btn.green{background:#4ade80}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;margin-bottom:14px}
.card h2{font-size:22px;margin-bottom:8px}
.pt{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pt .k{font:900 15px 'Barlow Condensed',Arial;min-width:58px;padding:2px 6px;color:#fff;text-align:center}
.k.B{background:var(--bio)}.k.C{background:var(--chem)}.k.P{background:var(--phys)}
.pt .t{flex:1;font-size:14px}
.pt .t small{display:block;color:var(--muted)}
.pt a{font-size:14px;font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px}
.sci{display:grid;grid-template-columns:90px 1fr 70px;gap:6px 10px;align-items:center;font-size:14px}
.bar{height:12px;background:var(--n);display:flex}.bar i{display:block;height:100%}
.strip{display:flex;gap:3px;margin-top:4px}.strip i{width:18px;height:26px;background:var(--n)}.strip i.y{background:var(--s)}
.gate{background:#fde047;border:2px solid var(--ink);padding:16px 18px;font-size:17px}
.gate button{font:900 19px 'Barlow Condensed',Arial;text-transform:uppercase;background:#111;color:#fff;border:0;padding:8px 16px;margin-left:8px;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{background:var(--paper);border:2px solid var(--ink);padding:6px 12px;text-decoration:none;color:var(--ink);font-weight:700}
.tline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:2px solid #111;padding:10px 12px;margin:0 0 18px}
.tline b{font:900 20px/1 'Barlow Condensed',Arial,sans-serif;text-transform:uppercase;margin-right:4px}
.tline a{padding:5px 10px;border:2px solid #111;text-decoration:none;color:#111;font-weight:700;font-size:14px;background:#fef3c7}
.tline a.ok{background:#dcfce7;border-color:#15803d;color:#15803d}
.tline a.go{margin-left:auto;background:#111;color:#fff}
.yr{background:#111;color:#fff;border:0;font:700 13px Barlow,Arial;padding:2px 9px;margin-left:6px;cursor:pointer;vertical-align:2px}
.setw .a{border-top:1px solid var(--line);padding:9px 0}.setw .a:first-of-type{border-top:0}
.setw .a h3{font-size:19px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.setw .a h3 small{font:600 13px Barlow,Arial;color:var(--muted);text-transform:none}
.setw .a h3 .done{background:#dcfce7;color:#15803d;border:1px solid #15803d;font:700 12px Barlow,Arial;padding:0 6px;text-transform:uppercase}
.setw .a h3 .late{background:#fee2e2;color:#991b1b;border:1px solid #991b1b;font:700 12px Barlow,Arial;padding:0 6px;text-transform:uppercase}
.setw .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper);padding:3px 9px;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink)}
.chip:hover{background:#fef3c7}.chip i{font-style:normal;font-weight:600;color:var(--muted);font-size:12px}
.chip.B{border-color:var(--bio)}.chip.C{border-color:var(--chem)}.chip.P{border-color:var(--phys)}
.covered h3{font-size:16px;margin:10px 0 6px}.covered h3:first-of-type{margin-top:0}
@media(max-width:560px){.tline a.go{margin-left:0}}
</style>
</head>
<body>
<header><img src="/img/mascot/head-pixel-hd.webp" alt=""><a class="home" href="/">Cakebread <span>Science</span></a><div id="cbs-account"></div></header>
<main id="main"><p class="muted">Loading your day…</p></main>

<script src="/js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="/js/account.js"></script>
<script src="/interactive/spec-quiz/spec.js"></script>
<script src="/interactive/spec-quiz/questions.js"></script>
<script src="/interactive/spec-quiz/gens.js"></script>
<script src="/interactive/spec-quiz/cards.js"></script>
<script src="/interactive/spec-quiz/questing-engine.js"></script>
<script src="/interactive/spec-quiz/adventurer-items.js"></script>
<script src="/interactive/spec-quiz/adventurer-pixel.js"></script>
<script src="/interactive/spec-quiz/bland.js"></script>
<script src="/interactive/spec-quiz/adventurer-shell.js"></script>
<script src="/js/admin-config.js"></script>
<script src="/js/year.js"></script>
<script src="/js/school.js"></script>
<script>
/* To do (10 Nov 2026): one page that answers "what should I do today?" across the site — the v4 "one revision journey".
   Reads Cakebread Questing (QE), the account doc (flashcard reviews due, spec tracker ticks) and Breadventure Land (bland/). */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = s => String(s || '').replace(/<[^>]+>/g, '');
const Q = '/interactive/spec-quiz/';
let drawn = false;

/* nothing on this page may wait forever (17 Nov: students at school were stuck on "Loading your day…"):
   every database call has a time limit, and what couldn't be reached is named at the bottom of the page */
const SLOW = new Set();
const within = (p, ms, label) => new Promise((ok, no) => {
  const t = setTimeout(() => { SLOW.add(label); no(new Error('timeout: ' + label)); }, ms);
  Promise.resolve(p).then(v => { clearTimeout(t); ok(v); }, e => { clearTimeout(t); no(e); });
});
let waited = false;
setTimeout(() => { waited = true; if (!QE.known || QE.status === 'loading') SLOW.add('your account (Firestore)'); safeDraw(); drawSchool(); }, 5000);
function slowNote() {
  const n = $('slowNote'); if (n) n.remove();
  if (!SLOW.size || !$('main')) return;
  $('main').insertAdjacentHTML('beforeend', `<p id="slowNote" class="small muted" style="margin-top:16px">⚠️ Couldn't reach ${[...SLOW].join(', ')}. If this keeps happening at school, the school network is probably blocking part of Firebase — tell your teacher.</p>`);
}
async function draw() {
  if ((!QE.known || QE.status === 'loading') && !waited) return;
  const u = QE.user;
  if (!u) {
    $('main').innerHTML = `<div class="gate"><b>Sign in to see your day.</b> One Google account covers Cakebread Questing, Flashcards, the spec trackers and Breadventure Land. <button id="si">Sign in</button></div>
      <h2 style="margin:22px 0 8px">Or jump in</h2><div class="links"><a href="${Q}">⚔️ Cakebread Questing</a><a href="/Flashcards/">🃏 Flashcards</a><a href="/specifications/biology.html">📋 Spec trackers</a><a href="/">🏠 Homepage</a></div>`;
    $('si').onclick = () => QE.signIn().catch(() => {});
    drawn = false; return;
  }
  if (drawn) return; drawn = true;
  /* the account doc: flashcard reviews due + spec tracker ticks */
  let doc = {}, spec = {};
  const fs = firebase.firestore(), rt0 = firebase.database();
  const [dR, sR, lR] = await Promise.allSettled([
    within(fs.collection('users').doc(u.uid).get(), 6000, 'your account (Firestore)'),
    within(fs.collection('specProgress').doc(u.uid).get(), 6000, 'the spec trackers (Firestore)'),
    within(Promise.all(['bland/world', 'bland/state/' + u.uid, 'bland/pub/' + u.uid].map(p => rt0.ref(p).once('value').then(x => x.val()))), 6000, 'Breadventure Land (Realtime Database)')]);
  if (dR.status === 'fulfilled') doc = dR.value.data() || {};
  let conf = null;
  if (sR.status === 'fulfilled') { const s = sR.value; spec = (s.exists && s.data().subjects) || doc.specSubjects || {}; conf = (s.exists && s.data().conf) || null; } else spec = doc.specSubjects || {};
  const now = Date.now(), prog = doc.progress || {};
  const due = Object.values(prog).filter(p => p && p.repetitions > 0 && p.nextReview <= now).length;
  /* Breadventure Land */
  let land = null;
  if (lR.status === 'fulfilled') { const [w, st, pb] = lR.value; land = { w, st, pb }; }

  const st = QE.stats(), s = ADV.stats(), name = QE.boardName().split(' ')[0];
  const missionDone = QE.missionsToday() > 0, cd = QE.cardsToday(), cardsDone = !!(cd && cd.done);
  const pick = QE.picks()[0];
  let face; try { face = PIXEL.portrait(ADV.look(), ADV.eq()); } catch (e) { face = '/img/mascot/head-pixel.png'; }
  const hr = new Date().getHours(), hi = hr < 12 ? 'Morning' : hr < 18 ? 'Afternoon' : 'Evening';

  /* step 3: Breadventure Land */
  let landTxt = 'One world shared by everyone who plays. Plan your moves; they happen at midnight.', landDone = false, landBtn = 'Into Breadventure Land →';
  if (land && land.st && land.w) {
    const camp = land.st.camp && land.st.camp.day === land.w.day && land.st.at === land.st.camp.k && BL.PLACES[land.st.camp.k], mv = BL.movesOf(land.st);   // moves happen at once now; only boss camps wait
    const newRep = land.w.day < BL.TODAY ? 'Last night is waiting to happen: open the map to run it.' : land.st.reportDay === land.w.day && (ADV.S.seenRep || {})[u.uid] !== land.st.reportDay ? '📜 Your morning report is waiting.' : '';
    landDone = mv === 0 || !!camp;
    landTxt = `${newRep ? newRep + ' ' : ''}${camp ? `⛺ Camped at ${camp.name} for midnight. ` : ''}${mv ? `${mv} move${mv === 1 ? '' : 's'} to use today.` : 'No moves left today.'} ❤ ${land.st.health ?? '–'}/${s.hp} Health${land.st.pending ? ' · 🎁 rewards to collect' : ''}.`;
    landBtn = mv ? 'Play your moves →' : 'See the map →';
  } else if (!land) landTxt = 'Breadventure Land couldn\'t load just now.';
  let landShort = 'Breadventure Land';
  if (land && land.st && land.w) { const camp = land.st.camp && land.st.camp.day === land.w.day && land.st.at === land.st.camp.k, mv = BL.movesOf(land.st);
    landShort = land.st.pending ? '🎁 Rewards waiting' : mv ? `${mv} move${mv > 1 ? 's' : ''} to use` : camp ? '⛺ Camped' : 'No moves left'; }

  /* nearly secured, rusty, weak flashcards */
  const near = Object.keys(QE.POINT_QS).map(k => [k, QE.pointState(k)]).filter(([, p]) => p.started && !p.secured && p.need - (p.sec + p.cSec) <= 1.5)
    .sort((a, b) => (a[1].need - a[1].sec - a[1].cSec) - (b[1].need - b[1].sec - b[1].cSec)).slice(0, 6);
  const rusty = Object.keys(QE.POINT_QS).filter(k => QE.pointState(k).rusty).slice(0, 6);
  const weak = QE.weakPoints().slice(0, 6);
  const P = k => QE.POINTS[k] || { id: k.slice(1), text: '' };
  const row = (k, why) => `<div class="pt"><span class="k ${k[0]}">${k[0]} ${P(k).id}</span><span class="t">${esc(strip(P(k).text).slice(0, 90))}${strip(P(k).text).length > 90 ? '…' : ''}<small>${why}</small></span>
    <a href="${Q}adventurer-mission.html?point=${k}">⚔️ Quiz me</a>${QE.CARDS_ON[k] ? ` <a href="/Flashcards/?spec=${k}">🃏 Cards</a>` : ''}</div>`;

  /* the spec: Questing secured vs tracker ticks */
  const sec = QE.securedBySci();
  const tick = sub => { if (conf) { const L = sub[0].toUpperCase(), all = Object.keys(QE.POINTS).filter(k => k[0] === L); const n = all.filter(k => conf[k] === 3).length; return all.length && n ? Math.round(n / all.length * 100) : null; } const x = spec[sub]; if (!x) return null; const it = x.items || {}, tot = x.total || Object.keys(it).length; return tot ? Math.round(Object.values(it).filter(v => v && v.checkbox).length / tot * 100) : null; };
  const sciRow = (L, sub, col) => { const pc = Math.round(sec[L.toLowerCase()] / ADV.TOTAL[L.toLowerCase()] * 100), t = tick(sub);
    return `<span><b>${ADV.SCI[L.toLowerCase()]}</b></span><div><div class="bar" title="${sec[L.toLowerCase()]} of ${ADV.TOTAL[L.toLowerCase()]} spec points secured"><i style="width:${pc}%;background:${col}"></i></div>${t != null ? `<div class="small muted">You rated ${t}% "confident" on the <a href="/specifications/${sub}.html">tracker</a></div>` : `<div class="small muted"><a href="/specifications/${sub}.html">Open the tracker</a></div>`}</div><span class="small"><b>${sec[L.toLowerCase()]}</b>/${ADV.TOTAL[L.toLowerCase()]}</span>`; };

  /* last 14 days of revision */
  const days = [...Array(14)].map((_, i) => { const d = new Date(Date.parse(QE.TODAY + 'T12:00:00') - (13 - i) * 864e5); return BL.dstr(d); });
  const did = d => (QE.game.days || {})[d] || ((QE.game.cd || {})[d] || {}).n;
  const streak = (() => { let n = 0; for (let i = days.length - 1; i >= 0; i--) { if (did(days[i])) n++; else if (i < days.length - 1) break; } return n; })();

  $('main').innerHTML = `<div class="hello"><img src="${face}" alt=""><div><h1>${hi}, ${esc(name)}</h1><p>Level ${s.l} · ${st.securedP} of ${QE.stats().withQ} spec points secured${streak > 1 ? ` · 🔥 ${streak} days in a row` : ''}</p></div></div>
    <div class="tline"><b>Today</b>
      <a class="${missionDone ? 'ok' : ''}" href="${Q}adventurer-mission.html">⚔️ ${missionDone ? 'Mission ✓' : 'Mission to do'}</a>
      <a class="${cardsDone ? 'ok' : ''}" href="/Flashcards/">🃏 ${cardsDone ? 'Cards ✓' : due ? `${due} card${due > 1 ? 's' : ''} due` : 'New cards'}</a>
      <a class="${landDone ? 'ok' : ''}" href="${Q}adventurer-map.html">🗺️ ${landShort}</a>
      <a class="go" href="${Q}adventurer-home.html">🧁 Cakelab →</a></div>
    <div id="school"></div>
    <h2 style="font-size:22px;margin:4px 0 8px">What to revise</h2>
    <div class="cols">
      <div>
        ${near.length ? `<div class="card"><h2>Nearly secured</h2><p class="small muted" style="margin-bottom:4px">One more right answer or card on another day locks these in.</p>${near.map(([k]) => row(k, 'Nearly there')).join('')}</div>` : ''}
        ${weak.length ? `<div class="card"><h2>From your flashcards</h2>${weak.map(k => row(k, 'You rated these cards hard')).join('')}</div>` : ''}
        ${rusty.length ? `<div class="card"><h2>Gone rusty</h2>${rusty.map(k => row(k, 'Secured, but not practised for 3 weeks')).join('')}</div>` : ''}
        ${!near.length && !weak.length && !rusty.length ? `<div class="card"><h2>Where to start</h2><p>${pick ? `Try <b>${esc(pick.sub.subj)} · ${esc(pick.sub.name)}</b>. ` : ''}Do a mission or some flashcards: this page then lists the spec points you're closest to securing and the ones that need another look.</p><p style="margin-top:8px"><a class="btn" href="${Q}adventurer-mission.html">⚔️ Start a mission →</a> <a class="btn alt" href="/Flashcards/">🃏 Flashcards →</a></p></div>` : ''}
      </div>
      <div>
        <div class="card"><h2>The spec</h2><div class="sci">${sciRow('B', 'biology', 'var(--bio)')}${sciRow('C', 'chemistry', 'var(--chem)')}${sciRow('P', 'physics', 'var(--phys)')}</div>
          <p class="small muted" style="margin-top:8px">Bars = spec points secured in Cakebread Questing (missions and flashcards).</p></div>
        <div class="card"><h2>Last 14 days</h2><div class="strip">${days.map(d => `<i class="${did(d) ? 'y' : ''}" title="${d}"></i>`).join('')}</div><p class="small muted" style="margin-top:6px">Green = you revised that day.</p></div>
        <div class="card"><h2>Everything else</h2><div class="links"><a href="${Q}adventurer-home.html">🧁 Cakelab</a><a href="${Q}practice.html">📝 Plain practice</a><a href="/booklets/">📚 Question booklets</a><a href="/interactive/physics-long-answer/">✍️ 6-mark questions</a><a href="/leaderboards/">🏆 Leaderboards</a><a href="/interactive/lessons/">🎓 Lessons</a></div></div>
      </div>
    </div>`;
  drawSchool(); slowNote();
}
/* from your teacher (17 Nov 2026): work set for your year + what's been covered in class (js/school.js, js/year.js) */
let SCHOOL = null;
async function drawSchool() {
  const box = $('school'); if (!box || !QE.user) return;
  const y = window.CBSYear && CBSYear.year;
  const hp = document.querySelector('.hello p'), old = $('yrBtn'); if (old) old.remove();
  if (hp) hp.insertAdjacentHTML('beforeend', y ? `<span class="yr" id="yrBtn" style="cursor:default">Year ${y}</span>` : '<button class="yr" id="yrBtn">Choose your year</button>');
  if (!y && $('yrBtn')) $('yrBtn').onclick = () => CBSYear.ask();
  if (!y) { box.innerHTML = ''; return; }
  if (!SCHOOL) {
    try { SCHOOL = await within(CBSSchool.load(firebase.database()), 6000, "your teacher's work (Realtime Database)"); }
    catch (e) { console.warn('school', e); box.innerHTML = `<div class="card"><h2>Set by your teacher</h2><p>Couldn't load the work your teacher set just now. Try reloading the page; if it still doesn't come, tell your teacher.</p></div>`; slowNote(); return; }
  }
  let udoc = {}; try { udoc = (await within(firebase.firestore().collection('users').doc(QE.user.uid).get(), 5000, 'your account (Firestore)')).data() || {}; } catch (e) {}
  const S = CBSSchool, prog = QE.prog, today = QE.TODAY;
  const set = S.forYear(SCHOOL.assign, y);
  const secured = k => QE.pointState(k).secured;
  const fmt = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
  const chip = k => { const pts = S.pointsOf(k), sc = pts.filter(secured).length; return `<a class="chip ${k[0]}" href="${S.practise(k)}">${esc(S.shortLabel(k))}<i>${sc}/${pts.length} secured</i></a>`; };
  const testHtml = a => { const r = S.testOf(udoc, a), late = a.due && a.due < today && r.state !== 'done';
    return `<div class="a"><h3>${esc(a.title || 'Test')} ${r.state === 'done' ? '<span class="done">Done ✓</span>' : late ? '<span class="late">Overdue</span>' : ''}<small>Test · ${r.n} questions${a.due ? ' · due ' + fmt(a.due) : ''}</small></h3>
      ${a.note ? `<p class="small">${esc(a.note)}</p>` : ''}
      <p class="small" style="margin:6px 0">${r.state === 'done' ? `You scored <b>${r.score} / ${r.n}</b>.` : r.state === 'started' ? `${r.answered} of ${r.n} answered.` : 'One go: your score goes to your teacher.'}</p>
      <a class="btn ${r.state === 'done' ? 'alt' : ''}" style="font-size:17px;padding:5px 12px" href="/work/?id=${encodeURIComponent(a.id)}">${r.state === 'done' ? 'See your answers' : r.state === 'started' ? 'Carry on →' : 'Start the test →'}</a></div>`; };
  const setHtml = set.map(a => { if (S.isTest(a)) return testHtml(a); const p = S.progress(prog, a), late = a.due && a.due < today && !p.done;
    return `<div class="a"><h3>${esc(a.title || 'Work set')} ${p.done ? '<span class="done">Done ✓</span>' : late ? '<span class="late">Overdue</span>' : ''}<small>${a.due ? 'due ' + fmt(a.due) : ''}</small></h3>
      ${a.note ? `<p class="small">${esc(a.note)}</p>` : ''}
      <div class="bar" style="margin-top:6px" title="${p.got} of ${p.target}"><i style="width:${p.got / p.target * 100}%;background:${p.done ? 'var(--s)' : 'var(--l)'}"></i></div>
      <p class="small muted">Practise until you've got ${p.target} different questions right (${p.got} so far). Any of these:</p><div class="items">${(a.items || []).map(chip).join('')}</div></div>`; }).join('');
  const taught = Object.keys(SCHOOL.taught['Y' + y] || {}).filter(k => S.SUBS[k]);
  const bySci = L => taught.filter(k => k[0] === L).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const cov = ['B', 'C', 'P'].filter(L => bySci(L).length).map(L => `<h3>${({ B: 'Biology', C: 'Chemistry', P: 'Physics' })[L]}</h3><div class="items" style="display:flex;flex-wrap:wrap;gap:6px">${bySci(L).map(chip).join('')}</div>`).join('');
  box.innerHTML = (set.length ? `<div class="card setw"><h2>Set by your teacher</h2>${setHtml}</div>` : '')
    + (taught.length ? `<div class="card covered"><h2>Covered in class</h2><p class="small muted" style="margin-bottom:8px">What Year ${y} has done in lessons so far. Tap one to practise it.</p>${cov}</div>` : '');
  if (!set.length && !taught.length) box.innerHTML = `<div class="card"><h2>Set by your teacher</h2><p class="muted">Nothing set for Year ${y} right now.</p></div>`;
  slowNote();
}
/* never leave a student on "Loading your day…": if anything above throws (odd saved data), show a simple page instead */
function safeDraw() {
  draw().catch(e => {
    console.error('To do', e);
    if (!QE.user) return;
    $('main').innerHTML = `<div class="hello"><div><h1>Hello, ${esc(QE.boardName().split(' ')[0])}</h1><p></p></div></div>
      <div id="school"></div>
      <div class="card"><h2>Today</h2><div class="links"><a href="${Q}adventurer-mission.html">⚔️ Mission</a><a href="/Flashcards/">🃏 Flashcards</a><a href="${Q}adventurer-map.html">🗺️ Breadventure Land</a><a href="${Q}adventurer-home.html">🧁 Cakelab</a><a href="${Q}practice.html">📝 Practice</a></div>
      <p class="small muted" style="margin-top:8px">Part of this page couldn't load, so here's the short version.</p></div>`;
    drawSchool();
  });
}
QE.onChange(() => { safeDraw(); drawSchool(); }); safeDraw(); drawSchool();
if (window.CBSYear) CBSYear.onChange(() => drawSchool());
