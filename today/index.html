<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>My day | Cakebread Science</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--cream:#eeeae0;--paper:#fff;--muted:#5a5a5a;--line:#d8d3c4;--soft:#f6f4ee;--green:#00a03a;--dk:#005e22;
  --bio:#2e7d32;--chem:#c8001e;--phys:#d08000;--s:#16a34a;--r:#ea580c;--l:#facc15;--n:#e7e2d6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.4;font-size:16px}
a{color:var(--dk)}
h1,h2,h3,.big,.btn{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:900;text-transform:uppercase;line-height:1.05}
header{background:#111;padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:46px}
header a.home{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:900;font-size:28px;text-transform:uppercase;color:var(--cream);text-decoration:none}
header a.home span{color:var(--green)}
header #cbs-account{margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
.hello{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.hello img{width:84px;image-rendering:pixelated;background:var(--paper);border:2px solid var(--ink)}
.hello h1{font-size:40px}.hello p{color:var(--muted)}
.btn{display:inline-block;background:#facc15;color:#111;border:2px solid #111;box-shadow:0 3px 0 #000;padding:7px 14px;font-size:19px;text-decoration:none;align-self:flex-start}
.btn.alt{background:var(--paper)}.btn.green{background:#4ade80}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;margin-bottom:14px}
.card h2{font-size:22px;margin-bottom:8px}
.pt{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pt .k{font:900 15px 'Barlow Condensed',Arial;min-width:58px;padding:2px 6px;color:#fff;text-align:center}
.k.B{background:var(--bio)}.k.C{background:var(--chem)}.k.P{background:var(--phys)}
.pt .t{flex:1;font-size:14px}
.pt .t small{display:block;color:var(--muted)}
.pt a{font-size:14px;font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px}
.sci{display:grid;grid-template-columns:90px 1fr 70px;gap:6px 10px;align-items:center;font-size:14px}
.bar{height:12px;background:var(--n);display:flex}.bar i{display:block;height:100%}
.strip{display:flex;gap:3px;margin-top:4px}.strip i{width:18px;height:26px;background:var(--n)}.strip i.y{background:var(--s)}
.gate{background:#fde047;border:2px solid var(--ink);padding:16px 18px;font-size:17px}
.gate button{font:900 19px 'Barlow Condensed',Arial;text-transform:uppercase;background:#111;color:#fff;border:0;padding:8px 16px;margin-left:8px;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{background:var(--paper);border:2px solid var(--ink);padding:6px 12px;text-decoration:none;color:var(--ink);font-weight:700}
.tline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:2px solid #111;padding:10px 12px;margin:0 0 18px}
.tline b{font:900 20px/1 'Barlow Condensed',Arial,sans-serif;text-transform:uppercase;margin-right:4px}
.tline a{padding:5px 10px;border:2px solid #111;text-decoration:none;color:#111;font-weight:700;font-size:14px;background:#fef3c7}
.tline a.ok{background:#dcfce7;border-color:#15803d;color:#15803d}
.tline a.go{margin-left:auto;background:#111;color:#fff}
@media(max-width:560px){.tline a.go{margin-left:0}}
</style>
</head>
<body>
<header><img src="/img/mascot/head-pixel-hd.webp" alt=""><a class="home" href="/">Cakebread <span>Science</span></a><div id="cbs-account"></div></header>
<main id="main"><p class="muted">Loading your day…</p></main>

<script src="/js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="/js/account.js"></script>
<script src="/interactive/spec-quiz/spec.js"></script>
<script src="/interactive/spec-quiz/questions.js"></script>
<script src="/interactive/spec-quiz/gens.js"></script>
<script src="/interactive/spec-quiz/cards.js"></script>
<script src="/interactive/spec-quiz/questing-engine.js"></script>
<script src="/interactive/spec-quiz/adventurer-items.js"></script>
<script src="/interactive/spec-quiz/adventurer-pixel.js"></script>
<script src="/interactive/spec-quiz/bland.js"></script>
<script src="/interactive/spec-quiz/adventurer-shell.js"></script>
<script>
/* My day (10 Nov 2026): one page that answers "what should I do today?" across the site — the v4 "one revision journey".
   Reads Cakebread Questing (QE), the account doc (flashcard reviews due, spec tracker ticks) and Breadventure Land (bland/). */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = s => String(s || '').replace(/<[^>]+>/g, '');
const Q = '/interactive/spec-quiz/';
let drawn = false;

async function draw() {
  if (!QE.known || QE.status === 'loading') return;
  const u = QE.user;
  if (!u) {
    $('main').innerHTML = `<div class="gate"><b>Sign in to see your day.</b> One Google account covers Cakebread Questing, Flashcards, the spec trackers and Breadventure Land. <button id="si">Sign in</button></div>
      <h2 style="margin:22px 0 8px">Or jump in</h2><div class="links"><a href="${Q}">⚔️ Cakebread Questing</a><a href="/Flashcards/">🃏 Flashcards</a><a href="/specifications/biology.html">📋 Spec trackers</a><a href="/">🏠 Homepage</a></div>`;
    $('si').onclick = () => QE.signIn().catch(() => {});
    drawn = false; return;
  }
  if (drawn) return; drawn = true;
  /* the account doc: flashcard reviews due + spec tracker ticks */
  let doc = {}, spec = {};
  try { doc = (await firebase.firestore().collection('users').doc(u.uid).get()).data() || {}; } catch (e) {}
  try { const s = await firebase.firestore().collection('specProgress').doc(u.uid).get(); spec = (s.exists && s.data().subjects) || doc.specSubjects || {}; } catch (e) { spec = doc.specSubjects || {}; }
  const now = Date.now(), prog = doc.progress || {};
  const due = Object.values(prog).filter(p => p && p.repetitions > 0 && p.nextReview <= now).length;
  /* Breadventure Land */
  let land = null;
  try {
    const rt = firebase.database();
    const [w, st, pb] = await Promise.all(['bland/world', 'bland/state/' + u.uid, 'bland/pub/' + u.uid].map(p => rt.ref(p).once('value').then(x => x.val())));
    land = { w, st, pb };
  } catch (e) {}

  const st = QE.stats(), s = ADV.stats(), name = QE.boardName().split(' ')[0];
  const missionDone = QE.missionsToday() > 0, cd = QE.cardsToday(), cardsDone = !!(cd && cd.done);
  const pick = QE.picks()[0];
  let face; try { face = PIXEL.portrait(ADV.look(), ADV.eq()); } catch (e) { face = '/img/mascot/head-pixel.png'; }
  const hr = new Date().getHours(), hi = hr < 12 ? 'Morning' : hr < 18 ? 'Afternoon' : 'Evening';

  /* step 3: Breadventure Land */
  let landTxt = 'One world shared by everyone who plays. Plan your moves; they happen at midnight.', landDone = false, landBtn = 'Into Breadventure Land →';
  if (land && land.st && land.w) {
    const planned = land.pb && land.pb.plan && land.pb.plan.day === land.w.day ? land.pb.plan.steps.length : 0;
    const newRep = land.w.day < BL.TODAY ? 'Last night is waiting to happen: open the map to run it.' : land.st.reportDay === land.w.day && (ADV.S.seenRep || {})[u.uid] !== land.st.reportDay ? '📜 Your morning report is waiting.' : '';
    landDone = planned > 0 && planned >= Math.min(land.st.moves || 0, 1);
    landTxt = `${newRep ? newRep + ' ' : ''}${planned ? `${planned} move${planned > 1 ? 's' : ''} planned for tonight.` : `${land.st.moves || 0} move${land.st.moves === 1 ? '' : 's'} to plan for tonight.`} ❤ ${land.st.health ?? '–'}/${s.hp} Health${land.st.pending ? ' · 🎁 rewards to collect' : ''}.`;
    landBtn = planned ? 'See the map →' : 'Plan your moves →';
  } else if (!land) landTxt = 'Breadventure Land couldn\'t load just now.';
  let landShort = 'Breadventure Land';
  if (land && land.st && land.w) { const pl = land.pb && land.pb.plan && land.pb.plan.day === land.w.day ? land.pb.plan.steps.length : 0, mv = land.st.moves || 0;
    landShort = land.st.pending ? '🎁 Rewards waiting' : pl ? `${pl} move${pl > 1 ? 's' : ''} planned` : mv ? `${mv} move${mv > 1 ? 's' : ''} to plan` : 'No moves left'; }

  /* nearly secured, rusty, weak flashcards */
  const near = Object.keys(QE.POINT_QS).map(k => [k, QE.pointState(k)]).filter(([, p]) => p.started && !p.secured && p.need - (p.sec + p.cSec) <= 1.5)
    .sort((a, b) => (a[1].need - a[1].sec - a[1].cSec) - (b[1].need - b[1].sec - b[1].cSec)).slice(0, 6);
  const rusty = Object.keys(QE.POINT_QS).filter(k => QE.pointState(k).rusty).slice(0, 6);
  const weak = QE.weakPoints().slice(0, 6);
  const P = k => QE.POINTS[k] || { id: k.slice(1), text: '' };
  const row = (k, why) => `<div class="pt"><span class="k ${k[0]}">${k[0]} ${P(k).id}</span><span class="t">${esc(strip(P(k).text).slice(0, 90))}${strip(P(k).text).length > 90 ? '…' : ''}<small>${why}</small></span>
    <a href="${Q}adventurer-mission.html?point=${k}">⚔️ Quiz me</a>${QE.CARDS_ON[k] ? ` <a href="/Flashcards/?spec=${k}">🃏 Cards</a>` : ''}</div>`;

  /* the spec: Questing secured vs tracker ticks */
  const sec = QE.securedBySci();
  const tick = sub => { const x = spec[sub]; if (!x) return null; const it = x.items || {}, tot = x.total || Object.keys(it).length; return tot ? Math.round(Object.values(it).filter(v => v && v.checkbox).length / tot * 100) : null; };
  const sciRow = (L, sub, col) => { const pc = Math.round(sec[L.toLowerCase()] / ADV.TOTAL[L.toLowerCase()] * 100), t = tick(sub);
    return `<span><b>${ADV.SCI[L.toLowerCase()]}</b></span><div><div class="bar" title="${sec[L.toLowerCase()]} of ${ADV.TOTAL[L.toLowerCase()]} spec points secured"><i style="width:${pc}%;background:${col}"></i></div>${t != null ? `<div class="small muted">You've ticked ${t}% on the <a href="/specifications/${sub}.html">tracker</a></div>` : `<div class="small muted"><a href="/specifications/${sub}.html">Open the tracker</a></div>`}</div><span class="small"><b>${sec[L.toLowerCase()]}</b>/${ADV.TOTAL[L.toLowerCase()]}</span>`; };

  /* last 14 days of revision */
  const days = [...Array(14)].map((_, i) => { const d = new Date(Date.parse(QE.TODAY + 'T12:00:00') - (13 - i) * 864e5); return BL.dstr(d); });
  const did = d => (QE.game.days || {})[d] || ((QE.game.cd || {})[d] || {}).n;
  const streak = (() => { let n = 0; for (let i = days.length - 1; i >= 0; i--) { if (did(days[i])) n++; else if (i < days.length - 1) break; } return n; })();

  $('main').innerHTML = `<div class="hello"><img src="${face}" alt=""><div><h1>${hi}, ${esc(name)}</h1><p>Level ${s.l} · ${st.securedP} of ${QE.stats().withQ} spec points secured${streak > 1 ? ` · 🔥 ${streak} days in a row` : ''}</p></div></div>
    <div class="tline"><b>Today</b>
      <a class="${missionDone ? 'ok' : ''}" href="${Q}adventurer-mission.html">⚔️ ${missionDone ? 'Mission ✓' : 'Mission to do'}</a>
      <a class="${cardsDone ? 'ok' : ''}" href="/Flashcards/">🃏 ${cardsDone ? 'Cards ✓' : due ? `${due} card${due > 1 ? 's' : ''} due` : 'New cards'}</a>
      <a class="${landDone ? 'ok' : ''}" href="${Q}adventurer-map.html">🗺️ ${landShort}</a>
      <a class="go" href="${Q}adventurer-home.html">🧁 Cakelab →</a></div>
    <h2 style="font-size:22px;margin:4px 0 8px">What to revise</h2>
    <div class="cols">
      <div>
        ${near.length ? `<div class="card"><h2>Nearly secured</h2><p class="small muted" style="margin-bottom:4px">One more right answer or card on another day locks these in.</p>${near.map(([k]) => row(k, 'Nearly there')).join('')}</div>` : ''}
        ${weak.length ? `<div class="card"><h2>From your flashcards</h2>${weak.map(k => row(k, 'You rated these cards hard')).join('')}</div>` : ''}
        ${rusty.length ? `<div class="card"><h2>Gone rusty</h2>${rusty.map(k => row(k, 'Secured, but not practised for 3 weeks')).join('')}</div>` : ''}
        ${!near.length && !weak.length && !rusty.length ? `<div class="card"><h2>Where to start</h2><p>${pick ? `Try <b>${esc(pick.sub.subj)} · ${esc(pick.sub.name)}</b>. ` : ''}Do a mission or some flashcards: this page then lists the spec points you're closest to securing and the ones that need another look.</p><p style="margin-top:8px"><a class="btn" href="${Q}adventurer-mission.html">⚔️ Start a mission →</a> <a class="btn alt" href="/Flashcards/">🃏 Flashcards →</a></p></div>` : ''}
      </div>
      <div>
        <div class="card"><h2>The spec</h2><div class="sci">${sciRow('B', 'biology', 'var(--bio)')}${sciRow('C', 'chemistry', 'var(--chem)')}${sciRow('P', 'physics', 'var(--phys)')}</div>
          <p class="small muted" style="margin-top:8px">Bars = spec points secured in Cakebread Questing (missions and flashcards).</p></div>
        <div class="card"><h2>Last 14 days</h2><div class="strip">${days.map(d => `<i class="${did(d) ? 'y' : ''}" title="${d}"></i>`).join('')}</div><p class="small muted" style="margin-top:6px">Green = you revised that day.</p></div>
        <div class="card"><h2>Everything else</h2><div class="links"><a href="${Q}adventurer-home.html">🧁 Cakelab</a><a href="/booklets/">📚 Question booklets</a><a href="/interactive/physics-long-answer/">✍️ 6-mark questions</a><a href="/leaderboards/">🏆 Leaderboards</a><a href="/interactive/lessons/">🎓 Lessons</a></div></div>
      </div>
    </div>`;
}
QE.onChange(draw); draw();
</script>
</body>
</html>
