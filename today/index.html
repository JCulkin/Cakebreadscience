<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Student Home | Cakebread Science</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--cream:#eeeae0;--paper:#fff;--muted:#5a5a5a;--line:#d8d3c4;--soft:#f6f4ee;--green:#00a03a;--dk:#005e22;
  --bio:#2e7d32;--chem:#c8001e;--phys:#d08000;--s:#16a34a;--r:#ea580c;--l:#facc15;--n:#e7e2d6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.4;font-size:15.5px}
a{color:var(--dk)}
h1,h2,h3,.big,.btn{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:900;text-transform:uppercase;line-height:1.05}
header{background:#111;border-bottom:3px solid var(--green);padding:10px 18px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
header a.home{display:inline-flex;align-items:center;gap:9px;font-family:'Barlow Condensed',Arial,sans-serif;font-weight:900;font-size:clamp(22px,4.5vw,28px);line-height:1;text-transform:uppercase;letter-spacing:-.3px;color:var(--cream);text-decoration:none;transition:color .14s}
header a.home img{width:34px;height:34px;object-fit:contain;display:block}
header a.home span{color:var(--green);transition:color .14s}
header a.home:hover{color:#fff}header a.home:hover span{color:#4ade80}
header .sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#9a968c}
header #cbs-account{margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:20px 18px 60px}

/* Zone 1: Greeting + integrated 1-click Revise CTA */
.hello{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.hello-l{display:flex;gap:14px;align-items:center;min-width:0}
.hello img{width:68px;height:68px;image-rendering:pixelated;background:var(--paper);border:2px solid var(--ink);flex:none}
.hello h1{font-size:clamp(28px,5vw,38px)}.hello p{color:var(--muted);font-size:14px}
.yr{background:#111;color:#fff;border:0;font:700 12px Barlow,Arial;padding:2px 8px;margin-left:6px;cursor:pointer;vertical-align:1px;border-radius:3px}
.qgo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#111;color:var(--cream);border:2px solid #111;border-left:6px solid var(--green);padding:8px 12px 8px 14px}
.qgo-txt b{font:900 16px/1.1 'Barlow Condensed',Arial,sans-serif;text-transform:uppercase;display:block;color:#facc15;letter-spacing:.3px}
.qgo-txt span{font-size:13px;color:#d6d3cb}
.btn{display:inline-block;background:#facc15;color:#111;border:2px solid #111;box-shadow:0 3px 0 #000;padding:6px 14px;font-size:18px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:#fde047}
.btn.alt{background:var(--paper)}.btn.alt:hover{background:#fef3c7}
.btn.green{background:#4ade80}

.card{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;margin-bottom:14px}
.card h2{font-size:21px;margin-bottom:8px}
.muted{color:var(--muted)}.small{font-size:13px}
.bar{height:10px;background:var(--n);display:flex;border:1.5px solid var(--ink);overflow:hidden}.bar i{display:block;height:100%}
.pill{display:inline-block;font:700 11.5px Barlow,Arial;text-transform:uppercase;letter-spacing:.3px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.late{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.pill.open{background:#fef08a;color:#713f12;border-color:#eab308}
.pill.done{background:#dcfce7;color:#15803d;border-color:#86efac}
.pill.cool{background:#e0f2fe;color:#075985;border-color:#7dd3fc}

/* Unified top box: From your teacher (Homework + Upcoming tests) */
.setw{border-left:6px solid #eab308}.setw.has-late{border-left-color:#dc2626}.setw.all-done{border-left-color:var(--s)}
.setw-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.setw-head h2{margin:0}
.subsec{font:900 13px 'Barlow Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:10px 0 4px;padding-top:8px;border-top:2px solid var(--cream);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.subsec:first-of-type{margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.subsec span.sym{font:600 12px Barlow,Arial;text-transform:none;letter-spacing:0}
.setw .a{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0}
.setw .a:first-of-type{border-top:0;padding-top:4px}
.setw .a-info{flex:1 1 250px;min-width:0}
.setw .a-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.setw .a-title{font:900 18.5px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase}
.setw .a-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--muted)}
.setw .a-meta .bar{flex:0 1 140px;min-width:84px}
.setw .a-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.setw .a-note{font-size:13px;color:var(--muted);margin-top:3px}
.setw details.topics{margin-top:5px}.setw details.topics summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);list-style:none}
.setw details.topics summary::-webkit-details-marker{display:none}.setw details.topics summary::after{content:' ▾'}.setw details.topics[open] summary::after{content:' ▴'}
.setw .items{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
details.done-list{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
details.done-list summary{cursor:pointer;font-size:13px;font-weight:700;color:#15803d;list-style:none}
details.done-list summary::-webkit-details-marker{display:none}
details.done-list summary::after{content:' ▾';color:var(--muted)}details.done-list[open] summary::after{content:' ▴'}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.done-row:first-of-type{margin-top:5px}
.card.done-bar{padding:10px 14px;border-left:6px solid var(--s)}
.card.done-bar details.done-list{margin-top:0;padding-top:0;border-top:0}

/* Action icon buttons */
.ico{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:32px;height:30px;padding:0 8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);text-decoration:none;font-size:14px;font-weight:700;border-radius:4px;line-height:1;white-space:nowrap}
.ico:hover{background:#fef3c7}
.ico.go{background:#facc15;padding:0 11px;font-size:14px}
.ico.q{background:#111;color:#fff}.ico.q:hover{background:#333}

/* Zone 2: Two clean cards (Up next + Your GCSE progress) */
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.dloop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--soft);border:1.5px solid var(--ink);margin-bottom:12px}
.dloop b{font:900 15px/1 'Barlow Condensed',Arial,sans-serif;text-transform:uppercase;margin-right:2px}
.dloop a{padding:4px 9px;border:1.5px solid #111;text-decoration:none;color:#111;font-weight:700;font-size:13.5px;background:#fef3c7;border-radius:4px}
.dloop a.ok{background:#dcfce7;border-color:#15803d;color:#15803d}
.dloop a.go{margin-left:auto;background:#111;color:#fff}
.up-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.up-head h3{font-size:17px;margin:0}
.up-head span{font-size:12px;color:var(--muted)}
.pt{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0}
.pt .k{font:900 14px 'Barlow Condensed',Arial;min-width:54px;padding:3px 6px;color:#fff;text-align:center;text-decoration:none;border-radius:3px}
.k.B{background:var(--bio)}.k.C{background:var(--chem)}.k.P{background:var(--phys)}
.pt .t{flex:1;font-size:14px;min-width:0}
.pt .t small{display:inline-block;margin-top:2px;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:3px;background:var(--soft);border:1px solid var(--line);color:#444}
.pt .t small.near{background:#dcfce7;border-color:#86efac;color:#166534}
.pt .t small.rusty{background:#ffedd5;border-color:#fdba74;color:#9a3412}
.pt .t small.weak{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.pt .t small.check{background:#fef08a;border-color:#eab308;color:#713f12}
.pt .ac{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
@media(max-width:560px){.pt{flex-wrap:wrap}.pt .ac{width:100%;justify-content:flex-start;padding-left:64px}.dloop a.go{margin-left:0}}

/* Progress card: Spec bars + 14-day strip + Covered in class drawer */
.sci{display:grid;grid-template-columns:82px 1fr 62px;gap:8px 10px;align-items:center;font-size:14px}
.sci a.sname{font-weight:800;color:var(--ink);text-decoration:none}.sci a.sname:hover{text-decoration:underline}
.streak-row{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.strip{display:flex;gap:3px}.strip i{width:14px;height:20px;background:var(--n);border-radius:2px}.strip i.y{background:var(--s)}

/* Compact Covered in class (Y8–Y11 full-topic boxes + partial chips) */
.covered{margin-top:12px;padding-top:10px;border-top:1.5px solid #e3ddcf}
.covered>summary{cursor:pointer;font-weight:800;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:6px}
.covered>summary::-webkit-details-marker{display:none}
.covered>summary::after{content:'▾';color:var(--muted);margin-left:auto}
.covered[open]>summary::after{content:'▴'}
.cov-sci{margin-top:9px}
.cov-sci h3{font-size:13px;letter-spacing:.6px;margin:0 0 5px;display:flex;align-items:center;gap:6px}
.cov-sci h3.B{color:var(--bio)}.cov-sci h3.C{color:var(--chem)}.cov-sci h3.P{color:var(--phys)}
.cov-sci h3 span{font:600 11.5px Barlow,Arial;color:var(--muted);text-transform:none;letter-spacing:0}
.cov-fulls{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:6px;margin-bottom:5px}
details.cov-full{border:2px solid var(--c);border-left-width:6px;border-radius:4px;background:#fff}
details.cov-full[open]{grid-column:1/-1;background:var(--soft)}
details.cov-full>summary{cursor:pointer;list-style:none;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
details.cov-full>summary::-webkit-details-marker{display:none}
details.cov-full>summary:hover{background:#fffbe6}
.cf-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:700;line-height:1.15}
.cf-top .chev{color:var(--muted);font-size:11px;flex:none}
details.cov-full[open] .cf-top .chev::after{content:'▴'}
details.cov-full:not([open]) .cf-top .chev::after{content:'▾'}
.cf-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.cf-bar{flex:1;height:6px;background:var(--n);border:1px solid #999;overflow:hidden}.cf-bar i{display:block;height:100%;background:var(--s)}
.cf-body{padding:6px 8px 8px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cf-go{background:#facc15;border:1.5px solid #111;padding:2px 8px;font:700 12px Barlow,Arial;text-decoration:none;color:#111;border-radius:4px}
.cf-go:hover{background:#fde047}
.cov-part{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--ink);background:var(--paper);padding:2px 7px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--ink);border-radius:4px}
.chip:hover{background:#fef3c7}.chip i{font-style:normal;font-weight:600;color:var(--muted);font-size:11px}
.chip.B{border-color:var(--bio)}.chip.C{border-color:var(--chem)}.chip.P{border-color:var(--phys)}

/* Zone 3: Calm 6-tile Explore the Site dock */
.dock-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
.dock-head h2{font-size:20px;margin:0}
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:820px){.dock{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.dock{grid-template-columns:1fr}}
.dtile{display:flex;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--ink);padding:10px 12px;text-decoration:none;color:var(--ink);transition:background .12s}
.dtile:hover{background:#fffbe6;box-shadow:inset 5px 0 0 var(--green)}
.dtile .ic{font-size:24px;line-height:1;width:30px;text-align:center;flex:none}
.dtile b{font:900 17px/1.05 'Barlow Condensed',Arial,sans-serif;text-transform:uppercase;display:block}
.dtile small{font-size:12.5px;color:var(--muted);display:block}
.dock-foot{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.dock-foot a{font-weight:700;text-decoration:none}.dock-foot a:hover{text-decoration:underline}

.gate{background:#fde047;border:2px solid var(--ink);padding:16px 18px;font-size:17px}
.gate button{font:900 19px 'Barlow Condensed',Arial;text-transform:uppercase;background:#111;color:#fff;border:0;padding:8px 16px;margin-left:8px;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{background:var(--paper);border:2px solid var(--ink);padding:6px 12px;text-decoration:none;color:var(--ink);font-weight:700}
</style>
</head>
<body>
<header><a class="home" href="/?dir=1" title="Full Cakebread Science directory"><img src="/img/mascot/head-pixel-hd.webp" alt="">Cakebread <span>Science</span></a><span class="sub">Student Home</span><div id="cbs-account"></div></header>
<main id="main"><p class="muted">Loading your day…</p></main>

<script src="/js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="/js/account.js"></script>
<script src="/interactive/spec-quiz/spec.js"></script>
<script src="/interactive/spec-quiz/questions.js"></script>
<script src="/interactive/spec-quiz/gens.js"></script>
<script src="/interactive/spec-quiz/diagq.js"></script>
<script src="/js/course.js"></script>
<script src="/interactive/spec-quiz/cards.js"></script>
<script src="/interactive/spec-quiz/questing-engine.js"></script>
<script src="/interactive/spec-quiz/adventurer-items.js"></script>
<script src="/interactive/spec-quiz/adventurer-pixel.js"></script>
<script src="/interactive/spec-quiz/bland.js"></script>
<script src="/interactive/spec-quiz/adventurer-shell.js"></script>
<script src="/js/admin-config.js"></script>
<script src="/js/year.js"></script>
<script src="/js/school.js"></script>
<script src="/js/spec-index.js"></script>
<script src="/js/study-guide.js"></script>
<script>
/* Student Home / To do (redesigned 27 Nov 2026 into 3 calm zones):
   Zone 1: Greeting + integrated 1-click "Start now" CTA + unified "From your teacher" (Homework + Upcoming tests)
   Zone 2: "Up next for you" (daily loop + strictly top 3 highest-value spec points) | "Your GCSE progress" (B/C/P bars + 14d dots + compact Covered in class drawer)
   Zone 3: Clean 6-tile "Explore the site" dock. */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = s => String(s || '').replace(/<[^>]+>/g, '');
const Q = '/interactive/spec-quiz/';
let drawn = false;

const SLOW = new Set();
const within = (p, ms, label) => new Promise((ok, no) => {
  const t = setTimeout(() => { SLOW.add(label); no(new Error('timeout: ' + label)); }, ms);
  Promise.resolve(p).then(v => { clearTimeout(t); ok(v); }, e => { clearTimeout(t); no(e); });
});
let waited = false;
setTimeout(() => { waited = true; if (!QE.known || QE.status === 'loading') SLOW.add('your account (Firestore)'); safeDraw(); drawSchool(); }, 5000);
function slowNote() {
  const n = $('slowNote'); if (n) n.remove();
  if (!SLOW.size || !$('main')) return;
  $('main').insertAdjacentHTML('beforeend', `<p id="slowNote" class="small muted" style="margin-top:16px">⚠️ Couldn't reach ${[...SLOW].join(', ')}. If this keeps happening at school, the school network is probably blocking part of Firebase — tell your teacher.</p>`);
}

async function draw() {
  if ((!QE.known || QE.status === 'loading') && !waited) return;
  const u = QE.user;
  if (!u) {
    $('main').innerHTML = `<div class="gate"><b>Sign in to open your Student Home.</b> One Google account covers homework, Cakebread Questing, Flashcards, Study Guides and Spec Trackers. <button id="si">Sign in</button></div>
      <h2 style="margin:22px 0 8px">Or jump in</h2><div class="links"><a href="/how-to-use/">❓ How to use this site</a><a href="${Q}">⚔️ Cakebread Questing</a><a href="/Flashcards/">🃏 Flashcards</a><a href="/specifications/science.html">📋 Spec trackers</a><a href="/?dir=1">📂 Full site directory</a></div>`;
    $('si').onclick = () => QE.signIn().catch(() => {});
    drawn = false; return;
  }
  if (drawn) return; drawn = true;
  let doc = {}, spec = {};
  const fs = firebase.firestore(), rt0 = firebase.database();
  const [dR, sR, lR] = await Promise.allSettled([
    within(fs.collection('users').doc(u.uid).get(), 6000, 'your account (Firestore)'),
    within(fs.collection('specProgress').doc(u.uid).get(), 6000, 'the spec trackers (Firestore)'),
    within(Promise.all(['bland/world', 'bland/state/' + u.uid, 'bland/pub/' + u.uid].map(p => CBSSchool.rtGet(rt0, p, 15000))), 15000, 'Breadventure Land (Realtime Database)')]);
  if (dR.status === 'fulfilled') doc = dR.value.data() || {};
  let conf = null;
  if (sR.status === 'fulfilled') { const s = sR.value; spec = (s.exists && s.data().subjects) || doc.specSubjects || {}; conf = (s.exists && s.data().conf) || null; } else spec = doc.specSubjects || {};
  const now = Date.now(), prog = doc.progress || {};
  const due = Object.values(prog).filter(p => p && p.repetitions > 0 && p.nextReview <= now).length;
  let land = null;
  if (lR.status === 'fulfilled') { const [w, st, pb] = lR.value; land = { w, st, pb }; }

  const st = QE.stats(), s = ADV.stats(), name = QE.boardName().split(' ')[0];
  const missionDone = QE.missionsToday() > 0, cd = QE.cardsToday(), cardsDone = !!(cd && cd.done);
  const pick = QE.picks()[0];
  let face; try { face = PIXEL.portrait(ADV.look(), ADV.eq()); } catch (e) { face = '/img/mascot/head-pixel.png'; }
  const hr = new Date().getHours(), hi = hr < 12 ? 'Morning' : hr < 18 ? 'Afternoon' : 'Evening';

  let landDone = false, landShort = 'Map';
  if (land && land.st && land.w) {
    const camp = land.st.camp && land.st.camp.day === land.w.day && land.st.at === land.st.camp.k, mv = BL.movesOf(land.st);
    landDone = mv === 0 || !!camp;
    landShort = land.st.pending ? '🎁 Loot' : mv ? `${mv} move${mv > 1 ? 's' : ''}` : camp ? '⛺ Camped' : '0 moves';
  }

  /* Curate strictly top 3 highest-leverage spec points across nearly-secured, hard cards, rusty, and unproved-confident */
  const gotOf = p => p.got != null ? p.got : Math.min(p.need, (p.sec || 0) + (p.cCredit != null ? p.cCredit : (p.cSec || 0)));
  const near = Object.keys(QE.POINT_QS).map(k => [k, QE.pointState(k)]).filter(([, p]) => p.started && !p.secured && p.need - gotOf(p) <= 1.5)
    .sort((a, b) => (a[1].need - gotOf(a[1])) - (b[1].need - gotOf(b[1]))).map(([k]) => ({ k, tag: 'Nearly secured', cls: 'near' }));
  const weak = QE.weakPoints().map(k => ({ k, tag: 'Hard flashcard', cls: 'weak' }));
  const rusty = Object.keys(QE.POINT_QS).filter(k => QE.pointState(k).rusty).map(k => ({ k, tag: 'Gone rusty', cls: 'rusty' }));
  const check = (conf ? Object.keys(conf).filter(k => conf[k] === 3 && QE.POINT_QS[k] && !QE.pointState(k).secured) : []).map(k => ({ k, tag: 'Rated confident — prove it', cls: 'check' }));
  const seen = new Set(), top3 = [];
  for (const list of [near, weak, rusty, check]) {
    for (const item of list) {
      if (top3.length >= 3) break;
      if (!seen.has(item.k)) { seen.add(item.k); top3.push(item); }
    }
    if (top3.length >= 3) break;
  }

          : `<p class="small muted">${pick ? `Try <b>${esc(pick.sub.subj)} · ${esc(pick.sub.name)}</b>. ` : ''}Finish a quick mission, Practice set, or Flashcards session and your closest targets will appear here automatically.</p><p style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="${Q}adventurer-mission.html">⚔️ Start a mission →</a><a class="btn alt" href="/Flashcards/">🃏 Flashcards →</a></p>`}
      </div>

/* Unified "From your teacher" (Homework + Upcoming tests) + compact Covered in class */
let SCHOOL = null;
let GUIDES = { at: 0, all: null, busy: false };
async function ensureGuides() {
  if (!window.CBSGuide || !window.firebase || !firebase.database) return null;
  if (GUIDES.all && Date.now() - GUIDES.at < 30000) return GUIDES.all;
  if (GUIDES.busy) return GUIDES.all;
  GUIDES.busy = true; GUIDES.at = Date.now();
  try { GUIDES.all = await CBSGuide.loadAll(firebase.database()); } catch (e) {}
  GUIDES.busy = false;
  return GUIDES.all;
}

function buildCompactCovered(taughtKeys, y) {
  const S = CBSSchool;
  const tSet = new Set(taughtKeys);
  const secured = k => QE.pointState(k).secured;
  const chip = k => { const pts = S.pointsOf(k), sc = pts.filter(secured).length; return `<a class="chip ${k[0]}" href="${S.practise(k)}">${esc(S.shortLabel(k))}<i>${sc}/${pts.length}</i></a>`; };
  const SCIS = { B: ['Biology', 'var(--bio)'], C: ['Chemistry', 'var(--chem)'], P: ['Physics', 'var(--phys)'] };
  let totalFull = 0;
  const blocks = SPEC.map(sc => {
    const L = sc.name[0], [sName, col] = SCIS[L];
    const fullTopics = [], partSubs = [];
    sc.topics.forEach(tp => {
      const validSubs = tp.subs.filter(sb => sb.name !== 'Units').map(sb => L + tp.n + sb.l).filter(k => S.SUBS[k] && S.pointsOf(k).length > 0);
      if (!validSubs.length) return;
      const covSubs = validSubs.filter(k => tSet.has(k));
      if (!covSubs.length) return;
      if (covSubs.length === validSubs.length) {
        totalFull++;
        const allPts = [...new Set(validSubs.flatMap(S.pointsOf))];
        const scCnt = allPts.filter(secured).length;
        fullTopics.push({ code: tp.n, name: tp.name, subs: validSubs, sec: scCnt, pts: allPts.length });
      } else {
        covSubs.forEach(k => partSubs.push(k));
      }
    });
    if (!fullTopics.length && !partSubs.length) return '';
    const meta = [fullTopics.length ? `${fullTopics.length} full topic${fullTopics.length > 1 ? 's' : ''}` : '', partSubs.length ? `${partSubs.length} in progress` : ''].filter(Boolean).join(' · ');
    const fullHtml = fullTopics.length ? `<div class="cov-fulls">${fullTopics.map(f => {
      const pc = f.pts ? Math.round(f.sec / f.pts * 100) : 0;
      const mixUrl = `${Q}practice.html?subs=${encodeURIComponent(f.subs.join(','))}&n=10&t=${encodeURIComponent(`${sName} ${f.code} · ${f.name}`)}`;
      return `<details class="cov-full" style="--c:${col}"><summary><div class="cf-top"><span>✓ ${f.code}. ${esc(f.name)}</span><span class="chev"></span></div><div class="cf-meta"><div class="cf-bar"><i style="width:${pc}%"></i></div><span>${f.sec}/${f.pts}</span></div></summary><div class="cf-body"><a class="cf-go" href="${mixUrl}">📝 Practise topic</a>${f.subs.map(chip).join('')}</div></details>`;
    }).join('')}</div>` : '';
    const partHtml = partSubs.length ? `<div class="cov-part">${partSubs.map(chip).join('')}</div>` : '';
    return `<div class="cov-sci"><h3 class="${L}">${sName} <span>${meta}</span></h3>${fullHtml}${partHtml}</div>`;
  }).filter(Boolean).join('');
  return { totalFull, html: blocks };
}

async function drawSchool() {
  const box = $('school'); if (!box || !QE.user) return;
  if (window.CBSYear && !CBSYear.known && !waited) return;
  const y = window.CBSYear && CBSYear.year;
  const hp = document.querySelector('.hello p'), old = $('yrBtn'); if (old) old.remove();

  if (!y && $('yrBtn')) $('yrBtn').onclick = () => CBSYear.ask();

  const [, guidesAll] = await Promise.all([
    (async () => {
      if (SCHOOL) return;
      try { SCHOOL = await within(CBSSchool.load(firebase.database()), 16000, "your teacher's work (Realtime Database)"); SLOW.delete("your teacher's work (Realtime Database)"); }
      catch (e) { console.warn('school', e); SCHOOL = CBSSchool.cached(); if (SCHOOL) SCHOOL.stale = true; }

  if (!SCHOOL) {

  }

  let udoc = {}; try { udoc = (await within(firebase.firestore().collection('users').doc(QE.user.uid).get(), 5000, 'your account (Firestore)')).data() || {}; } catch (e) {}
  const S = CBSSchool, prog = QE.prog, today = QE.TODAY, sa = !!(window.CBSCourse && CBSCourse.sa);
  const set = S.forMe(SCHOOL.assign, y, QE.user.uid);

  if (window.CBSWork) CBSWork.refresh();
  const secured = k => QE.pointState(k).secured;
  const fmt = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
  const chip = (k, hwId) => { const pts = S.pointsOf(k), sc = pts.filter(secured).length; return `<a class="chip ${k[0]}" href="${S.practise(k)}${hwId ? '&hw=' + encodeURIComponent(hwId) : ''}">${esc(S.shortLabel(k))}<i>${sc}/${pts.length}</i></a>`; };

  const openItems = [], doneItems = [];
  let hasLate = false, hasPractiseOpen = false, firstAction = null;
  set.forEach(a => {
    const encHw = encodeURIComponent(a.id), encT = encodeURIComponent(a.title || 'Homework');
    if (S.isTest(a)) {
      const r = S.testOf(udoc, a), late = !!(a.due && a.due < today && r.state !== 'done');
      if (r.state === 'done') {
        doneItems.push(`<div class="done-row"><span>✓ <b>${esc(a.title || 'Test')}</b> <span class="small muted">· scored ${r.score}/${r.n}</span></span><a class="small" href="/work/?id=${encHw}">Review →</a></div>`);
        return;
      }
      if (late) hasLate = true;
      const url = `/work/?id=${encHw}`;
      if (!firstAction) firstAction = { url, label: `Homework test: ${a.title || 'Test'}${late ? ' (overdue)' : ''}`, cta: r.state === 'started' ? '▶ Carry on test →' : '▶ Start test →' };
      const pct = r.n ? Math.round(r.answered / r.n * 100) : 0;
      openItems.push(`<div class="a"><div class="a-info">
        <div class="a-top"><span class="a-title">📋 ${esc(a.title || 'Test')}</span>${late ? '<span class="pill late">Overdue</span>' : a.due ? `<span class="pill">Due ${fmt(a.due)}</span>` : ''}<span class="pill">Test</span></div>
        ${a.note ? `<p class="a-note">${esc(a.note)}</p>` : ''}
        <div class="a-meta">${r.state === 'started' ? `<div class="bar"><i style="width:${pct}%;background:var(--l)"></i></div><span>${r.answered}/${r.n} answered</span>` : `<span>${r.n} questions · one go</span>`}</div>
      </div><div class="a-acts"><a class="ico go" href="${url}">▶ ${r.state === 'started' ? 'Carry on' : 'Start test'}</a></div></div>`);
    } else if (S.isSpaced(a)) {
      const r = S.spacedOf(udoc, a, today), late = !!(a.due && a.due < today && r.state !== 'done');
      if (r.state === 'done') {
        doneItems.push(`<div class="done-row"><span>✓ <b>${esc(a.title || 'Homework')}</b> <span class="small muted">· ${r.daysDone}/${r.daysNeed} days</span></span><span class="pill done">Done</span></div>`);
        return;
      }
      if (late) hasLate = true;
      hasPractiseOpen = true;
      const validItems = (a.items || []).filter(k => S.pointsOf(k).length);
      const pts = [...new Set(validItems.flatMap(S.pointsOf))];
      const hasCards = pts.some(k => QE.CARDS_ON && QE.CARDS_ON[k]);
      const encSubs = encodeURIComponent(validItems.join(','));
      const questUrl = `${Q}adventurer-mission.html?subs=${encSubs}&n=${r.qPerDay}&t=${encT}&hw=${encHw}`;
      const practUrl = `${Q}practice.html?subs=${encSubs}&n=${r.qPerDay}&t=${encT}&hw=${encHw}`;
      const cardsUrl = `/Flashcards/?subs=${encSubs}&t=${encT}`;
      if (!r.doneToday && validItems.length && !firstAction) {
        firstAction = { url: questUrl, label: `Homework: ${a.title || 'Mission'} (Day ${r.daysDone + 1}/${r.daysNeed} · ${r.qPerDay} Qs)`, cta: `⚔️ Start Day ${r.daysDone + 1} →` };
      }
      openItems.push(`<div class="a"><div class="a-info">
        <div class="a-top"><span class="a-title">🎯 ${esc(a.title || 'Homework')}</span>${r.doneToday ? `<span class="pill cool">Day ${r.daysDone}/${r.daysNeed} done today ✓</span>` : late ? '<span class="pill late">Overdue</span>' : a.due ? `<span class="pill">Due ${fmt(a.due)}</span>` : ''}</div>

      </div><div class="a-acts">

          : `<a class="ico go" href="${questUrl}" title="Do today's mission in Cakebread Questing">⚔️ Day ${r.daysDone + 1}</a><a class="ico" href="${practUrl}" title="Do today's mission in Practice (no game)" aria-label="Practice">📝</a>${hasCards ? `<a class="ico" href="${cardsUrl}" title="Flashcards on these topics" aria-label="Flashcards">🃏</a>` : ''}`) : ''}
      </div></div>`);
    } else {
      const p = S.progress(prog, a), late = !!(a.due && a.due < today && !p.done);
      if (p.done) {
        doneItems.push(`<div class="done-row"><span>✓ <b>${esc(a.title || 'Work set')}</b> <span class="small muted">· ${p.got}/${p.target} right</span></span><span class="pill done">Done</span></div>`);
        return;
      }
      if (late) hasLate = true;
      hasPractiseOpen = true;
      const validItems = (a.items || []).filter(k => S.pointsOf(k).length);
      const pts = [...new Set(validItems.flatMap(S.pointsOf))];
      const hasCards = pts.some(k => QE.CARDS_ON && QE.CARDS_ON[k]);
      const nRun = Math.max(5, Math.min(20, p.target - p.got));
      const encSubs = encodeURIComponent(validItems.join(','));
      const practUrl = validItems.length === 1 ? `${S.practise(validItems[0])}&hw=${encHw}` : `${Q}practice.html?subs=${encSubs}&n=${nRun}&t=${encT}&hw=${encHw}`;

        <div class="a-top"><span class="a-title">🎯 ${esc(a.title || 'Work set')}</span>${late ? '<span class="pill late">Overdue</span>' : a.due ? `<span class="pill">Due ${fmt(a.due)}</span>` : ''}</div>

  const staleNote = SCHOOL.stale ? `<p class="small muted" style="margin-bottom:6px">⚠️ Showing the copy saved on ${new Date(SCHOOL.savedAt).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}: reload to try again.</p>` : '';
  const doneBlock = doneItems.length ? `<details class="done-list"><summary>✓ Completed homework (${doneItems.length})</summary>${doneItems.join('')}</details>` : '';
  const testsHtml = mineGuides.length && window.CBSGuide ? (() => { CBSGuide.style(); return CBSGuide.todoRowsHtml(mineGuides); })() : '';

  if (openItems.length || testsHtml) {
    const pills = [
      openItems.length ? `<span class="pill ${hasLate ? 'late' : 'open'}">${openItems.length} to do</span>` : (doneItems.length ? '<span class="pill done">Homework done ✓</span>' : ''),
      mineGuides.length ? `<span class="pill open">${mineGuides.length} upcoming test${mineGuides.length > 1 ? 's' : ''}</span>` : ''
    ].filter(Boolean).join('');
    box.innerHTML = noYear + `<div class="card setw${hasLate ? ' has-late' : ''}" id="teacherCard">
      <div class="setw-head"><h2>📌 From your teacher</h2>${pills}</div>
      ${staleNote}
      ${openItems.length ? `<div class="subsec"><span>Homework to do</span>${hasPractiseOpen ? '<span class="sym">📝 Practice · ⚔️ Questing · 🃏 Cards</span>' : ''}</div>${openItems.join('')}` : ''}
      ${testsHtml ? `<div class="subsec"><span>📅 Upcoming tests</span><span class="sym">📄 Guide · 📝 Quiz · ⚔️ Quest · 🃏 Cards</span></div>${testsHtml}` : ''}
      ${doneBlock}
    </div>`;
  } else if (doneItems.length) {
    box.innerHTML = noYear + `<div class="card done-bar" id="teacherCard">${staleNote}${doneBlock}</div>`;
  } else {
    box.innerHTML = noYear + (staleNote ? `<div class="card">${staleNote}</div>` : '');
  }

  /* Compact "Covered in class" tucked at bottom of Progress card (closed by default; full topics collapse into clickable boxes) */
  const cv = $('covered');
  if (cv) {
    if (taught.length) {
      const built = buildCompactCovered(taught, y);
      cv.innerHTML = `<details class="covered"><summary>📚 Covered in class <span class="small muted">· ${taught.length} sub-topic${taught.length > 1 ? 's' : ''}${built.totalFull ? ` (${built.totalFull} full topic${built.totalFull > 1 ? 's' : ''})` : ''}</span></summary><p class="small muted" style="margin:5px 0 2px">Full topics collapse into one card — tap any card to open its sub-topics or practise the whole topic.</p>${built.html}</details>`;
    } else { cv.innerHTML = ''; }
  }
  if ($('yrBtn2')) $('yrBtn2').onclick = () => CBSYear.ask();
  slowNote();
}

function safeDraw() {
  draw().catch(e => {
    console.error('To do', e);
    if (!QE.user) return;
    $('main').innerHTML = `<div class="hello"><div class="hello-l"><div><h1>Hello, ${esc(QE.boardName().split(' ')[0])}</h1><p></p></div></div><div id="quickGo"></div></div>
      <div id="school"></div>
      <div class="card"><h2>Today</h2><div class="links"><a href="${Q}adventurer-mission.html">⚔️ Mission</a><a href="/Flashcards/">🃏 Flashcards</a><a href="${Q}adventurer-map.html">🗺️ Breadventure Land</a><a href="${Q}adventurer-home.html">🧁 Cakelab</a><a href="${Q}practice.html">📝 Practice</a></div>
      <p class="small muted" style="margin-top:8px">Part of this page couldn't load, so here's the short version.</p></div>`;
    drawSchool();
  });
}
QE.onChange(() => { safeDraw(); drawSchool(); }); safeDraw(); drawSchool();
if (window.CBSYear) CBSYear.onChange(() => drawSchool());
</script>
