<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}} · Approach B (converted slides) · Cakebread Science</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&family=Caladea:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;background:#eeeae0;color:#111}
header{background:#111;color:#eeeae0;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;position:sticky;top:0;z-index:5}
header h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;font-size:26px}
header .sub{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#9a9a9a}
header a{color:#7fd39b;font-size:14px;margin-left:auto}
header button{font:600 13px 'Barlow';background:#00a03a;color:#fff;border:0;padding:6px 12px;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:20px 12px 60px;display:grid;gap:22px}
.slide{position:relative}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:2px solid #111;cursor:pointer;background:#222}
.stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;font-family:'Caladea',Cambria,Georgia,serif;color:#fff}
.sh,.step{position:absolute}
.step{transition:opacity .25s}
body.present .step:not(.shown){opacity:0}
.tx{position:absolute;inset:0;display:flex;flex-direction:column;overflow:visible}
.tx p{margin:0;white-space:pre-wrap}
.tx sub,.tx sup{font-size:65%}
.bu{display:inline-block;width:1.1em;margin-left:-1.1em;text-indent:0}
.tbl{border-collapse:collapse;width:100%;height:100%;font-size:12px}.tbl td{border:1px solid #888;padding:2px 4px}
.cap{display:flex;justify-content:space-between;font-size:13px;color:#555;margin-top:4px}
.hint{color:#005e22;font-weight:600}
.removed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;font:600 22px Barlow;background:repeating-linear-gradient(45deg,#2a2a2a 0 12px,#333 12px 24px)}
.notes{font-size:14px;margin-top:4px}
/* present mode */
body.present .wrap{max-width:none;padding:0;display:block}
body.present .slide{display:none;align-items:center;justify-content:center;background:#000}
body.present .slide.cur{display:flex}
body.present .frame{width:min(100vw,calc(100vh*16/9));border:0}
body.present .cap,body.present .notes{display:none}
</style>
</head>
<body>
<header><h1>{{TITLE}}</h1><span class="sub">Approach B · auto-converted slides (real text &amp; shapes)</span>
<button id="pres">Present ▶</button><span class="sub" style="letter-spacing:0;text-transform:none">or click any slide</span><a href="../">← compare approaches</a></header>
<main class="wrap" id="deck">
{{SLIDES}}
</main>
<script>
// wrap stages in scaling frames + captions
document.querySelectorAll('.slide').forEach(s=>{
  const st=s.querySelector('.stage'), f=document.createElement('div'); f.className='frame';
  st.parentNode.insertBefore(f,st); f.appendChild(st);
  const n=+s.dataset.steps, cap=document.createElement('div'); cap.className='cap';
  cap.innerHTML='<span>Slide '+s.dataset.n+'</span>'+(n?'<span class="hint">'+n+' click-to-reveal step'+(n>1?'s':'')+' in Present mode</span>':'');
  f.after(cap);
  s.shown=0;
});
function step(s,d){
  const n=+s.dataset.steps; if(!n) return false;
  if(d>0&&s.shown>=n) return false; if(d<0&&s.shown<=0) return false;
  s.shown+=d;
  s.querySelectorAll('.step').forEach(e=>e.classList.toggle('shown',+e.dataset.step<=s.shown));
  return true;
}
function fit(){document.querySelectorAll('.frame').forEach(f=>{const w=f.clientWidth; if(w) f.firstChild.style.transform='scale('+(w/960)+')';});}
addEventListener('resize',fit); fit();
window.step=step; window.fit=fit;
</script>
<style>
/* shared presenter navigation (A & B) */
.slide{cursor:pointer}
.pbar{display:none}
body.present{overflow:hidden;background:#000}
body.present header{display:none}
body.present .pbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:center;align-items:center;gap:6px;padding:6px;background:rgba(0,0,0,.6);opacity:.15;transition:opacity .2s}
body.present .pbar:hover,body.present.mouse .pbar{opacity:1}
.pbar button{font:600 16px Barlow,Arial,sans-serif;background:#222;color:#eee;border:1px solid #555;padding:6px 14px;cursor:pointer}
.pbar span{color:#ccc;font:600 15px Barlow,Arial,sans-serif;min-width:70px;text-align:center}
body.present .slide{height:100vh !important}
</style>
<div class="pbar"><button id="pPrev" title="Previous (←)">‹ Back</button><span id="pCount"></span><button id="pNext" title="Next (→, space, click)">Next ›</button><button id="pFull" title="Full screen (F)">⛶ Full screen</button><button id="pExit" title="Exit (Esc)">✕ Exit</button></div>
<script>
(function(){
  const slides=[...document.querySelectorAll('.slide')]; let cur=0;
  const body=document.body, stepFn=window.step||(()=>false), refit=window.fit||(()=>{});
  const isP=()=>body.classList.contains('present');
  function show(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('cur',j==cur));
    document.getElementById('pCount').textContent=(cur+1)+' / '+slides.length; refit();}
  function enter(i){body.classList.add('present');show(i);}
  function exit(){body.classList.remove('present'); if(document.fullscreenElement) document.exitFullscreen(); refit(); slides[cur].scrollIntoView({block:'center'});}
  function next(){ if(!stepFn(slides[cur],1)) show(cur+1); }
  function prev(){ if(!stepFn(slides[cur],-1)) show(cur-1); }
  window.presentNext=next; window.presentPrev=prev;
  slides.forEach((s,i)=>s.addEventListener('click',e=>{
    if(e.target.closest('details,a,video')) return;
    if(!isP()){enter(i);return;}
    const r=s.getBoundingClientRect(); (e.clientX<r.left+r.width/4)?prev():next();
  }));
  document.getElementById('pres').onclick=()=>isP()?exit():enter(cur);
  document.getElementById('pPrev').onclick=prev; document.getElementById('pNext').onclick=next;
  document.getElementById('pExit').onclick=exit;
  const full=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
  document.getElementById('pFull').onclick=full;
  addEventListener('keydown',e=>{
    if(!isP()) return;
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next();}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
    else if(e.key==='Escape') exit();
    else if(e.key==='f'||e.key==='F') full();
  });
  let tx=null; addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',e=>{if(!isP()||tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){d<0?next():prev();}tx=null;});
  let mt; addEventListener('mousemove',()=>{body.classList.add('mouse');clearTimeout(mt);mt=setTimeout(()=>body.classList.remove('mouse'),1500);});
  addEventListener('resize',refit);
})();
</script>

</body>
</html>
