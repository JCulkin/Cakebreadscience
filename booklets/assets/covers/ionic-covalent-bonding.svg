<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Simple line art of covalent overlapping shells and cubic ionic lattice">
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity="0.34">
    <!-- Left motif: Minimalist covalent overlapping outer shells (H2O) -->
    <g transform="translate(526,144)">
      <circle cx="0" cy="-12" r="38" stroke-width="4.5"/>
      <circle cx="-36" cy="24" r="24" stroke-width="4"/>
      <circle cx="36" cy="24" r="24" stroke-width="4"/>
      <!-- Shared pairs: crisp dots and crosses -->
      <circle cx="-23" cy="8" r="3.8" fill="#ffffff" stroke="none"/>
      <path d="M -18 15 L -10 23 M -10 15 L -18 23" stroke-width="3"/>
      <circle cx="23" cy="8" r="3.8" fill="#ffffff" stroke="none"/>
      <path d="M 10 15 L 18 23 M 18 15 L 10 23" stroke-width="3"/>
      <!-- Lone pairs on top of oxygen shell -->
      <circle cx="-12" cy="-50" r="3.4" fill="#ffffff" stroke="none"/>
      <circle cx="-3" cy="-51" r="3.4" fill="#ffffff" stroke="none"/>
      <circle cx="3" cy="-51" r="3.4" fill="#ffffff" stroke="none"/>
      <circle cx="12" cy="-50" r="3.4" fill="#ffffff" stroke="none"/>
    </g>

    <!-- Right motif: Minimalist wireframe cubic ionic lattice -->
    <g transform="translate(692,150)">
      <!-- Back edges (dashed for clean depth) -->
      <path d="M 0 -76 L -50 -46 M 0 -76 L 50 -46 M 0 -76 L 0 26 M 0 26 L -50 56 M 0 26 L 50 56" stroke-width="2.6" stroke-dasharray="6 6" opacity="0.65"/>
      <!-- Front wireframe cube edges -->
      <path d="M -50 -46 L 0 -16 L 50 -46 M -50 -46 L -50 56 L 0 86 L 50 56 L 50 -46 M 0 -16 L 0 86" stroke-width="4.2"/>
      <!-- Clean lattice corner nodes (hollow vs filled for alternating ions) -->
      <circle cx="0" cy="-76" r="7.5" fill="#ffffff" stroke="none" opacity="0.7"/>
      <circle cx="-50" cy="-46" r="9.5" stroke-width="3.8"/>
      <circle cx="50" cy="-46" r="9.5" stroke-width="3.8"/>
      <circle cx="0" cy="-16" r="9.5" fill="#ffffff" stroke="none"/>
      <circle cx="-50" cy="56" r="9.5" fill="#ffffff" stroke="none"/>
      <circle cx="50" cy="56" r="9.5" fill="#ffffff" stroke="none"/>
      <circle cx="0" cy="86" r="9.5" stroke-width="3.8"/>
    </g>
  </g>
</svg>
