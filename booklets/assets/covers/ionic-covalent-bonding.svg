<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Ionic lattice, covalent dot-and-cross molecule and graphite honeycomb illustration">
  <defs>
    <linearGradient id="bg-chem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58000e"/>
      <stop offset="52%" stop-color="#8c0013"/>
      <stop offset="100%" stop-color="#ad0d26"/>
    </linearGradient>
    <linearGradient id="stage-chem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0009" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#280006" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="glow-chem" cx="68%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#ff9aa8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff9aa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ion-na" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffeaad"/>
      <stop offset="55%" stop-color="#f2b63d"/>
      <stop offset="100%" stop-color="#b87408"/>
    </radialGradient>
    <radialGradient id="ion-cl" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f6ccd2"/>
      <stop offset="100%" stop-color="#c97d89"/>
    </radialGradient>
    <pattern id="grid-chem" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Editorial crimson ground + technical grid -->
  <rect width="800" height="300" fill="url(#bg-chem)"/>
  <rect width="800" height="300" fill="url(#grid-chem)"/>
  <rect width="800" height="300" fill="url(#glow-chem)"/>

  <!-- Subtle sweeping orbital arcs across left text zone -->
  <g fill="none" stroke="#ffd5dc" stroke-opacity="0.11" stroke-width="1.5">
    <circle cx="95" cy="285" r="140"/>
    <circle cx="95" cy="285" r="215" stroke-dasharray="6 8"/>
    <circle cx="95" cy="285" r="290"/>
  </g>

  <!-- Angled architectural backdrop framing the illustration stage -->
  <polygon points="445,0 800,0 800,300 395,300" fill="url(#stage-chem)"/>
  <line x1="445" y1="0" x2="395" y2="300" stroke="#f7a8b4" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- Subtle structural guide arc linking the three motifs -->
  <path d="M 485 110 C 545 118, 595 148, 635 168" fill="none" stroke="#ffd2da" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- ============================================================
       MOTIF 1 (Top-centre-right): Graphite Hexagonal Carbon Sheet
       Safe region: x 462..588, y 46..134
       ============================================================ -->
  <g transform="translate(468,52)">
    <!-- Weak intermolecular layer dashes underneath -->
    <g stroke="#f4aab4" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="3 3">
      <line x1="20" y1="68" x2="20" y2="82"/>
      <line x1="56" y1="68" x2="56" y2="82"/>
      <line x1="92" y1="68" x2="92" y2="82"/>
    </g>
    <!-- Ghost lower graphite layer hint -->
    <polyline points="4,82 20,74 38,82 56,74 74,82 92,74 108,82" fill="none" stroke="#ffd5dc" stroke-opacity="0.34" stroke-width="1.4"/>

    <!-- Upper hexagonal carbon rings (3 interlocking hexagons) -->
    <g fill="#ffffff" fill-opacity="0.06" stroke="#fff4f6" stroke-width="2" stroke-linejoin="round">
      <!-- Hex 1 (left) -->
      <polygon points="20,10 38,20 38,40 20,50 2,40 2,20"/>
      <!-- Hex 2 (right) -->
      <polygon points="56,10 74,20 74,40 56,50 38,40 38,20"/>
      <!-- Hex 3 (lower middle) -->
      <polygon points="38,40 56,50 56,70 38,80 20,70 20,50"/>
      <!-- Partial bond extensions -->
      <line x1="74" y1="20" x2="92" y2="10"/>
      <line x1="74" y1="40" x2="92" y2="50"/>
      <line x1="92" y1="50" x2="92" y2="70"/>
      <line x1="56" y1="70" x2="74" y2="80"/>
      <line x1="74" y1="80" x2="92" y2="70"/>
    </g>
    <!-- Carbon atom nodes -->
    <g fill="#fff8f0" stroke="#47000c" stroke-width="1.5">
      <circle cx="20" cy="10" r="4.2"/><circle cx="38" cy="20" r="4.2"/><circle cx="38" cy="40" r="4.2"/>
      <circle cx="20" cy="50" r="4.2"/><circle cx="2" cy="40" r="4.2"/><circle cx="2" cy="20" r="4.2"/>
      <circle cx="56" cy="10" r="4.2"/><circle cx="74" cy="20" r="4.2"/><circle cx="74" cy="40" r="4.2"/>
      <circle cx="56" cy="50" r="4.2"/><circle cx="56" cy="70" r="4.2"/><circle cx="38" cy="80" r="4.2"/>
      <circle cx="20" cy="70" r="4.2"/><circle cx="92" cy="50" r="4.2"/><circle cx="92" cy="70" r="4.2"/>
      <circle cx="74" cy="80" r="4.2"/>
    </g>
  </g>

  <!-- ============================================================
       MOTIF 2 (Bottom-centre-right): Covalent Dot-and-Cross (H2O)
       Safe region: x 452..608, y 146..254
       ============================================================ -->
  <g transform="translate(530,192)">
    <!-- Subtle circular badge halo -->
    <circle cx="0" cy="6" r="56" fill="#3a0009" fill-opacity="0.38" stroke="#f7a8b4" stroke-opacity="0.28" stroke-width="1.2"/>

    <!-- Oxygen outer shell -->
    <circle cx="0" cy="-4" r="33" fill="none" stroke="#fff8f0" stroke-width="2.2"/>
    <!-- Left Hydrogen shell -->
    <circle cx="-32" cy="24" r="20" fill="none" stroke="#f7b7c1" stroke-width="2"/>
    <!-- Right Hydrogen shell -->
    <circle cx="32" cy="24" r="20" fill="none" stroke="#f7b7c1" stroke-width="2"/>

    <!-- Element symbols -->
    <text x="0" y="2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="16" fill="#fff8f0">O</text>
    <text x="-38" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" fill="#ffd9df">H</text>
    <text x="38" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" fill="#ffd9df">H</text>

    <!-- Oxygen lone pairs (top, 2 pairs of crisp dots) -->
    <g fill="#fff8f0" stroke="#47000c" stroke-width="1.1">
      <circle cx="-13" cy="-35" r="3.6"/>
      <circle cx="-4" cy="-37" r="3.6"/>
      <circle cx="4" cy="-37" r="3.6"/>
      <circle cx="13" cy="-35" r="3.6"/>
    </g>

    <!-- Left shared pair (1 dot + 1 gold cross) in overlap around (-18, 12) -->
    <circle cx="-22" cy="9" r="3.8" fill="#fff8f0" stroke="#47000c" stroke-width="1.1"/>
    <g stroke="#f6c453" stroke-width="2.4" stroke-linecap="round">
      <line x1="-17" y1="14" x2="-10" y2="21"/>
      <line x1="-10" y1="14" x2="-17" y2="21"/>
    </g>

    <!-- Right shared pair (1 dot + 1 gold cross) in overlap around (18, 12) -->
    <circle cx="22" cy="9" r="3.8" fill="#fff8f0" stroke="#47000c" stroke-width="1.1"/>
    <g stroke="#f6c453" stroke-width="2.4" stroke-linecap="round">
      <line x1="10" y1="14" x2="17" y2="21"/>
      <line x1="17" y1="14" x2="10" y2="21"/>
    </g>
  </g>

  <!-- ============================================================
       MOTIF 3 (Right hero): 3D Isometric Giant Ionic Lattice (NaCl)
       2x2x2 cube centred at (692, 150)
       Basis: x_iso = (-42, 21), y_iso = (42, 21), z_iso = (0, 46)
       Safe region: x 624..762, y 54..246
       Vertices:
         (0,0,0) back-top:      (692,  76)
         (1,0,0) left-top:      (644, 100)
         (0,1,0) right-top:     (740, 100)
         (1,1,0) front-top:     (692, 124)
         (0,0,1) back-bottom:   (692, 140)
         (1,0,1) left-bottom:   (644, 164)
         (0,1,1) right-bottom:  (740, 164)
         (1,1,1) front-bottom:  (692, 188)
       Extended 2nd bottom layer for taller crystal silhouette:
         (1,0,2) left-base:     (644, 216)
         (0,1,2) right-base:    (740, 216)
         (1,1,2) front-base:    (692, 240)
       ============================================================ -->
  <g>
    <!-- Back lattice struts -->
    <g stroke="#f7b7c1" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round">
      <line x1="692" y1="76" x2="644" y2="100"/>
      <line x1="692" y1="76" x2="740" y2="100"/>
      <line x1="692" y1="76" x2="692" y2="140"/>
      <line x1="692" y1="140" x2="644" y2="164"/>
      <line x1="692" y1="140" x2="740" y2="164"/>
      <line x1="692" y1="140" x2="692" y2="192"/>
    </g>

    <!-- Back layer ions -->
    <!-- (0,0,0) Cl- -->
    <circle cx="692" cy="76" r="15" fill="url(#ion-cl)" stroke="#47000c" stroke-width="1.8" opacity="0.88"/>
    <text x="692" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#58000e">−</text>

    <!-- (0,0,1) Na+ (interior) -->
    <circle cx="692" cy="140" r="11" fill="url(#ion-na)" stroke="#47000c" stroke-width="1.6" opacity="0.8"/>

    <!-- Mid-layer struts -->
    <g stroke="#fff4f6" stroke-opacity="0.82" stroke-width="2.8" stroke-linecap="round">
      <line x1="644" y1="100" x2="692" y2="124"/>
      <line x1="740" y1="100" x2="692" y2="124"/>
      <line x1="644" y1="100" x2="644" y2="164"/>
      <line x1="740" y1="100" x2="740" y2="164"/>
      <line x1="644" y1="164" x2="644" y2="216"/>
      <line x1="740" y1="164" x2="740" y2="216"/>
    </g>

    <!-- Mid layer ions -->
    <!-- (1,0,0) Na+ -->
    <circle cx="644" cy="100" r="13.5" fill="url(#ion-na)" stroke="#3d0009" stroke-width="2"/>
    <text x="644" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#3d0009">+</text>
    <!-- (0,1,0) Na+ -->
    <circle cx="740" cy="100" r="13.5" fill="url(#ion-na)" stroke="#3d0009" stroke-width="2"/>
    <text x="740" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#3d0009">+</text>

    <!-- (1,0,1) Cl- -->
    <circle cx="644" cy="164" r="17.5" fill="url(#ion-cl)" stroke="#3d0009" stroke-width="2"/>
    <text x="644" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#58000e">−</text>
    <!-- (0,1,1) Cl- -->
    <circle cx="740" cy="164" r="17.5" fill="url(#ion-cl)" stroke="#3d0009" stroke-width="2"/>
    <text x="740" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#58000e">−</text>

    <!-- (1,0,2) Na+ -->
    <circle cx="644" cy="216" r="13.5" fill="url(#ion-na)" stroke="#3d0009" stroke-width="2"/>
    <text x="644" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#3d0009">+</text>
    <!-- (0,1,2) Na+ -->
    <circle cx="740" cy="216" r="13.5" fill="url(#ion-na)" stroke="#3d0009" stroke-width="2"/>
    <text x="740" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#3d0009">+</text>

    <!-- Front lattice struts -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <line x1="692" y1="124" x2="692" y2="188"/>
      <line x1="644" y1="164" x2="692" y2="188"/>
      <line x1="740" y1="164" x2="692" y2="188"/>
      <line x1="692" y1="188" x2="692" y2="240"/>
      <line x1="644" y1="216" x2="692" y2="240"/>
      <line x1="740" y1="216" x2="692" y2="240"/>
    </g>

    <!-- Front column ions -->
    <!-- (1,1,0) Cl- -->
    <circle cx="692" cy="124" r="18.5" fill="url(#ion-cl)" stroke="#360008" stroke-width="2.2"/>
    <text x="692" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="19" fill="#58000e">−</text>

    <!-- (1,1,1) Na+ -->
    <circle cx="692" cy="188" r="14.5" fill="url(#ion-na)" stroke="#360008" stroke-width="2.2"/>
    <text x="692" y="193.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#360008">+</text>

    <!-- (1,1,2) Cl- -->
    <circle cx="692" cy="240" r="18.5" fill="url(#ion-cl)" stroke="#360008" stroke-width="2.2"/>
    <text x="692" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="19" fill="#58000e">−</text>
  </g>

  <!-- Crisp right-edge publisher stripe accent -->
  <rect x="789" y="0" width="11" height="300" fill="#f6c453" fill-opacity="0.88"/>
  <rect x="785" y="0" width="4" height="300" fill="#360008" fill-opacity="0.75"/>
</svg>
