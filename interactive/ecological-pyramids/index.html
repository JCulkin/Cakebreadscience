<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecological Pyramids</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            min-height: 100vh;
            padding: 30px 16px;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            padding: 36px 48px;
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            font-size: 2.1em;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 0.95em;
        }

        /* ── Controls ── */
        .controls-section {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-label {
            font-weight: 600;
            color: #555;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .button-group {
            display: flex;
            background: #f2f3f7;
            border-radius: 30px;
            padding: 3px;
            gap: 2px;
        }

        button {
            padding: 7px 16px;
            font-size: 0.88em;
            border: none;
            background: transparent;
            color: #666;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-family: inherit;
        }

        button.active {
            background: #fff;
            color: #1a1a2e;
            font-weight: 700;
            box-shadow: 0 1px 6px rgba(0,0,0,0.14);
        }

        button:hover:not(.active) { color: #1a1a2e; }

        /* ── Pyramid grid layout ── */
        .pyramid-area {
            display: grid;
            grid-template-columns: 1fr 230px;
            margin: 8px 0 6px;
        }

        /* Shape cells */
        .shape-cell {
            height: 72px;
            position: relative;
            cursor: pointer;
        }

        .shape-bg {
            position: absolute;
            inset: 0;
            transition: filter 0.18s;
        }

        .shape-cell:hover .shape-bg { filter: brightness(1.12); }

        .shape-cell.selected .shape-bg {
            filter: brightness(1.18);
            outline: 3px solid #1a1a2e;
            outline-offset: -3px;
        }

        /* Energy transfer rows */
        .transfer-cell {
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72em;
            color: #999;
            font-style: italic;
        }

        .spacer-cell { height: 24px; }

        /* Label cells */
        .label-cell {
            height: 72px;
            display: flex;
            align-items: center;
            padding: 6px 8px 6px 14px;
            cursor: pointer;
            border-left: 3px solid transparent;
            border-radius: 0 8px 8px 0;
            transition: background 0.18s, border-color 0.18s;
        }

        .label-cell:hover,
        .label-cell.selected {
            background: #f0f4ff;
            border-left-color: #1a1a2e;
        }

        .label-name {
            font-weight: 700;
            font-size: 0.82em;
            color: #222;
            margin-bottom: 1px;
        }

        .label-value {
            font-size: 0.78em;
            color: #1a1a2e;
            font-weight: 600;
        }

        .label-detail {
            font-size: 0.73em;
            color: #888;
        }

        /* ── Food chain diagram (distinct, separated section) ── */
        .food-chain-section {
            margin: 40px 0 18px;
            padding: 20px 22px;
            background: #fafbfc;
            border: 1px dashed #cdd5e0;
            border-radius: 12px;
        }

        .food-chain-title {
            text-align: center;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #99a2b3;
            margin-bottom: 14px;
        }

        .food-chain {
            display: flex;
            align-items: stretch;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .fc-box {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-width: 110px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 0.85em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .fc-arrow {
            display: flex;
            align-items: center;
            color: #888;
            font-size: 1.3em;
            font-weight: 700;
        }

        @media (max-width: 620px) {
            .food-chain-section { margin: 28px 0 16px; padding: 16px 12px; }
            .fc-box { min-width: 0; flex: 1 1 60px; font-size: 0.72em; padding: 8px 6px; }
            .fc-arrow { font-size: 1em; }
        }

        /* ── Inverted notice ── */
        .inverted-notice {
            text-align: center;
            font-size: 0.82em;
            color: #a93226;
            font-weight: 600;
            margin-bottom: 14px;
            padding: 8px 14px;
            background: #fdf0ed;
            border-radius: 8px;
            border: 1px solid #f5c6bc;
            max-width: 900px;
            display: none;
        }

        /* ── Click hint ── */
        .click-hint {
            text-align: center;
            font-size: 0.75em;
            color: #bbb;
            margin-bottom: 6px;
        }

        /* ── Detail panel ── */
        .detail-panel {
            background: #f8f9fa;
            border-left: 4px solid #1a1a2e;
            border-radius: 0 8px 8px 0;
            padding: 14px 18px;
            margin-bottom: 16px;
            max-width: 900px;
            display: none;
            animation: slideDown 0.2s ease;
        }

        .detail-panel.visible { display: block; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .detail-panel h4 {
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .detail-facts {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .detail-fact {
            font-size: 0.82em;
            color: #444;
            padding-left: 14px;
            position: relative;
            line-height: 1.45;
        }

        .detail-fact::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #1a1a2e;
        }

        /* ── Info panel ── */
        .info-panel {
            background: linear-gradient(135deg, #f0f4ff, #f8f9fa);
            border: 1px solid #d4ddf7;
            border-radius: 10px;
            padding: 18px 22px;
            max-width: 900px;
        }

        .info-panel h3 {
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .inverted-badge {
            display: inline-block;
            background: #a93226;
            color: white;
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        .info-panel p {
            font-size: 0.86em;
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .key-points {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .key-point {
            font-size: 0.83em;
            color: #444;
            padding-left: 16px;
            position: relative;
            line-height: 1.4;
        }

        .key-point::before {
            content: '●';
            position: absolute;
            left: 0;
            color: #1a1a2e;
            font-size: 0.65em;
            top: 4px;
        }

        @media (max-width: 620px) {
            .container { padding: 20px 16px; }
            h1 { font-size: 1.6em; }
            .pyramid-area { grid-template-columns: 1fr 150px; }
            .shape-cell, .label-cell { height: 60px; }
            .transfer-cell, .spacer-cell { height: 20px; }
            .label-value { display: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Ecological Pyramids</h1>
    <p class="subtitle">Explore how numbers, biomass and energy change through food chains</p>

    <div class="controls-section">
        <div class="control-group">
            <span class="control-label">Pyramid type</span>
            <div class="button-group">
                <button class="pyramid-btn active" data-pyramid="numbers">Numbers</button>
                <button class="pyramid-btn" data-pyramid="biomass">Biomass</button>
                <button class="pyramid-btn" data-pyramid="energy">Energy</button>
            </div>
        </div>
        <div class="control-group">
            <span class="control-label">Ecosystem</span>
            <div class="button-group">
                <button class="ecosystem-btn active" data-ecosystem="grassland">Grassland</button>
                <button class="ecosystem-btn" data-ecosystem="oak">Oak Tree</button>
                <button class="ecosystem-btn" data-ecosystem="sea">Sea</button>
                <button class="ecosystem-btn" data-ecosystem="desert">Desert</button>
            </div>
        </div>
    </div>

    <p class="click-hint">Click any level for more detail</p>
    <div class="pyramid-area" id="pyramidGrid"></div>
    <div class="food-chain-section">
        <p class="food-chain-title">The food chain</p>
        <div class="food-chain" id="foodChain"></div>
    </div>
    <div id="invertedNotice" class="inverted-notice"></div>
    <div class="detail-panel" id="detailPanel"></div>
    <div class="info-panel" id="infoPanel"></div>
</div>

<script>

let currentPyramid = 'numbers';
let currentEcosystem = 'grassland';
let selectedIdx = null;

/**
 * Calculate a centred rectangle clip-path for a given width percentage.
 * widthPct: 0–100 — how wide the bar should be as % of the container.
 */
function clipPath(widthPct) {
    const margin = ((100 - widthPct) / 2).toFixed(2);
    const outer  = (100 - parseFloat(margin)).toFixed(2);
    return `polygon(${margin}% 100%, ${outer}% 100%, ${outer}% 0%, ${margin}% 0%)`;
}

/**
 * Convert a raw value to a bar-width percentage using a TRUE linear scale,
 * so each bar's width is directly proportional to its real value
 * (the widest level = 100%). This shows the genuine 10%-per-level drop.
 * minPct: a tiny minimum so even the thinnest bar leaves a faint sliver
 *         rather than vanishing completely. It is deliberately small so the
 *         top level shows its true thinness; the whole shape row stays
 *         clickable regardless of how narrow the coloured bar is.
 */
function toWidthPct(rawValue, maxRaw, minPct = 0.25) {
    return Math.max(minPct, (rawValue / maxRaw) * 100);
}

function render() {
    const data = pyramidData[currentEcosystem][currentPyramid];
    const inverted = data.inverted || false;

    selectedIdx = null;
    document.getElementById('detailPanel').classList.remove('visible');

    // Inverted notice (worded for the pyramid type being shown)
    const notice = document.getElementById('invertedNotice');
    if (inverted) {
        notice.textContent = currentPyramid === 'numbers'
            ? '⚠ This is an unusual pyramid of numbers — one large producer (the tree) supports thousands of small consumers, so the bottom row is tiny.'
            : '⚠ This is an inverted pyramid of biomass — the consumers have more mass than the producers at any one moment.';
        notice.style.display = 'block';
    } else {
        notice.style.display = 'none';
    }

    // Build display order: apex at top of screen, base at bottom
    // Both normal and inverted: reverse data.levels so [top_predators, …, producers]
    const displayLevels = [...data.levels].reverse();
    const N = displayLevels.length;

    // Find the maximum raw value across all levels (used to set the widest bar = 100%)
    const maxRaw = Math.max(...displayLevels.map(l => l.rawValue));

    const grid = document.getElementById('pyramidGrid');
    grid.innerHTML = '';

    displayLevels.forEach((level, i) => {
        // Data index (0 = producers) for colour lookup
        const dataIdx = N - 1 - i;

        // Width of this bar as a percentage, based on its raw value
        const wPct = toWidthPct(level.rawValue, maxRaw);

        // ── Shape cell ──
        const shapeCell = document.createElement('div');
        shapeCell.className = 'shape-cell';
        shapeCell.dataset.idx = i;

        const bg = document.createElement('div');
        bg.className = 'shape-bg';
        bg.style.background = COLORS[dataIdx];
        bg.style.clipPath = clipPath(wPct);
        shapeCell.appendChild(bg);

        // ── Label cell ──
        const labelCell = document.createElement('div');
        labelCell.className = 'label-cell';
        labelCell.dataset.idx = i;
        labelCell.innerHTML = `
            <div>
                <div class="label-name">${level.name}</div>
                <div class="label-value">${level.value}</div>
                <div class="label-detail">${level.detail}</div>
            </div>`;

        // Click handlers (both cells toggle the detail panel)
        [shapeCell, labelCell].forEach(el => {
            el.addEventListener('click', () => handleLevelClick(i, displayLevels));
        });

        grid.appendChild(shapeCell);
        grid.appendChild(labelCell);
    });

    // ── Food chain diagram (boxes, producer → top predator) ──
    const fc = document.getElementById('foodChain');
    fc.innerHTML = '';
    data.levels.forEach((level, idx) => {
        const box = document.createElement('div');
        box.className = 'fc-box';
        box.style.background = COLORS[idx];
        box.textContent = level.detail;
        fc.appendChild(box);
        if (idx < data.levels.length - 1) {
            const arrow = document.createElement('div');
            arrow.className = 'fc-arrow';
            arrow.textContent = '→';
            fc.appendChild(arrow);
        }
    });

    // Info panel
    const badge = inverted ? ' <span class="inverted-badge">INVERTED</span>' : '';
    const kpHTML = data.keyPoints.map(p => `<div class="key-point">${p}</div>`).join('');
    document.getElementById('infoPanel').innerHTML = `
        <h3>${data.title}${badge}</h3>
        <p>${data.description}</p>
        <div class="key-points">${kpHTML}</div>`;
}

function handleLevelClick(displayIdx, displayLevels) {
    const panel = document.getElementById('detailPanel');
    const allCells = document.querySelectorAll('[data-idx]');

    if (selectedIdx === displayIdx) {
        // Deselect
        selectedIdx = null;
        allCells.forEach(el => el.classList.remove('selected'));
        panel.classList.remove('visible');
        return;
    }

    selectedIdx = displayIdx;
    allCells.forEach(el => {
        el.classList.toggle('selected', el.dataset.idx == displayIdx);
    });

    const level = displayLevels[displayIdx];
    const factsHTML = level.facts.map(f => `<div class="detail-fact">${f}</div>`).join('');
    panel.innerHTML = `
        <h4>${level.name} — ${level.value} (${level.detail})</h4>
        <div class="detail-facts">${factsHTML}</div>`;
    panel.classList.add('visible');
}

document.querySelectorAll('.pyramid-btn').forEach(btn => {
    btn.addEventListener('click', function () {
        document.querySelectorAll('.pyramid-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentPyramid = this.dataset.pyramid;
        render();
    });
});

document.querySelectorAll('.ecosystem-btn').forEach(btn => {
    btn.addEventListener('click', function () {
        document.querySelectorAll('.ecosystem-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentEcosystem = this.dataset.ecosystem;
        render();
    });
});

render();
</script>
