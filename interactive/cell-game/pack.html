const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function zip(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){const name=enc.encode(f.name),d=f.data,crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,d);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);off+=30+name.length+d.length;}
  const csize=central.reduce((s,a)=>s+a.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'});}
document.getElementById('go').onclick=async function(){this.disabled=true;const log=document.getElementById('log'),bar=document.getElementById('bar');const files=[],failed=[];let done=0;
  const one=async p=>{for(let t=0;t<3;t++){try{const r=await fetch(p.url);if(!r.ok)throw new Error(r.status);files.push({name:'cell-images/'+p.file,data:new Uint8Array(await r.arrayBuffer())});return;}catch(e){await new Promise(r=>setTimeout(r,800*(t+1)));}}failed.push(p.file);};
  const q=PACK.slice();const workers=Array.from({length:4},async()=>{while(q.length){const p=q.shift();await one(p);done++;bar.style.width=(done/PACK.length*100)+'%';log.textContent='Fetched '+done+' of '+PACK.length+(failed.length?' ('+failed.length+' failed)':'');}});
  await Promise.all(workers);

  const credits=PACK.filter(p=>!failed.includes(p.file)).map(p=>p.file+'\n  '+p.title+'\n  By: '+(p.artist||'unknown')+' | Licence: '+p.lic+(p.licUrl?' ('+p.licUrl+')':'')+'\n  Source: '+p.page).join('\n\n');

  files.push({name:'cell-images/credits.json',data:enc.encode(JSON.stringify(PACK.filter(p=>!failed.includes(p.file)),null,1))});
