<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Wardrobe - Breadventure Land</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--green:#005e22;--green2:#00a03a;--ink:#111;--cream:#eeeae0;--paper:#fff;--muted:#555;--line:#d8d3c4;--soft:#f6f4ee;
  --common:#9ca3af;--uncommon:#2e9d4a;--rare:#2563eb;--lowkey:#8b5cf6;--unhinged:#ea580c;--legend:#d4a017}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow','Arial Narrow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.45;font-size:16px}
header{background:#111;padding:18px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
@media(min-width:700px){header{padding:22px 40px 18px}}
header a{text-decoration:none}
header .brand{font-family:'Barlow Condensed',sans-serif;font-size:clamp(26px,5vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:-1px;color:var(--cream);line-height:1}
header .brand span{color:var(--green2)}
header .sub{font-size:13px;text-transform:uppercase;letter-spacing:3px;color:#888}
.wrap{max-width:1050px;margin:0 auto;padding:20px 16px 64px}
.back{display:inline-block;margin-bottom:12px;color:var(--green);font-weight:600;text-decoration:none}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(34px,7vw,56px);line-height:.95}
.flag{display:inline-block;background:#ffe14d;border:2px solid var(--ink);font-weight:700;font-size:13px;padding:2px 8px;text-transform:uppercase;letter-spacing:1px;margin-top:10px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--ink);color:var(--cream);border:2px solid var(--ink);padding:9px 16px;font-weight:700}
.btn.alt{background:var(--paper);color:var(--ink)}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
.layout{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
@media(min-width:820px){.layout{grid-template-columns:300px 1fr}.me{position:sticky;top:12px;align-self:start}}
.card{background:var(--paper);border:2px solid var(--ink);padding:16px}
.me{text-align:center}
.me #fig{width:100%;max-width:240px;display:block;margin:4px auto}
.nm{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;text-transform:uppercase;line-height:1}
.ttl{font-style:italic;color:var(--muted)}
.stats{display:flex;justify-content:center;gap:14px;font-weight:700;font-size:14px;margin-top:4px}
.set{font-size:13px;margin-top:8px;color:var(--muted)}
.set b{color:var(--ink)}
.me a{color:var(--green);font-weight:700;font-size:14px}
/* slot bar */
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot.lk{opacity:.5}.slot.lk .lock{display:block;font-size:11px;color:#b45309}
.locked{padding:14px;border:2px dashed var(--line);text-align:center;font-size:15px}.locked .pb{height:10px;border:2px solid #111;background:#fff;margin:8px auto 0;max-width:260px}.locked .pb i{display:block;height:100%;background:#facc15}
.slot{border:2px solid var(--line);background:var(--soft);border-radius:10px;padding:4px 2px;text-align:center;font-size:12px;font-weight:700;line-height:1.1}
.slot img{width:100%;max-width:56px;aspect-ratio:1;display:block;margin:0 auto 2px;object-fit:contain}
.slot .empty{width:56px;max-width:100%;aspect-ratio:1;margin:0 auto 2px;display:grid;place-items:center;color:#bbb;font-size:22px}
.slot.on{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 2px var(--green2)}
.slot .n{display:block;font-size:11px;color:var(--muted);font-weight:600}
/* items for one slot */
.shelfhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.shelfhead h2{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.it{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px 0;text-align:center;font-size:13px;font-weight:700;line-height:1.1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.it img{width:72px;height:72px;margin:0 auto 4px;object-fit:contain}
.it .lbl{padding:0 2px 8px;flex:1}
.it::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--r)}
.it.sel{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--green2)}
.it .wearing{position:absolute;top:4px;right:4px;background:var(--ink);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.it.more{border-style:dashed;color:var(--muted);justify-content:center;min-height:120px;font-weight:600}
.it.more::after{display:none}
.it.more b{font-size:26px;color:var(--ink);display:block}
.r-common{--r:var(--common)}.r-uncommon{--r:var(--uncommon)}.r-rare{--r:var(--rare)}.r-lowkey{--r:var(--lowkey)}.r-unhinged{--r:linear-gradient(90deg,#ea580c,#db2777,#7c3aed)}.r-legend{--r:var(--legend)}
/* detail */
.detail{display:flex;gap:14px;align-items:flex-start;margin-top:14px;border-top:5px solid var(--r);background:#fff;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:12px}
.detail.r-unhinged{border-top-color:var(--unhinged)}
.detail img{width:110px;height:110px;flex:none;object-fit:contain;background:var(--soft);border-radius:10px;padding:6px}
.detail .rar{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.detail .dn{font-weight:700;font-size:21px;line-height:1.1}
.detail .dd{font-style:italic;margin:4px 0}
.detail .ds{font-size:13px;color:var(--muted)}
.detail .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.it.lk img{opacity:.45;filter:grayscale(.6)}.it .lock{position:absolute;top:4px;left:4px;background:#fff7ed;color:#b45309;font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid #fdba74}
.tag{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#fff;background:var(--c);padding:2px 8px;border-radius:4px}
.r-unhinged .tag{background:linear-gradient(90deg,#ea580c,#db2777,#7c3aed)}
.detail .dst{font-weight:700;font-size:15px;margin-top:4px}.detail .dfx{font-weight:700;color:#7c2d12;font-size:14px}
.gear{font-size:14px;margin-top:8px;text-align:left;background:var(--soft);border:2px solid var(--line);border-radius:8px;padding:8px 10px}.gear ul{margin:4px 0 0 18px}
.setok{margin-top:8px;font-size:14px;text-align:left;border:2px solid var(--g);border-radius:8px;padding:8px 10px;background:#fff}
.hints{margin-top:12px;background:#fff;border:2px dashed #aaa;padding:10px 14px;font-size:14px}
.hints li{margin:4px 0 0 18px}
@media(max-width:520px){.detail{flex-direction:column;align-items:center;text-align:center}.detail .acts{justify-content:center}}
</style>
</head>
<body>
<header><a class="brand" href="/">Cakebread<span>Science</span></a><span class="sub">Breadventure Land · Wardrobe</span></header>
<div class="wrap">
  <h1>Wardrobe</h1>

  <div class="layout">
    <div class="card me">
      <div class="nm" id="nm"></div>
      <div class="ttl" id="ttl"></div>
      <img id="fig" class="px" alt="Your adventurer wearing the chosen items">
      <div class="set" id="set"></div>
      <div style="margin-top:10px"><a href="adventurer-create.html">✏️ Change my look</a> · <a href="adventurer-home.html">🧁 Cakelab</a></div>
    </div>

    <div>
      <div class="slots" id="slots" role="tablist" aria-label="Slots"></div>
      <div class="shelfhead"><h2 id="slotName"></h2><span class="small" id="count" style="color:var(--muted);font-size:14px"></span></div>
      <div class="grid" id="grid"></div>
      <div id="detail"></div>
      <div id="hints"></div>
    </div>
  </div>
</div>

<script src="/js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="spec.js"></script>
<script src="questions.js"></script>
<script src="gens.js"></script>
<script src="diagq.js"></script>
<script src="/js/course.js"></script>
<script src="cards.js"></script>
<script src="questing-engine.js"></script>
<script src="adventurer-items.js"></script>
<script src="adventurer-pixel.js"></script>
<script src="adventurer-shell.js"></script>
<script>
ADV.nav('wardrobe');
const KEY_BASE = 'cbs.adventurer.base', KEY_EQ = 'cbs.adventurer.eq';
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
let base = load(KEY_BASE) || PIXEL.DEFAULT;
const byId = Object.fromEntries(ADV_ITEMS.map(i => [i.id, i]));
/* what you own: the starter outfit + everything missions have dropped (saved in your account) + any Main Character item you hold (most correct in its science over the last 7 days) */
const STARTER = ADV_ITEMS.filter(i => i.from === 'Starter outfit').map(i => i.id);
const OWNED = new Set([...STARTER, ...(ADV.S.bag || [])]);
const HOLDERS = {};
let eq = ADV.eq();
/* keep Main Character items worn until the board confirms whether you still hold them */
function pruneEq(includeLegend) {
  for (const k in eq) {
    const id = eq[k], it = id && byId[id];
    if (!id || OWNED.has(id) || (!includeLegend && it && it.legend)) continue;
    const st = ADV_ITEMS.find(i => ADV_FITS(i, k) && i.from === 'Starter outfit' && (i.slot !== 'hand' || i.side === k[0]));
    eq[k] = st ? st.id : null;
  }
}
pruneEq(false);
/* Main Character items: whoever has the most correct answers in that science over the last 7 days holds it */
QE.onChange(() => {
  base = ADV.look();
  (ADV.S.bag || []).forEach(id => OWNED.add(id));
  if (!QE.user || HOLDERS._done) { render(); return; }
  HOLDERS._done = true;
  QE.board().then(rows => {
    [['syringe', 'B'], ['pebble', 'C'], ['dodgeball', 'P']].forEach(([id, f]) => { const b = rows.filter(r => r.l7[f] > 0).sort((a, c) => c.l7[f] - a.l7[f])[0]; if (b) { HOLDERS[id] = b.me ? 'you' : b.name; if (b.me) OWNED.add(id); } });
    pruneEq(true);
    render();
  }).catch(() => render());
});
let slot = 'top', sel = eq.top || null;   // tops first: hats are level 2+, two-handed items level 3+
const PIC = {}; const pic = id => PIC[id] || (PIC[id] = PIXEL.item(id));
const SUBJ = {b: 'Biology', c: 'Chemistry', p: 'Physics'};
const RANK = {common: 0, uncommon: 1, rare: 2, lowkey: 3, unhinged: 4, legend: 5};
/* 22 Nov: items add Strength/Health/Magic and maybe do something (fx); hand items go in either hand, some need both;
   4+ slots from one science (remaining slots can hold anything) = a set bonus and a glow (adventurer-items.js) */
const lvNow = () => ADV.stats().l;
const canWear = i => i.from === 'Starter outfit' || !!i.legend || (i.lv || 1) <= lvNow();
function setLine(g) {
  if (g.set) { const S = ADV_SETS[g.set], st = ADV.stats(); return `<div class="setok" style="--g:${S.col}">✨ <b>${S.name} set!</b> +${st.set} ${ADV_STAT[S.stat][0]} ${ADV_STAT[S.stat][1]} (15%), ${ADV_FX_TXT(S.fx)[0].replace(/^./, c => c.toLowerCase())}, and you glow.</div>`; }
  const c = {}; Object.entries(eq).forEach(([k, id]) => { const i = byId[id]; if (i && ADV_FITS(i, k) && i.s) c[i.s] = (c[i.s] || 0) + 1; });
  const best = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return best ? `<div class="small">${SUBJ[best[0]]} set: ${best[1]}/4 slots. Wear 4 or more ${SUBJ[best[0]]} items (your other slots can hold anything) for +15% ${ADV_STAT[ADV_SETS[best[0]].stat][1]} and a glow.</div>`
    : `<div class="small">Wear 4 or more items from one science (your other slots can hold anything) for a set bonus and a glow.</div>`;
}
function gearBox() {
  const g = ADV_GEAR(eq), st = ['str', 'hp', 'mag'].filter(k => g[k]).map(k => `${g[k] > 0 ? '+' : '−'}${Math.abs(g[k])} ${ADV_STAT[k][0]}`).join(' ');
  const fx = ADV_FX_TXT(g.fx);
  return `<div class="gear"><b>Your gear:</b> ${st || 'nothing extra yet'}${fx.length ? `<ul>${fx.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}</div>${setLine(g)}`;
}
function render() {
  document.getElementById('fig').src = PIXEL.figure(eq, base);
  document.getElementById('nm').textContent = ADV.nick();
  const g = ADV_GEAR(eq);
  document.getElementById('ttl').textContent = '“' + (g.set ? ADV_SETS[g.set].title : 'Side Quest Enjoyer') + '”';
  document.getElementById('set').innerHTML = gearBox();

  document.getElementById('slots').innerHTML = ADV_SLOTS.map(s => {
    const id = eq[s.k], two = id && byId[id] && byId[id].two;
    return `<button class="slot ${slot === s.k ? 'on' : ''}" role="tab" aria-selected="${slot === s.k}" data-slot="${s.k}">
      ${id ? `<img class="px" src="${pic(id)}" alt="">` : '<div class="empty">＋</div>'}${s.name}${two ? '<span class="n">both hands</span>' : ''}</button>`;
  }).join('');

  const mine = ADV_ITEMS.filter(i => ADV_FITS(i, slot) && OWNED.has(i.id)).sort((a, b) => (a.lv || 1) - (b.lv || 1) || RANK[a.r] - RANK[b.r]);   // only what you've got (no "still to find": the Stats page has completion)
  document.getElementById('slotName').textContent = ADV_SLOTS.find(s => s.k === slot).name;
  document.getElementById('count').textContent = slot.endsWith('hand') ? 'Anything you hold can go in either hand' : '';
  document.getElementById('grid').innerHTML = mine.map(i => `<button class="it r-${i.r} ${sel === i.id ? 'sel' : ''} ${canWear(i) ? '' : 'lk'}" data-id="${i.id}">
      ${eq[slot] === i.id ? '<span class="wearing">ON</span>' : ''}${canWear(i) ? '' : `<span class="lock">🔒 Lv ${i.lv}</span>`}<img class="px" src="${pic(i.id)}" alt=""><span class="lbl">${i.name}</span></button>`).join('')
    || `<div class="locked" style="grid-column:1/-1">Nothing here yet. Missions, flashcards, dungeons, bosses and treasure chests all drop things to wear.</div>`;

  const it = sel && byId[sel] && ADV_FITS(byId[sel], slot) ? byId[sel] : null;
  const fx = it ? ADV_FX_TXT(it.fx) : [];
  document.getElementById('detail').innerHTML = it ? `<div class="detail r-${it.r}">
      <img class="px" src="${pic(it.id)}" alt="">
      <div><span class="tag" style="--c:var(--${it.r})">${ADV_TAG(it)}</span>
        <div class="dn">${it.name}</div>
        <div class="ds">${ADV_WHERE(it)}${it.s ? ` · <b style="color:${ADV_SETS[it.s].col}">${SUBJ[it.s]}</b>` : ''}</div>
        ${ADV_STATS_TXT(it) ? `<div class="dst">${ADV_STATS_TXT(it)}</div>` : ''}${fx.map(f => `<div class="dfx">★ ${f}</div>`).join('')}
        <div class="dd">${it.d}</div>
        <div class="ds">Got it from: ${it.legend ? 'top of the ' + it.legend + ' board over the last 7 days — keep practising to keep it!' : it.from}</div>
        <div class="acts">${eq[slot] === it.id ? `<button class="btn alt" data-off="1">Take it off</button>`
          : !canWear(it) ? `<span class="small">🔒 You can wear this from level ${it.lv} (you're level ${lvNow()}). Secure spec points and keep revising to level up.</span>`
          : `<button class="btn" data-wear="${it.id}">${it.two ? 'Hold it in both hands' : slot.endsWith('hand') ? `Hold it in your ${slot === 'rhand' ? 'right' : 'left'} hand` : 'Wear it'}</button>`}</div></div></div>` : '';
  document.getElementById('hints').innerHTML = '';
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-slot]');
  if (s) { slot = s.dataset.slot; sel = eq[slot] || null; render(); return; }
  const w = e.target.closest('[data-wear]');
  if (w) { const i = byId[w.dataset.wear]; if (i && canWear(i)) { eq = ADV_PUT(eq, i, slot); save(); QE.log('👕', `Put on ${i.name}`); } render(); return; }
  if (e.target.closest('[data-off]')) { eq = ADV_OFF(eq, slot); save(); render(); return; }
  const t = e.target.closest('.it[data-id]');
  if (t) { sel = t.dataset.id; render(); }
});
function save() { try { localStorage.setItem(KEY_EQ, JSON.stringify(eq)); } catch (e) {} QE.syncLook(); }
render();
</script>
</body>
</html>
