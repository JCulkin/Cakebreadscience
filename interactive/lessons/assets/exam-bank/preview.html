<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Synthetic Exam Bank Preview · Cakebread Science</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/interactive/lessons/assets/exam-bank.css">
<style>
:root{--ink:#111;--cream:#eeeae0;--acc:#005e22}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.45;min-height:100vh}
body.subj-biology{--acc:#005e22}
body.subj-chemistry{--acc:#c8001e}
body.subj-physics{--acc:#d08000}
.hd{background:#111;color:#eeeae0;padding:18px 20px;border-bottom:6px solid var(--acc)}
.hd h1{font:900 clamp(26px,5vw,42px)/1 'Barlow Condensed',sans-serif;text-transform:uppercase}
.hd p{color:#ccc;margin-top:6px;max-width:860px;font-size:15.5px}
.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid #111;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button{font:700 14.5px 'Barlow',Arial,sans-serif;padding:7px 12px;border:2px solid #111;background:#fff;color:#111;border-radius:6px;cursor:pointer}
.bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar .sep{width:2px;height:24px;background:#ddd;margin:0 4px}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 64px}
.topic-meta{background:#fff8d6;border-left:6px solid #c9a000;padding:10px 14px;margin-bottom:18px;font-size:15px}
.hide-da .da-only{display:none!important}
.embed-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#f5f2e9;border:1.5px solid #111;border-top:none;padding:7px 14px;margin:-18px 0 22px;border-radius:0 0 8px 8px;font:600 13px/1.3 'Barlow',Arial,sans-serif}
.embed-bar code{background:#fff;border:1px solid #bbb;padding:2px 6px;border-radius:4px;font-size:12.5px}
.embed-bar button{font:700 13px 'Barlow',Arial,sans-serif;padding:4px 10px;border:1.5px solid #111;background:#fff;border-radius:5px;cursor:pointer}
/* Scaled 16:9 projector preview frame */
.slide-shell{background:#111;padding:14px;border-radius:12px;margin-bottom:24px}
.slide-frame{position:relative;width:100%;aspect-ratio:16/9;background:#eeeae0;overflow:hidden;border-radius:6px}
.slide-inner{position:absolute;left:0;top:0;width:1600px;height:900px;padding:42px 52px;transform-origin:0 0;background:#eeeae0;border-top:12px solid var(--acc)}
.slide-ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;color:#eeeae0;font-size:14px}
.slide-ctrl button{font:700 14px 'Barlow',Arial,sans-serif;padding:6px 12px;border:2px solid #eeeae0;background:#222;color:#eeeae0;border-radius:6px;cursor:pointer}
.slide-ctrl button.on{background:#1b5e20;border-color:#1b5e20}
.slide-inner [data-s="1"]{opacity:0;transition:opacity .18s}
.slide-inner.revealed [data-s="1"]{opacity:1}
</style>
</head>
<body class="subj-biology">
<header class="hd">
  <h1>Synthetic Exam Bank · Pilot Preview</h1>
  <p>100% original Edexcel-style questions and mark schemes for Class Slides and Revision Notes. All diagrams are rendered live by the website's own <code>diagrams.js</code> generator — zero past-paper material.</p>
</header>

<div class="bar" id="bar">
  <div id="topicBtns" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  <span class="sep"></span>
  <button type="button" id="mNotes" class="on">Revision Notes view</button>
  <button type="button" id="mSlides">Class Slides (16:9) view</button>
  <span class="sep"></span>
  <button type="button" id="tCourse">Course: Double Award</button>
</div>

<main class="wrap">
  <div class="topic-meta" id="meta">Loading pilot bank…</div>
  <div id="out"></div>
</main>

<script src="/interactive/cell-game/cells.js"></script>
<script src="/interactive/lessons/assets/diagrams.js"></script>
<script src="/interactive/lessons/assets/exam-bank.js"></script>
<script>
(async function () {
  const manifest = await CBSExamBank.loadManifest();
  let curTopic = manifest.topics[0].code;
  let mode = 'notes';
  let singleAward = false;

  const btns = document.getElementById('topicBtns');
  manifest.topics.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.code = t.code;
    b.textContent = `${t.code} · ${t.title} (${t.questions}Q / ${t.marks}m)`;
    b.onclick = () => { curTopic = t.code; render(); };
    btns.appendChild(b);
  });

  document.getElementById('mNotes').onclick = () => { mode = 'notes'; render(); };
  document.getElementById('mSlides').onclick = () => { mode = 'slides'; render(); };
  document.getElementById('tCourse').onclick = () => {
    singleAward = !singleAward;
    document.body.classList.toggle('hide-da', singleAward);
    document.getElementById('tCourse').textContent = singleAward ? 'Course: Single Award (DA hidden)' : 'Course: Double Award';
    document.getElementById('tCourse').classList.toggle('on', singleAward);
    render();
  };

  function fitSlides() {
    document.querySelectorAll('.slide-frame').forEach(f => {
      const inner = f.querySelector('.slide-inner');
      if (inner) inner.style.transform = `scale(${f.clientWidth / 1600})`;
    });
  }
  addEventListener('resize', fitSlides);

  async function render() {
    const tMeta = manifest.topics.find(t => t.code === curTopic);
    document.body.className = 'subj-' + tMeta.subject + (singleAward ? ' hide-da' : '');
    btns.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.code === curTopic));
    document.getElementById('mNotes').classList.toggle('on', mode === 'notes');
    document.getElementById('mSlides').classList.toggle('on', mode === 'slides');

    const data = await CBSExamBank.loadTopic(curTopic);
    const qs = singleAward ? data.questions.filter(q => q.sa !== false) : data.questions;
    document.getElementById('meta').innerHTML = `<b>${data.topic} — ${data.title}</b> (${data.spec}) · Showing <b>${qs.length}</b> synthetic questions. Diagram generator: <code>diagrams.js</code>.`;

    const out = document.getElementById('out');
    if (mode === 'notes') {
      out.innerHTML = qs.map(q => {
        const snippet = `<div data-comp="examq" data-id="${q.id}"></div>`;
        return `<div class="eb-wrap">${CBSExamBank.renderNotesQuestion(q, '')}</div>
          <div class="embed-bar"><span>Lesson embed: <code>${snippet.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></span><button type="button" data-copy="${snippet.replace(/"/g, '&quot;')}">Copy tag</button></div>`;
      }).join('');
      CBSExamBank.wireSelfMark(out);
    } else {
      out.innerHTML = qs.map(q => {
        const partBtns = q.parts.map(p => `<button type="button" data-part="${p.label}">Part (${p.label}) [${p.marks}]</button>`).join('');
        return `<div class="slide-shell" data-qid="${q.id}">
          <div class="slide-frame"><div class="slide-inner">${CBSExamBank.renderSlideQuestion(q, '', false)}</div></div>
          <div class="slide-ctrl">
            <span><b>${q.id}</b> · ${q.title}${q.sa === false ? ' · Double Award only' : ''}</span>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button type="button" data-part="" class="on">Full Q</button>${partBtns}
              <button type="button" data-rev>Reveal mark scheme</button>
            </div>
          </div>
        </div>`;
      }).join('');
      out.querySelectorAll('.slide-shell').forEach(shell => {
        const q = qs.find(x => x.id === shell.dataset.qid);
        const inner = shell.querySelector('.slide-inner');
        const revBtn = shell.querySelector('[data-rev]');
        revBtn.onclick = () => {
          const on = inner.classList.toggle('revealed');
          revBtn.classList.toggle('on', on);
          revBtn.textContent = on ? 'Hide mark scheme' : 'Reveal mark scheme';
        };
        shell.querySelectorAll('[data-part]').forEach(pb => pb.onclick = () => {
          shell.querySelectorAll('[data-part]').forEach(x => x.classList.remove('on'));
          pb.classList.add('on');
          const wasRev = inner.classList.contains('revealed');
          inner.innerHTML = CBSExamBank.renderSlideQuestion(q, pb.dataset.part, false);
          inner.classList.toggle('revealed', wasRev);
        });
      });
      fitSlides();
    }

    out.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
      navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy);
      const old = b.textContent; b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = old, 1200);
    });
  }

  render();
})();
</script>
<script src="/js/home-link.js" data-back="/test.html" data-back-label="Testing area"></script>
</body>
</html>
