*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;background:#eeeae0;color:#111}
header{background:#111;color:#eeeae0;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;position:sticky;top:0;z-index:5}

<header><h1>Chemistry 1g · Covalent bonding</h1><span class="sub">Approach A · slide images</span>
<button id="pres">Present ▶</button><a href="../">← compare approaches</a></header>
<main class="wrap">
<figure class="slide" data-n="1"><img src="img/01.webp" alt="Covalent bonding Chemistry 1g" loading="lazy" width="1600" height="900"><figcaption>Slide 1</figcaption></figure>
<figure class="slide" data-n="2"><img src="img/02.webp" alt="1 Principles of chemistry" loading="lazy" width="1600" height="900"><figcaption>Slide 2</figcaption></figure>
<figure class="slide" data-n="3"><img src="img/03.webp" alt="Slide 3" loading="lazy" width="1600" height="900"><figcaption>Slide 3</figcaption></figure>
<figure class="slide" data-n="4"><img src="img/04.webp" alt="Slide 4" loading="lazy" width="1600" height="900"><figcaption>Slide 4</figcaption></figure>
<figure class="slide" data-n="5"><img src="img/05.webp" alt="Slide 5" loading="lazy" width="1600" height="900"><figcaption>Slide 5</figcaption></figure>
<figure class="slide" data-n="6"><img src="img/06.webp" alt="Covalent Bonding Non-metals can share a pair of electrons with another non-metal. Both obtain complete outer shells. Strong electrostatic attractions are formed. The negatively charged electron pair is strongly attracted to the positively charged nuclei of the atoms involved." loading="lazy" width="1600" height="900"><figcaption>Slide 6</figcaption></figure>
<figure class="slide" data-n="7"><img src="img/07.webp" alt="A hydrogen (H2) molecule. Hydrogen only has a single electron in its outer shell. It requires 1 more electron to complete its outer shell." loading="lazy" width="1600" height="900"><figcaption>Slide 7</figcaption></figure>
<figure class="slide" data-n="8"><img src="img/08.webp" alt="A chlorine (Cl2) molecule. Chlorine contains 7 outer shell electrons, so like hydrogen, it needs 1 extra electron to complete its outer shell. It bonds with another chlorine atom to form a chlorine molecule. This is true for all the group 7 halogens. Cl Cl" loading="lazy" width="1600" height="900"><figcaption>Slide 8</figcaption></figure>
<figure class="slide" data-n="9"><img src="img/09.webp" alt="A hydrogen chloride (HCl) molecule. Hydrogen chloride works the same way Both atoms can only fit a single electron in their respective outer shells. A single covalent bond is formed between the 2 atoms. H Cl" loading="lazy" width="1600" height="900"><figcaption>Slide 9</figcaption></figure>
<figure class="slide" data-n="10"><img src="img/10.webp" alt="An ammonia (NH3) molecule. Ammonia contains a nitrogen atom with 5 outer shell electrons. There is space for 3 more electrons, which are provided by 3 hydrogen atoms. N H H H" loading="lazy" width="1600" height="900"><figcaption>Slide 10</figcaption></figure>
<figure class="slide" data-n="11"><img src="img/11.webp" alt="A nitrogen (N2) molecule. Nitrogen has space for 3 more electrons, so it can also fill its outer shell by bonding with a second nitrogen. Nitrogen molecules share 3 electron pairs. This creates a very strong triple covalent bond. N N" loading="lazy" width="1600" height="900"><figcaption>Slide 11</figcaption></figure>
<figure class="slide" data-n="12"><img src="img/12.webp" alt="O O O H H A water (H2O) molecule. In water, the oxygen completes its outer shell by forming covalent bonds with 2 hydrogen atoms. An oxygen (O2) molecule. An oxygen atom forms a double covalent bond with another oxygen atom." loading="lazy" width="1600" height="900"><figcaption>Slide 12</figcaption></figure>
<figure class="slide" data-n="13"><img src="img/13.webp" alt="A molecule of the alkane methane (CH4). A molecule of the alkane ethane (C2H6)." loading="lazy" width="1600" height="900"><figcaption>Slide 13</figcaption></figure>
<figure class="slide" data-n="14"><img src="img/14.webp" alt="A molecule of chloromethane (CH3Cl). Chloromethane is similar to methane - there is room for 4 outer shell electrons. 3 are provided by hydrogen atoms and the fourth by a chlorine atom. This family of molecules are called haloalkanes." loading="lazy" width="1600" height="900"><figcaption>Slide 14</figcaption></figure>
<figure class="slide" data-n="15"><img src="img/15.webp" alt="Ethene contains 4 hydrogen atoms. 2 more electrons are required to complete the outer shell of each carbon atom. This is provided through a double covalent bond. This family of molecules are called alkenes. A molecule of ethene (C2H4)." loading="lazy" width="1600" height="900"><figcaption>Slide 15</figcaption></figure>
<figure class="slide" data-n="16"><img src="img/16.webp" alt="Slide 16" loading="lazy" width="1600" height="900"><figcaption>Slide 16</figcaption></figure>
<figure class="slide" data-n="17"><img src="img/17.webp" alt="Intermolecular attractions are found between many covalent molecules, perhaps most famously in water." loading="lazy" width="1600" height="900"><figcaption>Slide 17</figcaption></figure>
<figure class="slide" data-n="18"><img src="img/18.webp" alt="Simple Molecular Structures Atoms within a molecule are held together by very strong covalent bonds. Some molecules are attracted to each other through comparatively weak intermolecular forces. Weak intermolecular forces mean most covalent molecules are liquids or gases at room temperature. As molecule size increases, intermolecular forces also increase So larger molecules have higher melting and boiling points Intermolecular attractions (represented as a dashed line) are found between many covalent molecules, perhaps most famously in water." loading="lazy" width="1600" height="900"><figcaption>Slide 18</figcaption></figure>
<figure class="slide" data-n="19"><img src="img/19.webp" alt="Slide 19" loading="lazy" width="1600" height="900"><figcaption>Slide 19</figcaption></figure>
<figure class="slide" data-n="20"><img src="img/20.webp" alt="Slide 20" loading="lazy" width="1600" height="900"><figcaption>Slide 20</figcaption></figure>
<figure class="slide" data-n="21"><img src="img/21.webp" alt="Giant Covalent Structures Giant covalent structures are similar to giant ionic lattices without charge ions Many non-metal atoms are strongly bonded to other non-metal atoms. Lots of energy is required to break these bonds. very high melting and boiling points. do not conduct electricity (except graphite) insoluble in water." loading="lazy" width="1600" height="900"><figcaption>Slide 21</figcaption></figure>
<figure class="slide removed" data-n="22"><div class="ph">Slide 22 removed: third-party copyright material</div><figcaption>Slide 22</figcaption></figure>
<figure class="slide" data-n="23"><img src="img/23.webp" alt="Diamond Diamond and graphite are allotropes of carbon. They contain carbon in different structural arrangements. Diamond is a giant network of carbon atoms. Each carbon atom is bonded to 4 other carbon atoms. Very hard due to strong covalent lattice Very high melting point - above 4000°C. no delocalised electrons so does not conduct electricity." loading="lazy" width="1600" height="900"><figcaption>Slide 23</figcaption></figure>
<figure class="slide" data-n="24"><img src="img/24.webp" alt="Graphite Diamond and graphite are allotropes of carbon. They contain carbon in different structural arrangements. Graphite has delocalised electrons so can conduct electricity. Each carbon atom is bonded to 3 other carbon atoms. This creates layers of carbon atoms which can slide over one another, making graphite soft." loading="lazy" width="1600" height="900"><figcaption>Slide 24</figcaption></figure>
<figure class="slide" data-n="25"><img src="img/25.webp" alt="Diamond is made up of a network of carbon atoms, each forming 4 bonds. Graphite is made up of sheets of carbon atoms, each forming 3 bonds." loading="lazy" width="1600" height="900"><figcaption>Slide 25</figcaption></figure>
<figure class="slide" data-n="26"><img src="img/26.webp" alt="Diamonds are often prized in jewellry, but have many applications in industry. Their hardness is particularly useful for cutting and drilling." loading="lazy" width="1600" height="900"><figcaption>Slide 26</figcaption></figure>
<figure class="slide" data-n="27"><img src="img/27.webp" alt="Graphite is one of the only non-metal structures to conduct electricity. This is due to its delocalised electron which can carry charge." loading="lazy" width="1600" height="900"><figcaption>Slide 27</figcaption></figure>
<figure class="slide" data-n="28"><img src="img/28.webp" alt="C60 Fullerene Fullerenes are hollow-shaped simple covalent molecules Many applications as lubricants, catalysts and as drug delivery systems. E.g. C60 fullerene is a hollow ball shape with 60 carbon atoms. Held together by intermolecular forces. They are soft and can slide over each other. do not conduct electricity (no delocalised electrons) huge surface area. A molecule of C60 fullerene, sometimes referred to as a buckyball." loading="lazy" width="1600" height="900"><figcaption>Slide 28</figcaption></figure>
</main>
<script>
const s=[...document.querySelectorAll('.slide')];let c=0;
function show(i){c=Math.max(0,Math.min(s.length-1,i));s.forEach((e,j)=>e.classList.toggle('cur',j==c));}
document.getElementById('pres').onclick=()=>{document.body.classList.toggle('present');show(c);};
addEventListener('keydown',e=>{if(!document.body.classList.contains('present'))return;
 if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(c+1);}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(c-1);}
 if(e.key=='Escape')document.body.classList.remove('present');});
</script></body></html>
