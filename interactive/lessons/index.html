<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lessons · Cakebread Science</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/interactive/lessons/assets/lesson.css">
<style>
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tabs button{font:700 15px 'Barlow',Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;padding:7px 14px;border:2px solid #555;background:transparent;color:#eeeae0;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc)}
.tabs button:disabled{opacity:.45;cursor:default}
.sec{margin-bottom:30px}
.sec h2{font-family:'Barlow Condensed',Arial Narrow,sans-serif;font-weight:900;text-transform:uppercase;font-size:28px;border-bottom:4px solid var(--acc);margin-bottom:10px}
.topic{display:grid;grid-template-columns:52px 1fr auto;gap:4px 14px;align-items:center;background:#fff;border:2px solid #111;padding:10px 12px;margin-bottom:8px}
.topic.none{background:transparent;border-style:dashed;border-color:#aaa;color:#888}
.topic .code{font:900 28px 'Barlow Condensed',Arial Narrow,sans-serif;color:var(--acc)}
.topic.none .code{color:#aaa}
.topic .t{font-weight:700;font-size:18px;line-height:1.2}
.topic .t small{display:block;font-weight:600;font-size:13px;color:#666;margin-top:2px}
.topic .links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.topic .links a{font:700 14px 'Barlow',Arial,sans-serif;text-decoration:none;border:2px solid #111;padding:4px 10px;color:#111;background:#fff;white-space:nowrap}
.topic .links a.main{background:var(--acc);border-color:var(--acc);color:#fff}
.topic .links a.dr{background:#fff3b8}
.topic details{grid-column:2 / -1;font-size:14px}
.topic details a{color:var(--green);margin-right:10px}
@media(max-width:620px){.topic{grid-template-columns:44px 1fr}.topic .links{grid-column:1 / -1;justify-content:flex-start}}
</style>
</head>
<body class="subj-chemistry">
<div class="stripes"><i style="height:4px;background:var(--acc)"></i><i style="height:2px;background:#111"></i><i style="height:16px;background:var(--acc)"></i><i style="height:3px;background:#111"></i><i style="height:2px;background:var(--acc)"></i></div>
<header class="lhead">
  <div class="kick">IGCSE Science (Double Award) · interactive lessons</div>
  <h1>Cakebread <span>Lessons</span></h1>
  <div class="navrow"><a href="/">← Home</a></div>
  <div class="tabs" id="tabs"><button data-s="biology">Biology</button><button data-s="chemistry">Chemistry</button><button data-s="physics">Physics</button></div>
</header>
<div class="stripes"><i style="height:3px;background:var(--acc)"></i><i style="height:8px;background:var(--paper)"></i><i style="height:2px;background:#111"></i></div>

<main class="wrap" style="max-width:900px">
  <div id="list"><p>Loading…</p></div>
</main>

<script>
(async function(){
  const fmt = d => { const [y,m,dd] = d.split('-'); return `${+dd} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${y}`; };
  let data; try { data = await (await fetch('/interactive/lessons/lessons.json', {cache:'no-store'})).json(); }
  catch(e){ document.getElementById('list').innerHTML = '<p>Could not load the lesson list.</p>'; return; }
  const want = (location.hash.slice(1) || localStorage.getItem('cbs.lessons.subj') || 'chemistry');
  const subj = data.subjects.find(x => x.id === want) || data.subjects[0], base = `/interactive/lessons/${subj.id}/`;
  document.body.className = 'subj-' + subj.id;
  document.querySelectorAll('#tabs [data-s]').forEach(b => { b.classList.toggle('on', b.dataset.s === subj.id); b.onclick = () => { try{localStorage.setItem('cbs.lessons.subj', b.dataset.s);}catch(e){} location.hash = b.dataset.s; location.reload(); }; });
  const html = subj.sections.map(sec => `<div class="sec"><h2>${sec.code} · ${sec.name}</h2>` + sec.topics.map(t => {
    const v = (t.versions||[]).slice().sort().reverse(), latest = v[0], url = base + t.code + '/';
    if(!t.status) return `<div class="topic none"><div class="code">${t.code}</div><div class="t">${t.title}<small>Spec ${t.spec} · not started</small></div></div>`;
    const draftNote = t.status === 'draft' ? `<span class="status draft">Under review</span>` : '';
    const links = (latest ? `<a class="main" href="${url}v${latest}/">Open</a><a href="${url}v${latest}/#present">▶ Present</a>` : `<a class="main dr" href="${url}draft/" style="color:#111">Open</a><a href="${url}draft/#present">▶ Present</a>`)
      + (latest && t.status === 'draft' ? `<a class="dr" href="${url}draft/">Under review</a>` : '');
    const older = v.length > 1 ? `<details><summary>Older checked versions</summary>${v.slice(1).map(d=>`<a href="${url}v${d}/">${fmt(d)}</a>`).join('')}</details>` : '';
    return `<div class="topic"><div class="code">${t.code}</div><div class="t">${t.title}<small>Spec ${t.spec} &nbsp;${draftNote}</small></div><div class="links">${links}</div>${older}</div>`;
  }).join('') + '</div>').join('');
  document.getElementById('list').innerHTML = html;
})();
</script>
</body>
</html>
