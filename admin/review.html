<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Review | Cakebread Science</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Review portal (19 Nov 2026). User: "the question bank needs a new page for me to systematically review … a big button on the
     page for me to say it's good. Any time a question is ever changed it's got to be sent back to review." + worksheets: "what's
     been made and what is yet to review". Fingerprints and storage: /admin/review-lib.js. Admins only. -->
<style>
:root{--ink:#111;--cream:#eeeae0;--paper:#fff;--muted:#5a5a5a;--line:#d8d3c4;--soft:#f6f4ee;--green:#00a03a;--dk:#005e22;
  --bio:#2e7d32;--chem:#c8001e;--phys:#d08000;--ok:#16a34a;--todo:#facc15;--chg:#ea580c;--fix:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Barlow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.4;font-size:15px}
a{color:var(--dk)}
h1,h2,h3,.tabs button{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:900;text-transform:uppercase;line-height:1.05}
header{background:#111;color:var(--cream);padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:44px}header h1{font-size:28px}header h1 span{color:var(--green)}
.hhome{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.hsite{color:#bbb;font-size:14px;font-weight:700;text-decoration:none;border:1px solid #444;padding:3px 10px}.hsite:hover{color:#fff;border-color:#888}
header .who{margin-left:auto;font-size:13px;color:#aaa;display:flex;gap:10px;align-items:center}
header .who button{background:none;border:1px solid #555;color:#ddd;padding:3px 10px;cursor:pointer;font:inherit}
.tabs{display:flex;gap:4px;padding:0 20px;background:#111}
.tabs button{background:#222;color:#bbb;border:0;padding:9px 16px 7px;font-size:17px;cursor:pointer;border-top:3px solid transparent}
.tabs button.on{background:var(--cream);color:var(--ink);border-top-color:var(--green)}
main{max-width:1000px;margin:0 auto;padding:18px 18px 60px}
.panel{display:none}.panel.on{display:block}
.gate{max-width:460px;margin:60px auto;background:var(--paper);border:2px solid var(--ink);padding:24px;text-align:center}
.btn{display:inline-block;background:var(--ink);color:var(--cream);border:2px solid var(--ink);padding:7px 14px;font:700 14px 'Barlow',Arial;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink)}
.sum{background:var(--paper);border:2px solid var(--ink);padding:12px 14px;margin-bottom:12px}
.pbar{display:flex;height:16px;border:1.5px solid var(--ink);background:#e7e2d6;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%}.pbar .ok{background:var(--ok)}.pbar .fix{background:var(--fix)}.pbar .changed{background:var(--chg)}
.chips{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}.chips b{font:900 20px 'Barlow Condensed',Arial}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.filters button{font:700 13px Barlow,Arial;background:#fff;border:1.5px solid #999;padding:4px 10px;cursor:pointer;border-radius:99px}
.filters button.on{background:#111;color:#fff;border-color:#111}
.filters select,.filters input{font:600 14px Barlow,Arial;padding:4px 6px;border:1.5px solid #999;background:#fff}
.filters select{max-width:100%}@media(max-width:640px){.filters select,.filters input{flex:1 1 100%}}
.st{display:inline-block;font:700 11.5px Barlow,Arial;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:99px;border:1.5px solid #111;white-space:nowrap}
.st.todo{background:var(--todo)}.st.changed{background:var(--chg);color:#fff;border-color:var(--chg)}.st.fix{background:var(--fix);color:#fff;border-color:var(--fix)}.st.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
/* the question card */
.qcard{background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:16px 18px}
.qtop{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.qid{font:900 24px 'Barlow Condensed',Arial}
.tag{font:700 12px Barlow,Arial;border:1.5px solid #bbb;padding:1px 7px;border-radius:4px;color:#444}
.pos{margin-left:auto;color:var(--muted);font-size:13px}
.spec{font-size:13.5px;color:#444;background:var(--soft);border-left:4px solid #bbb;padding:5px 9px;margin:4px 0 12px}
.spec b{color:#111}
.qtext{font-size:20px;font-weight:600;margin:6px 0 10px;line-height:1.35}
.opts{list-style:none;display:grid;gap:6px;margin-bottom:10px}
.opts li{border:1.5px solid #ccc;padding:7px 11px;font-size:16px;border-radius:6px}
.opts li.right{border-color:var(--ok);background:#dcfce7;font-weight:700}
.opts li.right::before{content:'✓ ';color:var(--ok)}
.tf{font-size:17px;margin-bottom:10px}.tf b{padding:2px 10px;border-radius:5px;background:#dcfce7;border:1.5px solid var(--ok)}
.expl{background:#fffbe6;border:1.5px solid #e9d38b;padding:8px 11px;font-size:15px;margin-bottom:10px}
.expl::before{content:'Explanation: ';font-weight:800}
.sample{border-top:1px dashed #bbb;padding-top:8px;margin-top:8px}
.sample h4{font:700 13px Barlow,Arial;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.reps{background:#fee2e2;border:1.5px solid var(--fix);padding:8px 11px;margin:6px 0 10px;font-size:14px}
.prev{background:#fff1e6;border:1.5px solid var(--chg);padding:7px 11px;margin:0 0 10px;font-size:14px}
.good{display:block;width:100%;margin-top:14px;background:var(--ok);color:#fff;border:3px solid #0f5132;box-shadow:0 5px 0 #0f5132;
  font:900 34px 'Barlow Condensed',Arial;text-transform:uppercase;padding:16px 10px;cursor:pointer;letter-spacing:.5px}
.good:hover{filter:brightness(1.07)}.good:active{transform:translateY(3px);box-shadow:0 2px 0 #0f5132}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.row2 .btn{font-size:15px}.row2 .fixb{background:#fff;color:var(--fix);border-color:var(--fix)}
.keys{margin-left:auto;font-size:12.5px;color:var(--muted)}
.fixbox{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.fixbox textarea{flex:1;min-width:240px;font:15px Barlow,Arial;padding:6px;border:1.5px solid var(--fix);min-height:60px}
.done{background:var(--paper);border:2px solid var(--ink);padding:30px;text-align:center;font-size:18px}
.saved{color:var(--ok);font-weight:700;font-size:14px}
/* worksheets */
.wsub{margin:16px 0 6px;font:900 21px 'Barlow Condensed',Arial;text-transform:uppercase}
.wrow{display:grid;grid-template-columns:150px 1fr auto;gap:6px 12px;align-items:center;background:var(--paper);border:1.5px solid #cfc8b6;padding:8px 10px;margin-bottom:5px}
.wrow .t a{font-weight:700}.wrow .t small{display:block;color:var(--muted)}
.wrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.wrow .acts button{font:800 14px Barlow,Arial;padding:6px 12px;cursor:pointer;border:2px solid #111;background:#fff}
.wrow .acts .wgood{background:var(--ok);color:#fff;border-color:#0f5132}
.wrow .acts .wfix{color:var(--fix);border-color:var(--fix)}
.wrow .note{grid-column:2/-1;font-size:13.5px;color:var(--fix)}
.filters .lcopy{margin-left:auto;background:#111;color:#fff;border-color:#111;border-radius:4px}.filters .lcopy:disabled{opacity:.35;cursor:default}
.wband{margin:10px 0 4px;font:700 12px Barlow,Arial;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}
.lkind{display:inline-block;font:800 11px Barlow,Arial;text-transform:uppercase;letter-spacing:.5px;padding:1px 7px;border-radius:4px;margin-right:6px;vertical-align:1px}
.lkind.deck{background:#111;color:#fff}
.lkind.student{background:#0284c7;color:#fff}
.ltypebar{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.ltypebar button{font:700 12.5px Barlow,Arial;background:var(--soft);border:1.5px solid #bbb;padding:3px 10px;cursor:pointer;border-radius:6px}
.ltypebar button.on{background:#0284c7;color:#fff;border-color:#0284c7}
@media(max-width:640px){.wrow{grid-template-columns:1fr}.wrow .acts{justify-content:flex-start}.qtext{font-size:18px}.good{font-size:28px}}
.kwt{width:100%;border-collapse:collapse;margin:4px 0 6px;font-size:16px}.kwt th{text-align:left;font:700 12px Barlow,Arial;text-transform:uppercase;color:var(--muted);border-bottom:2px solid #111;padding:4px 6px}
.kwt td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}.kwt td:first-child{width:34%}
/* flashcards tab preview */
.fc-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 10px}
@media(max-width:720px){.fc-pair{grid-template-columns:1fr}}
.fc-side{border:2px solid var(--ink);background:#fff;padding:12px 14px;min-height:110px;font-size:17px;line-height:1.4;overflow-wrap:anywhere}
.fc-side.back{background:#fffdf5;border-color:var(--dk)}
.fc-side h4{font:900 12px 'Barlow Condensed',Arial;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fc-side.back h4{color:var(--dk)}
.fc-side img{max-width:100%;max-height:240px;height:auto;display:block;margin:8px auto 2px;border:1px solid #ddd;background:#fff}
.fc-points{list-style:disc;margin:6px 0 4px 20px;font-size:16px}
.fc-points li{margin:4px 0}
.fc-eq{display:inline-flex;align-items:center;gap:6px;margin:8px 0;padding:5px 12px;background:#faf8f2;border:2px solid var(--ink);font-weight:700}
.fc-eq-card{margin:8px auto 4px;padding:10px 14px;border:2px solid var(--ink);background:#faf8f2;text-align:center}
.fc-eq-card.learn{border-color:#15803d;background:#f0fdf4}
.fc-eq-card.given{border-color:#1d4ed8;background:#eff6ff}
.fc-eq-tag{display:inline-block;font:900 11px 'Barlow Condensed',Arial;letter-spacing:1.2px;text-transform:uppercase;padding:1px 6px;margin-bottom:6px;border:1.5px solid currentColor;background:#fff}
.fc-eq-card.learn .fc-eq-tag{color:#15803d}.fc-eq-card.given .fc-eq-tag{color:#1d4ed8}
.fc-eq-words{font-size:15px;font-weight:600}.fc-eq-sym{font-size:20px;font-weight:700;margin-top:4px}
.fc-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.88em;line-height:1.15;margin:0 3px}
.fc-frac>span:first-child{border-bottom:2px solid var(--ink);padding:0 5px 2px}.fc-frac>span:last-child{padding:2px 5px 0}
.fc-punnett{margin:8px auto;border-collapse:collapse;font-size:16px;font-weight:700}
.fc-punnett th,.fc-punnett td{border:2px solid var(--ink);padding:4px 10px;text-align:center;min-width:40px}
.fc-punnett th{background:#f3f1ea}
.fc-ind-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.fc-ind{display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--ink);padding:5px 10px;font-size:14px;font-weight:700}
.fc-ind small{font-size:10px;text-transform:uppercase;opacity:.8}
.muted{color:var(--muted)}.small{font-size:13px}
</style>
</head>
<body>
<header><a class="hhome" href="/" title="The website"><img src="/img/mascot/head-pixel-hd.webp" alt=""><h1>Cakebread <span>Review</span></h1></a><a class="hsite" href="/">← Website</a><div class="who" id="who"></div></header>
<nav id="adminNav" hidden></nav>
<script src="/admin/admin-nav.js"></script>
<nav class="tabs" id="tabs" hidden><button data-tab="q" class="on">Question bank</button><button data-tab="w">Worksheets</button><button data-tab="l">Lessons</button><button data-tab="k">Key words</button><button data-tab="fc">Flashcards</button></nav>
<main>
  <div class="gate" id="gate"><h2>Review</h2><p id="gateMsg" class="muted" style="margin:10px 0 16px">Checking your account…</p><div id="gateBtn"></div></div>
  <section class="panel" id="p-q"></section>
  <section class="panel" id="p-w"></section>
  <section class="panel" id="p-l"></section>
  <section class="panel" id="p-k"></section>
  <section class="panel" id="p-fc"></section>
</main>

<script src="/js/firebase-config.js"></script>
<script src="/js/admin-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="/interactive/spec-quiz/spec.js"></script>
<script src="/interactive/spec-quiz/questions.js"></script>
<script src="/interactive/spec-quiz/gens.js"></script>
<script src="/interactive/cell-game/cells.js"></script>
<script src="/interactive/spec-quiz/diagrams.js"></script>
<script src="/interactive/spec-quiz/diagq.js"></script>
<script src="/js/school.js"></script>
<script src="/js/spec-point.js"></script>
<script src="/js/key-words.js"></script>
<script src="/admin/review-lib.js"></script>
<script>
/* Page state is RV (not T/M/G/R — those are question-bank globals). */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RV = { recs: { q: {}, w: {}, k: {}, l: {}, fc: {} }, lessons: null, lfilter: 'todo', reps: {}, qs: [], filter: 'todo', subj: '', sub: '', list: [], i: 0, cur: null, hist: [], fwd: [], sheets: null, wfilter: 'todo', user: null,
  kf: 'todo', ksubj: '', klist: [], ki: 0, kcur: null, khist: [], kfwd: [],   // k… = key words tab
  fcs: null, fcf: 'todo', fcdeck: '', fcsub: '', fctag: '', fcq: '', fclist: [], fci: 0, fccur: null, fchist: [], fcfwd: [] };   // fc… = flashcards tab
firebase.initializeApp(window.firebaseConfig);
const auth = firebase.auth(), RT = firebase.database();
const SUBJ = { B: 'Biology', C: 'Chemistry', P: 'Physics' };
const POINTS = {}; SPEC.forEach(s => s.topics.forEach(t => t.subs.forEach(sb => sb.points.forEach(p => { POINTS[s.name[0] + p.id] = { p, sub: s.name[0] + t.n + sb.l, subName: sb.name, topic: t.name }; }))));
const SUBS = []; SPEC.forEach(s => s.topics.forEach(t => t.subs.forEach(sb => { if (sb.name !== 'Units') SUBS.push([s.name[0] + t.n + sb.l, `${s.name[0]} ${t.n}${sb.l} ${sb.name}`]); })));
const strip = h => String(h || '').replace(/<[^>]+>/g, '');

auth.onAuthStateChanged(async u => {
  RV.user = u;
  const ok = u && (window.ADMIN_EMAILS || []).includes(u.email);
  $('who').innerHTML = u ? `${esc(u.displayName || u.email || '')} <button id="so">Sign out</button>` : '';
  if ($('so')) $('so').onclick = () => auth.signOut();
  if ($('adminNav')) $('adminNav').hidden = !ok;
  $('tabs').hidden = !ok; $('gate').style.display = ok ? 'none' : '';
  if (!u) { $('gateMsg').textContent = 'Sign in with your admin Google account.'; $('gateBtn').innerHTML = '<button class="btn" id="si">Sign in with Google</button>'; $('si').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); return; }
  if (!ok) { $('gateMsg').textContent = 'This page is for the site admin only.'; $('gateBtn').innerHTML = ''; return; }
  RV.qs = REVIEW.questions().map(q => ({ q, h: REVIEW.qHash(q) }));
  $('p-q').innerHTML = '<p class="muted">Loading your review marks…</p>'; $('p-q').classList.add('on');
  const [recs, reps] = await Promise.all([REVIEW.loadReview(RT), RT.ref('specQuizReports').once('value').then(x => x.val() || {}).catch(() => ({}))]);
  RV.recs = recs; RV.reps = {};
  Object.entries(reps).forEach(([k, r]) => { if (r && !r.resolved && r.qid) (RV.reps[r.qid] = RV.reps[r.qid] || []).push(r); });
  tab(({ '#worksheets': 'w', '#keywords': 'k', '#lessons': 'l', '#flashcards': 'fc' })[location.hash] || 'q');
});
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => tab(b.dataset.tab));
function tab(t) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + t));
  history.replaceState(null, '', ({ w: '#worksheets', k: '#keywords', l: '#lessons', fc: '#flashcards' })[t] || '#questions');
  if (t === 'q') { buildList(); drawQ(); } else if (t === 'k') { buildK(); drawK(); } else if (t === 'l') drawL(); else if (t === 'fc') drawFC(); else drawW();
}

/* ---------- question bank ---------- */
const stOf = x => REVIEW.statusQ(RV.recs.q, x.q.id, x.h);
const qWant = () => ({ todo: s => s === 'todo' || s === 'changed', changed: s => s === 'changed', fix: s => s === 'fix', ok: s => s === 'ok', all: () => true }[RV.filter]);
function buildList(keepId) {
  const want = qWant();
  RV.list = RV.qs.filter(x => (!RV.subj || x.q.s[0] === RV.subj) && (!RV.sub || (POINTS[x.q.s] || {}).sub === RV.sub) && want(stOf(x)));
  RV.i = keepId ? Math.max(0, RV.list.findIndex(x => x.q.id === keepId)) : 0;
  RV.cur = RV.list[RV.i] || null;
  RV.hist = []; RV.fwd = [];
}
function summary(c, noun) {
  const t = c.total || 1;
  return `<div class="sum"><div class="chips"><span><b>${c.ok}</b> of ${c.total} ${noun} checked</span><span><b>${c.todo}</b> never reviewed</span><span><b style="color:var(--chg)">${c.changed}</b> changed since checked</span><span><b style="color:var(--fix)">${c.fix}</b> need a fix</span></div>
    <div class="pbar"><i class="ok" style="width:${c.ok / t * 100}%"></i><i class="fix" style="width:${c.fix / t * 100}%"></i><i class="changed" style="width:${c.changed / t * 100}%"></i></div></div>`;
}
function drawQ(msg) {
  const c = { todo: 0, changed: 0, fix: 0, ok: 0, total: RV.qs.length }; RV.qs.forEach(x => c[stOf(x)]++);
  const F = [['todo', `To review (${c.todo + c.changed})`], ['changed', `Changed (${c.changed})`], ['fix', `Needs a fix (${c.fix})`], ['ok', `Checked (${c.ok})`], ['all', 'All']];
  const x = RV.cur;
  $('p-q').innerHTML = summary(c, 'questions') + `<div class="filters">${F.map(([k, t]) => `<button data-f="${k}" class="${RV.filter === k ? 'on' : ''}">${t}</button>`).join('')}
      <select id="fSubj"><option value="">All subjects</option>${Object.entries(SUBJ).map(([k, v]) => `<option value="${k}" ${RV.subj === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <select id="fSub"><option value="">All sub-topics</option>${SUBS.filter(([k]) => !RV.subj || k[0] === RV.subj).map(([k, v]) => `<option value="${k}" ${RV.sub === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
      <input id="fGo" placeholder="Go to id, e.g. P3.3-07" size="18"></div>
    ${x ? card(x) : `<div class="done">🎉 Nothing ${RV.filter === 'all' ? 'here' : 'left in this list'}.${RV.filter === 'todo' && (RV.subj || RV.sub) ? ' Try another subject or sub-topic.' : ''}${RV.hist.length ? '<div style="margin-top:14px"><button class="btn ghost" id="back">← Back to previous question</button></div>' : ''}</div>`}
    ${msg ? `<p class="saved" style="margin-top:8px">${msg}</p>` : ''}`;
  document.querySelectorAll('#p-q [data-f]').forEach(b => b.onclick = () => { RV.filter = b.dataset.f; buildList(); drawQ(); });
  $('fSubj').onchange = e => { RV.subj = e.target.value; RV.sub = ''; buildList(); drawQ(); };
  $('fSub').onchange = e => { RV.sub = e.target.value; buildList(); drawQ(); };
  $('fGo').onkeydown = e => { if (e.key !== 'Enter') return; e.preventDefault(); e.stopPropagation(); const id = e.target.value.trim(); const j = RV.qs.findIndex(y => y.q.id.toLowerCase() === id.toLowerCase());
    if (j < 0) { e.target.style.borderColor = 'var(--fix)'; return; } RV.filter = 'all'; RV.subj = ''; RV.sub = ''; buildList(RV.qs[j].q.id); drawQ(); };
  if ($('back')) $('back').onclick = () => move(-1);
  if (!x) return;
  $('good').onclick = () => mark('ok');
  $('fixb').onclick = () => { $('fixbox').hidden = false; $('fixNote').focus(); };
  $('fixSave').onclick = () => mark('fix', $('fixNote').value.trim());
  $('skip').onclick = () => move(1);
  if ($('again')) $('again').onclick = () => drawQ();
  if ($('unmark')) $('unmark').onclick = async () => {
    try { await REVIEW.clear(RT, 'q', x.q.id); } catch (e) { alert('Not saved — check your connection.'); return; }
    delete RV.recs.q[REVIEW.key(x.q.id)];
    if (qWant()(stOf(x)) && RV.list.indexOf(x) < 0) RV.list.splice(RV.i, 0, x);
    drawQ('Sent back to review.');
  };
}
function card(x) {
  const q = x.q, P = POINTS[q.s] || {}, st = stOf(x), rec = RV.recs.q[REVIEW.key(q.id)], reps = RV.reps[q.id] || [];
  const inList = RV.list.indexOf(x);
  const posTxt = inList >= 0 ? `${inList + 1} of ${RV.list.length} in this list` : `Previously reviewed · ${RV.list.length} left in list`;

async function drawW() {
  const box = $('p-w');

    box.innerHTML = '<p class="muted" id="wload">Reading the worksheets…</p>';
    try { RV.sheets = await REVIEW.sheets((d, n) => { const e = $('wload'); if (e) e.textContent = `Reading the worksheets… ${d} of ${n}`; }); }
    catch (e) { box.innerHTML = '<p>Couldn\'t load the worksheet list (/admin/worksheets.json).</p>'; return; }
  }
  /* only the sheets students can see: archived ones (user, 22 Nov: "I don't want to see the old archived worksheets") never appear */
  const S = RV.sheets.filter(s => !s.archived);
  const sOf = s => REVIEW.statusW(RV.recs.w, s);
  const c = { todo: 0, changed: 0, fix: 0, ok: 0, total: S.length }; S.forEach(s => c[sOf(s)]++);
  const want = { todo: s => s === 'todo' || s === 'changed', fix: s => s === 'fix', ok: s => s === 'ok', all: () => true }[RV.wfilter] || (() => true);
  const F = [['todo', `To review (${c.todo + c.changed})`], ['fix', `Needs a fix (${c.fix})`], ['ok', `Checked (${c.ok})`], ['all', `All (${S.length})`]];
  /* within a subject: KS4 (Single Award twin straight after its sheet), KS3, then anything else (challenges, maths, older) */
  const band = s => /^[a-z-]+\/ks4\//.test(s.p) ? 0 : /^[a-z-]+\/ks3\//.test(s.p) ? 1 : 2;
  const BAND = ['KS4 · Years 10 and 11', 'KS3 · Years 8 and 9', 'Other sheets'];
  const sortKey = s => s.p.replace(/_sa\.html$/, '.html~');
  const NAMES = { biology: 'Biology', chemistry: 'Chemistry', physics: 'Physics', maths: 'Maths', 'cross-curricular': 'Cross-curricular' };
  const KIND = { sheet: 'Worksheet', practice: 'Practice sheet', challenge: 'Challenge sheet', KS4: 'KS4 worksheet', KS3: 'KS3 worksheet', 'KS4 Single Award': 'KS4 worksheet · Single Award version' };
  const groups = Object.keys(NAMES).map(sub => {
    const rows = S.filter(s => s.subj === sub && want(sOf(s))).sort((a, b) => band(a) - band(b) || sortKey(a).localeCompare(sortKey(b)));
    const all = S.filter(s => s.subj === sub), ok = all.filter(s => sOf(s) === 'ok').length;

    return `<div class="wsub">${NAMES[sub]} <span class="muted small" style="font-family:Barlow;text-transform:none">${ok} of ${all.length} checked</span></div>`
      + (rows.length ? rows.map(s => { const st = sOf(s), rec = RV.recs.w[REVIEW.key(s.p)];
        const head = band(s) !== lastBand ? `<div class="wband">${BAND[lastBand = band(s)]}</div>` : '';
        return head + `<div class="wrow" data-p="${esc(s.p)}"><span><span class="st ${st}">${REVIEW.LABEL[st]}</span></span>
          <span class="t"><a href="/worksheets/${esc(s.p)}" target="_blank">${esc(s.t)}</a><small>${KIND[s.kind]}${s.live ? '' : ' · <b>draft (not on the worksheet pages)</b>'}${s.ms ? ` · <a href="/worksheets/${esc(s.ms)}" target="_blank">mark scheme</a>` : ''}${s.missing ? ' · ⚠️ page not found' : ''}${st === 'changed' ? ` · changed since you checked it on ${new Date(rec.at).toLocaleDateString('en-GB')}` : st === 'ok' && rec && rec.h === s.h ? ` · checked ${new Date(rec.at).toLocaleDateString('en-GB')}` : st === 'ok' && REVIEW.keptW(s.p) ? ` · checked ${esc(REVIEW.keptW(s.p).at || '')}${REVIEW.keptW(s.p).why ? ` (${esc(REVIEW.keptW(s.p).why)})` : ''}` : ''}</small></span>
          <span class="acts">${st !== 'ok' ? '<button class="wgood">✓ Good</button>' : '<button class="wun">Send back</button>'}<button class="wfix">✏️ Needs a fix</button></span>
          ${rec && rec.note && (st === 'fix' || st === 'changed') ? `<span class="note">Your note: “${esc(rec.note)}”</span>` : ''}</div>`; }).join('')
        : '<p class="muted small">Nothing in this list.</p>');
  }).join('');
  box.innerHTML = summary(c, 'worksheets') + `<div class="filters">${F.map(([k, t]) => `<button data-wf="${k}" class="${RV.wfilter === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <p class="small muted" style="margin-bottom:6px">Open a sheet (and its mark scheme), then press ✓ Good. Any change to its wording, answers or pictures sends it back here.</p>${groups}`;
  box.querySelectorAll('[data-wf]').forEach(b => b.onclick = () => { RV.wfilter = b.dataset.wf; drawW(); });
  box.querySelectorAll('.wrow[data-p]').forEach(r => {
    const s = S.find(x => x.p === r.dataset.p);
    const set = async (st, note) => { const rec = { h: s.h, at: Date.now(), st, by: (RV.user && RV.user.email) || '' }; if (note) rec.note = note.slice(0, 500);
      try { await REVIEW.save(RT, 'w', s.p, rec); RV.recs.w[REVIEW.key(s.p)] = rec; drawW(); } catch (e) { alert('Not saved — check your connection.'); } };
    const g = r.querySelector('.wgood'); if (g) g.onclick = () => set('ok');
    const u = r.querySelector('.wun'); if (u) u.onclick = async () => { try { await REVIEW.clear(RT, 'w', s.p); delete RV.recs.w[REVIEW.key(s.p)]; drawW(); } catch (e) { alert('Not saved — check your connection.'); } };
    r.querySelector('.wfix').onclick = () => { const n = prompt('What needs fixing on “' + s.t + '”?', (RV.recs.w[REVIEW.key(s.p)] || {}).note || ''); if (n !== null) set('fix', n); };
  });
}

/* ---------- flashcards (27 Nov): review every card across Biology, Chemistry, Physics, and Physics Equations.
   Fingerprint = deck + spec + daOnly + front + back (school/review/fc/<deck>_<id>). Any card edit sends it back to Changed. ---------- */
const FC_DECKS = [
  ['biology', 'Biology', 'B'],
  ['chemistry', 'Chemistry', 'C'],
  ['physics', 'Physics', 'P'],
  ['physics-eqns', 'Physics Equations', 'P']

const fcFixImgs = html => String(html || '').replace(/(<img\b[^>]*?\bsrc=["'])(?!https?:|data:|\/)([^"']+)(["'])/gi,
  (_, a, src, c) => a + '/Flashcards/media/' + src.replace(/^media\//, '').split('/').map(encodeURIComponent).join('/') + c);
const fcRepsFor = x => {
  const pref = 'fc:' + x.cid;
  const out = [];
  Object.entries(RV.reps).forEach(([qid, arr]) => {
    if (qid === pref || qid.startsWith(pref + ' ')) out.push(...arr);
  });
  return out;
};
async function loadFlashcards() {
  const order = {};
  let ord = 0;
  SPEC.forEach(s => s.topics.forEach(t => t.subs.forEach(sb => sb.points.forEach(p => { order[s.name[0] + p.id] = ord++; }))));
  const decks = await Promise.all(FC_DECKS.map(async ([id, name, subj]) => {
    const arr = await fetch(`/Flashcards/data/${id}.json`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : []);
    return arr.map((c, idx) => {
      const card = { ...c, deck: id, deckName: name, subj };
      const cid = `${id}_${c.id}`;
      return {
        c: card,
        cid,
        h: REVIEW.fcHash(card),
        hasImg: /<img\b/i.test((c.front || '') + (c.back || '')),
        isNew: typeof c.id === 'number' && c.id >= 2026112600000,
        plain: strip((c.front || '') + ' ' + (c.back || '')).toLowerCase(),
        o: order[c.spec] ?? (1e6 + idx)
      };
    });
  }));
  return decks.flat().sort((a, b) => a.o - b.o || String(a.cid).localeCompare(String(b.cid)));
}
const fcSt = x => REVIEW.statusFC(RV.recs.fc, x.cid, x.h);
const fcWant = () => ({ todo: s => s === 'todo' || s === 'changed', changed: s => s === 'changed', fix: s => s === 'fix', ok: s => s === 'ok', all: () => true }[RV.fcf]);
function buildFC(keepCid) {
  if (!RV.fcs) return;
  const want = fcWant();
  const q = (RV.fcq || '').trim().toLowerCase();
  RV.fclist = RV.fcs.filter(x => {
    if (RV.fcdeck && x.c.deck !== RV.fcdeck) return false;
    if (RV.fcsub && (POINTS[x.c.spec] || {}).sub !== RV.fcsub) return false;
    if (RV.fctag === 'img' && !x.hasImg) return false;
    if (RV.fctag === 'new' && !x.isNew) return false;
    if (RV.fctag === 'da' && !x.c.daOnly) return false;
    if (RV.fctag === 'rep' && !fcRepsFor(x).length) return false;
    if (q && !x.cid.toLowerCase().includes(q) && !(x.c.spec || '').toLowerCase().includes(q) && !x.plain.includes(q)) return false;
    return want(fcSt(x));
  });
  RV.fci = keepCid ? Math.max(0, RV.fclist.findIndex(x => x.cid === keepCid)) : 0;
  RV.fccur = RV.fclist[RV.fci] || null;
  RV.fchist = []; RV.fcfwd = [];
}
