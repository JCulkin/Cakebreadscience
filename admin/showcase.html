<!DOCTYPE html>
<html lang="en">

<style>
/* Admin-only showcase of everything in Cakebread Questing (17 Nov 2026). Everything is drawn from the game's own files
   (bland.js, adventurer-shell.js, adventurer-items.js, adventurer-pixel.js, misconceptions.js, questions.js), so it stays
   up to date as the game grows. Nothing here writes anything. */
:root{--ink:#111;--cream:#eeeae0;--paper:#fff;--muted:#5a5a5a;--line:#d8d3c4;--soft:#f6f4ee;--green:#00a03a;--dk:#005e22;--b:#16a34a;--c:#dc2626;--p:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.4;font-size:15px}
a{color:var(--dk)}
h1,h2,h3,.big{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:900;text-transform:uppercase;line-height:1.05}
header{background:#111;color:var(--cream);padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:44px}header h1{font-size:28px}header h1 span{color:var(--green)}
.hhome{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.hsite{color:#bbb;font-size:14px;font-weight:700;text-decoration:none;border:1px solid #444;padding:3px 10px}.hsite:hover{color:#fff;border-color:#888}
.gate{max-width:460px;margin:60px auto;background:var(--paper);border:2px solid var(--ink);padding:24px;text-align:center}.gate p{margin:10px 0 16px;color:var(--muted)}
.btn{display:inline-block;background:var(--ink);color:var(--cream);border:2px solid var(--ink);padding:7px 14px;font:700 14px 'Barlow',Arial;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--paper);color:var(--ink)}.btn.sm{padding:3px 9px;font-size:13px}
.layout{display:grid;grid-template-columns:200px 1fr;gap:22px;max-width:1500px;margin:0 auto;padding:18px 22px 80px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
nav.toc{position:sticky;top:12px;align-self:start;background:var(--paper);border:2px solid var(--ink);padding:10px 12px;max-height:calc(100vh - 24px);overflow:auto}
nav.toc b{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:17px;display:block;margin-bottom:4px}
nav.toc a{display:block;padding:3px 0;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}nav.toc a:hover{color:var(--green)}
nav.toc a small{color:var(--muted);font-weight:400}
@media(max-width:900px){nav.toc{position:static;display:flex;flex-wrap:wrap;gap:4px 12px;max-height:none}nav.toc b{width:100%}}
section.sec{margin-bottom:34px;scroll-margin-top:10px}
section.sec>h2{font-size:34px;border-bottom:4px solid var(--ink);padding-bottom:4px;margin-bottom:6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
section.sec>h2 small{font-family:'Barlow',Arial;font-size:15px;font-weight:600;text-transform:none;color:var(--muted)}
.lede{color:#333;margin-bottom:12px;max-width:900px}
h3{font-size:22px;margin:18px 0 8px}
.card{background:var(--paper);border:2px solid var(--ink);padding:12px 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(var(--w,300px),100%),1fr))}
.storybox .pics{flex-wrap:wrap}.storybox .pics img{max-width:30%;height:auto}
img.px,.px img{image-rendering:pixelated;image-rendering:crisp-edges}
.muted{color:var(--muted)}.small{font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border:1.5px solid currentColor;margin:0 4px 2px 0;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 24px}
.kpi{background:var(--paper);border:2px solid var(--ink);padding:8px 12px;text-decoration:none;color:var(--ink)}.kpi .big{font-size:36px}.kpi small{display:block;color:var(--muted);font-size:13px}
a.kpi:hover{background:#fffbe6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin-top:6px}.kv dt{font-weight:700;color:var(--muted)}
table{border-collapse:collapse;width:100%;background:var(--paper)}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.wrapx{overflow-x:auto;border:2px solid var(--ink)}
q{font-style:italic}q::before,q::after{content:''}
/* maps */
.mapbox{border:3px solid var(--ink);background:#4f9fd1;overflow:auto;position:relative}
.mapbox.dark{background:#2b2733}
.mapbox svg{display:block;width:100%;min-width:900px;height:auto}
.mapbox svg a:hover image{filter:drop-shadow(0 0 3px #fde047) drop-shadow(0 0 2px #fde047)}
.rgn{font:900 12.5px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:2.5px;fill:#fff;stroke:#1f2937;stroke-opacity:.6;stroke-width:2.6px;paint-order:stroke;pointer-events:none;opacity:.85}
.rgn.wtr{fill:#e0f2fe;stroke:#1e5a85;font-style:italic;font-size:11.5px}
.pname{font:700 9.5px Barlow,Arial,sans-serif;fill:#111;stroke:#fff;stroke-width:2.6px;paint-order:stroke;pointer-events:none}
.dark .pname{fill:#fff;stroke:#111}
.lava{animation:lava 2.4s ease-in-out infinite alternate}@keyframes lava{from{opacity:.15}to{opacity:.75}}
.maptools{display:flex;gap:8px;align-items:center;margin:6px 0 8px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:12px;height:12px;border:1px solid #0003;vertical-align:-2px;margin-right:4px}
/* bosses */
.boss{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.frames{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}.frames figure{text-align:center}.frames img{width:112px;height:112px;background:#b9d77f;border:2px solid var(--ink)}
.frames figcaption{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.frames img{width:min(112px,28vw);height:auto}
.story{margin-top:8px;border-left:5px solid #7c3aed;background:#f5f3ff;padding:6px 10px;font-size:14px}.story p{margin:3px 0}
.hp{height:12px;border:2px solid var(--ink);background:#eee;margin:4px 0}.hp i{display:block;height:100%;background:#e11d48}
.mon{display:flex;gap:12px;align-items:flex-start}.mon img{width:80px;height:80px;flex:none;background:var(--soft);border:2px solid var(--ink)}
.mon b{font-family:'Barlow Condensed',sans-serif;font-size:20px;text-transform:uppercase;display:block;line-height:1.05}
/* misconceptions */
.misc{border-left:10px solid var(--sc)}.misc .top{display:flex;gap:10px;align-items:center}.misc .top img{width:64px;height:64px;flex:none}
.misc .top b{font-family:'Barlow Condensed',sans-serif;font-size:20px;text-transform:uppercase;line-height:1.05;display:block}
.misc ul{margin:4px 0 0 18px;font-size:14px}.misc .truth{margin-top:6px;background:#f0fdf4;border-left:4px solid #16a34a;padding:5px 8px;font-size:14px}
.sci-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.sci-tabs button{font:700 15px Barlow,Arial;padding:5px 12px;border:2px solid var(--ink);background:#fff;cursor:pointer;color:var(--sc)}.sci-tabs button.on{background:var(--sc);color:#fff}
/* sprites, items, looks */
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{background:var(--paper);border:2px solid var(--ink);padding:6px;text-align:center;width:var(--tw,120px)}
.tile img{display:block;margin:0 auto;width:var(--iw,88px);height:auto}
.tile span{display:block;font-size:12px;font-weight:700;margin-top:3px;word-break:break-word}.tile small{display:block;font-size:11px;color:var(--muted)}
.item{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start}
.item .ic{width:72px;height:72px;background:var(--soft);border:2px solid var(--ink);padding:4px}
.item .fig{width:66px;height:auto;background:#b9d77f;border:2px solid var(--ink)}
.item b{font-family:'Barlow Condensed',sans-serif;font-size:19px;text-transform:uppercase;line-height:1.05;display:block}
.r-common{color:#475569}.r-uncommon{color:#16a34a}.r-rare{color:#2563eb}.r-lowkey{color:#7c3aed}.r-unhinged{color:#db2777}.r-legend{color:#b45309}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;font-weight:700;margin-top:3px}.stats span{white-space:nowrap}
.cnt{font-family:'Barlow',Arial,sans-serif;font-size:14px;font-weight:600;text-transform:none;color:var(--muted)}
main{min-width:0}
.faces{display:flex;flex-wrap:wrap;gap:12px}.faces figure{text-align:center}.faces img{height:120px;background:#fff;border:2px solid var(--ink)}.faces figcaption{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.storybox{background:#111;color:#e5e5e5;border:3px solid #facc15;padding:16px 18px}.storybox h2{color:#facc15;font-size:26px}.storybox .ch{color:#facc15;font:700 12px Barlow;text-transform:uppercase;letter-spacing:2px}
.storybox .pics{display:flex;gap:12px;align-items:flex-end;margin:8px 0}.storybox .pics img{image-rendering:pixelated}.storybox p{margin:6px 0}
.swatch{display:inline-block;width:46px;height:46px;border:2px solid var(--ink);vertical-align:middle}
</style>

<body>
<header><a class="hhome" href="/" title="The website"><img src="/img/mascot/head-pixel-hd.webp" alt=""><h1>Game <span>showcase</span></h1></a><a class="hsite" href="/">← Website</a><a class="hsite" href="/interactive/spec-quiz/">Questing menu</a></header>
<script src="/admin/admin-nav.js"></script>
<div class="gate" id="gate" style="display:none"></div>
<div class="layout" id="layout" hidden>
  <nav class="toc" id="toc"></nav>
  <main id="main"></main>
</div>
<script>window.QE_PASSIVE = true;</script>
<script src="/js/firebase-config.js"></script>
<script src="/js/admin-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="/interactive/spec-quiz/spec.js"></script>
<script src="/interactive/spec-quiz/questions.js"></script>
<script src="/interactive/spec-quiz/gens.js"></script>
<script src="/interactive/spec-quiz/diagq.js"></script>
<script src="/interactive/spec-quiz/cards.js"></script>
<script src="/interactive/spec-quiz/questing-engine.js"></script>
<script src="/interactive/spec-quiz/adventurer-items.js"></script>
<script src="/interactive/spec-quiz/adventurer-pixel.js"></script>
<script src="/interactive/spec-quiz/bland.js"></script>
<script src="/interactive/spec-quiz/adventurer-shell.js"></script>
<script src="/interactive/spec-quiz/misconceptions.js"></script>
<script>
/* NB: questions.js / gens.js own the globals M, T, MH, TH, G, R, sub, QUESTIONS… — don't declare those here. */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ic = (n, sw) => ADV.icon(n, sw);
const SCOL = { B: '#16a34a', C: '#dc2626', P: '#d97706', b: '#16a34a', c: '#dc2626', p: '#d97706' }, SNAME = { b: 'Biology', c: 'Chemistry', p: 'Physics', B: 'Biology', C: 'Chemistry', P: 'Physics' };
const P_ = BL.PLACES, layerOf = k => BL.unkey(k)[1] >= BL.UNDER0 ? 'Underworld' : 'Surface';
const SUBS = {}; QE.allSubs().forEach(s => SUBS[s.key] = s);
const subName = k => SUBS[k] ? SUBS[k].name : k;
const TOPIC = {}; SPEC.forEach(sc => sc.topics.forEach(t => TOPIC[sc.name[0] + t.n] = t.name));
const ITEM = id => ADV_ITEMS.find(i => i.id === id);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ===================== the world maps (drawn like the real map, without fog) ===================== */
const HX = 30, W3 = Math.sqrt(3) * HX, VBW = Math.ceil(W3 * (BL.COLS + 0.5) + 8);
const ctr = (c, r) => [W3 * (c + 0.5 * (r & 1)) + W3 / 2 + 4, HX * 1.5 * r + HX + 4];
const corner = (x, y, i, rr = HX) => { const a = Math.PI / 180 * (60 * i - 30); return [x + rr * Math.cos(a), y + rr * Math.sin(a)]; };
const hexPts = (x, y, rr = HX) => [0, 1, 2, 3, 4, 5].map(i => corner(x, y, i, rr).map(v => v.toFixed(1)).join(',')).join(' ');
const shade = (hex, amt) => { const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v + amt * 255))); return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join(''); };
const im = (href, x, y, w, extra = '') => `<image href="${href}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${w}" style="image-rendering:pixelated" ${extra}/>`;
function regions(R0, R1) {
  const seen = new Set(), out = [];
  for (let r = R0; r < R1; r++) for (let c = 0; c < BL.COLS; c++) {
    const t = BL.T_AT(c, r), k = BL.key(c, r); if (seen.has(k) || 'BsT~=#'.includes(t)) continue;
    const cells = [], q = [[c, r]]; seen.add(k);
    while (q.length) { const [a, b] = q.pop(); cells.push(BL.key(a, b)); for (const [x, y] of BL.neighbours(a, b)) if (y >= R0 && y < R1 && !seen.has(BL.key(x, y)) && BL.T_AT(x, y) === t) { seen.add(BL.key(x, y)); q.push([x, y]); } }
    if (cells.length >= 4) out.push({ cells, name: BL.WATER.has(t) ? BL.WATER_NAME[t][0] : BL.LAND[t].name, water: BL.WATER.has(t) });
  }
  const done = {}; let h = '';
  out.sort((a, b) => b.cells.length - a.cells.length).forEach(R => {
    if (done[R.name]) return; done[R.name] = 1;
    const pts = R.cells.map(k => ctr(...BL.unkey(k))), cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    let best = null, bd = 1e9;
    R.cells.forEach((k, i) => { if (P_[k]) return; const [c, r] = BL.unkey(k), crowd = [-2, -1, 1, 2].filter(o => P_[BL.key(c + o, r)]).length, d = (pts[i][0] - cx) ** 2 + (pts[i][1] - cy) ** 2 + crowd * 6000; if (d < bd) { bd = d; best = pts[i]; } });
    if (best) h += `<text class="rgn${R.water ? ' wtr' : ''}" x="${best[0].toFixed(1)}" y="${(best[1] + 4).toFixed(1)}" text-anchor="middle">${esc(R.name)}</text>`;
  });
  return h;
}
function worldSVG(under, names) {
  const R0 = under ? BL.UNDER0 : 0, R1 = under ? BL.ROWS : BL.SURF_ROWS, T = (c, r) => (r >= R0 && r < R1 && BL.inMap(c, r)) ? BL.T_AT(c, r) : under ? '#' : '~';
  let water = '', land = '', coast = '', decor = '', things = '', labels = '';
  for (let r = R0 - 1; r <= R1; r++) for (let c = -1; c <= BL.COLS; c++) {
    const t = T(c, r), [x, y] = ctr(c, r), k = BL.key(c, r), P = P_[k], L = BL.LAND[t];
    if (BL.WATER.has(t)) {
      if (under) {
        if (t === 'L') water += `<polygon points="${hexPts(x, y, HX + .6)}" fill="#ea580c"/><polygon class="lava" style="animation-delay:-${(BL.hash(c, r, 5) * 3).toFixed(1)}s" points="${hexPts(x, y, HX - 7)}" fill="#fbbf24"/>`;
        else if (t === 'u') water += `<polygon points="${hexPts(x, y, HX + .6)}" fill="#17384a"/>` + (BL.hash(c, r, 1) < .6 ? im(ic('wave'), x - 12, y - 10, 24, 'opacity=".28"') : '');
        else { water += `<polygon points="${hexPts(x, y, HX + .6)}" fill="${shade('#2b2733', (BL.hash(c, r, 4) - .5) * .06)}"/>`; if (BL.hash(c, r, 1) < .3) water += im(ic('spire'), x - 11 + BL.hash(c, r, 2) * 8, y - 13, 22, 'opacity=".35"'); }
      } else {
        if (t !== '~') water += `<polygon points="${hexPts(x, y, HX + .6)}" fill="#64b3dd"/>`;
        if (BL.hash(c, r, 1) < .45) water += im(ic('wave'), x - 12 + BL.hash(c, r, 2) * 10, y - 14 + BL.hash(c, r, 3) * 10, 24, 'opacity=".55"');
      }
      continue;
    }
    if (L && L.col) {
      land += `<polygon points="${hexPts(x, y, HX + .5)}" fill="${shade(L.col, (BL.hash(c, r, 4) - .5) * .09)}" stroke="${shade(L.col, -.12)}" stroke-width=".8"/>`;
      for (let d = 0; d < 6; d++) {
        const [nc, nr] = BL.nb(c, r, d), nt = T(nc, nr); if (!BL.WATER.has(nt) || nt === 'B') continue;
        const a = corner(x, y, d), b = corner(x, y, (d + 1) % 6);
        if (under) coast += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${nt === 'L' ? '#fdba74' : '#15131a'}" stroke-width="${nt === 'L' ? 3 : 5}" stroke-linecap="round"/>`;
        else coast += `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#f1e2b4" stroke-width="5" stroke-linecap="round"/>`;
      }
      if (!P) { let n = 0; L.decor.forEach(([name, amt], j) => { const cnt = Math.floor(amt + BL.hash(c, r, 10 + j)); for (let q = 0; q < cnt && n < 4; q++, n++) { const ang = BL.hash(c, r, 20 + n) * Math.PI * 2, rad = 6 + BL.hash(c, r, 30 + n) * 11, sz = ['house', 'snowpeak', 'peak'].includes(name) ? 22 : 18; decor += im(ic(name), x + Math.cos(ang) * rad - sz / 2, y + Math.sin(ang) * rad * .8 - sz / 2 - 2, sz); } }); }
    }
    if (t === 'B') things += `<g transform="translate(${x},${y})"><rect x="${-W3 / 2 - 4}" y="-8" width="${W3 + 8}" height="16" fill="#a16207" stroke="#451a03" stroke-width="1.5"/>${[...Array(9)].map((_, i) => `<line x1="${-W3 / 2 - 4 + (i + 1) * (W3 + 8) / 10}" y1="-8" x2="${-W3 / 2 - 4 + (i + 1) * (W3 + 8) / 10}" y2="8" stroke="#451a03"/>`).join('')}</g>`;
    if (P) {
      const big = P.type === 'worldboss' ? 58 : P.type === 'boss' ? 52 : P.type === 'cage' ? 40 : P.type === 'monster' ? 34 : ['gate', 'reactor'].includes(P.icon) ? 40 : 32;
      things += `<a href="#pl-${k.replace(',', '-')}"><title>${esc(P.name)} (${k})</title><ellipse cx="${x}" cy="${y + big / 2 - 6}" rx="${big / 2.6}" ry="4" fill="#0003"/>${im(ic(P.icon, P.type === 'monster' ? P.col : undefined), x - big / 2, y - big / 2 - 4, big)}</a>`;
      if (P.type === 'boss') things += `<rect x="${x - 20}" y="${y + 16}" width="40" height="6" fill="#fff" stroke="#111" stroke-width="1.2"/><rect x="${x - 19.4}" y="${y + 16.6}" width="38.8" height="4.8" fill="#e11d48"/>`;
      if (P.type === 'monster') things += `<rect x="${x - 13}" y="${y + 13}" width="26" height="5" fill="#fff" stroke="#111"/><rect x="${x - 12.5}" y="${y + 13.5}" width="25" height="4" fill="#f59e0b"/>`;
      if (P.type === 'locked') things += im(ic('lock'), x + 7, y - 24, 14);
      if (names) labels += `<text class="pname" x="${x}" y="${y + (P.type === 'boss' ? 33 : 27)}" text-anchor="middle">${esc(P.name)}</text>`;
    }
    if (!under && BL.CRUMBS.includes(k)) things += im(ic('crumbs'), x - 18, y - 14, 36);
  }
  const y0 = HX * 1.5 * R0, h = Math.ceil(HX * 1.5 * (R1 - R0 - 1) + 2 * HX + 8);
  return `<svg viewBox="0 ${y0.toFixed(1)} ${VBW} ${h}" role="img" aria-label="${under ? 'The Underworld' : 'Breadventure Land'}, whole map"><rect y="${y0 - 60}" width="${VBW}" height="${h + 120}" fill="${under ? '#2b2733' : '#4f9fd1'}"/>${water}${land}${coast}${decor}<g>${regions(R0, R1)}</g>${things}${labels}</svg>`;
}

/* ===================== sections ===================== */
const SECS = [];
const sec = (id, title, sub, html) => SECS.push({ id, title, sub, html });

function build() {
  const places = Object.entries(P_), bosses = places.filter(([, P]) => P.type === 'boss'), dens = places.filter(([, P]) => P.type === 'monster'), dungeons = places.filter(([, P]) => P.type === 'dungeon');
  const icons = Object.keys(ADV.ICONS), monsters20 = icons.filter(n => ADV.ICONS[n].length === 20 && !/_/.test(n));
  const qs = QUESTIONS, misc = Object.entries(MISCON);
  const bySci = L => qs.filter(q => q.s && q.s[0] === L).length;

  /* ---------- overview ---------- */
  const kpi = (n, l, href) => `<a class="kpi" href="#${href}"><div class="big">${n}</div><small>${l}</small></a>`;
  sec('top', 'Everything in the game', 'Cakebread Questing + Breadventure Land, drawn live from the game files', `
    <p class="lede">This page reads the same files the game runs on, so anything added to the game appears here automatically. It writes nothing. Click a picture on a map to jump to that place.</p>
    <div class="kpis">${kpi(2, 'maps (surface + Underworld)', 'maps')}${kpi(places.length, 'places on the maps', 'places')}${kpi(bosses.length + 1, 'bosses + the dragon', 'bosses')}${kpi(dens.length, 'small monsters', 'monsters')}
      ${kpi(dungeons.length, 'dungeons', 'dungeons')}${kpi(misc.length, 'misconceptions (one per mission)', 'missions')}${kpi(ADV_ITEMS.length, 'items to wear', 'items')}${kpi(Object.keys(BL.BREWS).length + BL.SPELL_INFO.length, 'brews and spells', 'brews')}
      ${kpi(BL.EVENTS.length, 'weekly events', 'brews')}${kpi(Object.keys(BL.LAND).length - 1, 'kinds of land', 'land')}${kpi(icons.length, 'pixel sprites', 'icons')}${kpi(qs.length.toLocaleString(), 'questions in the bank', 'rules')}${kpi(ADV.UNLOCKS.length, 'level unlocks', 'unlocks')}</div>`);

  /* ---------- story ---------- */
  const grab = f => { const m = f(); const bx = m.querySelector('.bx'); bx.querySelector('.go') && bx.querySelector('.go').remove(); const h = bx.innerHTML; m.remove(); return h; };
  const intro = grab(() => ADV.storyIntro()), rescue = grab(() => ADV.storyRescue());
  sec('story', 'The story', 'what students see', `
    <div class="grid" style="--w:420px"><div class="storybox">${intro}</div><div class="storybox">${rescue}</div></div>
    <h3>Boss lines, chapter by chapter</h3><p class="lede">Every boss has a first-meeting line, taunts, a line when it's under a third of its health and a line when it falls (see <a href="#bosses">Bosses</a>). Each is built on a real misconception from its science.</p>
    <h3>Chapters</h3><table><tr><th>Chapter</th><th>What happens</th></tr>
      <tr><td><b>1 · Free the Professor</b></td><td>Beat the Spore Lord, Granitus the Stone Golem and the Acid Hydra together to win three key pieces. The cage opens for everyone the night the third falls.</td></tr>
      <tr><td><b>2 · The monsters wake</b></td><td>The Superbug, the Rust Wyrm and the Half-Life Horror wake; the Old Reactor dungeon opens.</td></tr>
      <tr><td><b>Any time · The Underworld</b></td><td>Clear the Abandoned Mine's five floors to open the lift down to the Underworld and Magmaw.</td></tr>
      <tr><td class="muted">Later</td><td class="muted">The Ancient Gate, the Broken Bridge and ${ADV.DRAGON} waking are still locked.</td></tr></table>`);

  /* ---------- mascot ---------- */
  const faces = ['happy', 'laugh', 'think', 'surprised', 'worried', 'determined'];
  sec('mascot', 'The Professor and the dragon', '', `
    <div class="faces">
      <figure><img loading="lazy" decoding="async" src="/img/mascot/professor-pixel-hd.webp" alt=""><figcaption>Professor (map, HD)</figcaption></figure>
      <figure><img loading="lazy" decoding="async" class="px" src="/img/mascot/professor-pixel.png" alt=""><figcaption>Professor (pixel)</figcaption></figure>
      <figure><img loading="lazy" decoding="async" src="/img/mascot/professor.webp" alt=""><figcaption>Professor (smooth)</figcaption></figure>
      ${['front', 'three-quarter', 'side', 'back'].map(t => `<figure><img loading="lazy" decoding="async" src="/img/mascot/turn-${t}.webp" alt=""><figcaption>Turnaround: ${t}</figcaption></figure>`).join('')}
    </div>
    <h3>Reaction faces <small class="cnt">(missions and flashcards)</small></h3>
    <div class="faces">${faces.map(f => `<figure><img loading="lazy" decoding="async" src="${ADV.face(f)}" alt=""><figcaption>${f}</figcaption></figure>`).join('')}<figure><img loading="lazy" decoding="async" src="/img/mascot/head-pixel-hd.webp" alt=""><figcaption>pixel head</figcaption></figure></div>
    <h3>${ADV.DRAGON} the dragon</h3>
    <div class="faces"><figure><img loading="lazy" decoding="async" class="px" src="${ic('dragon')}" style="height:192px;background:#b9d77f" alt=""><figcaption>Awake</figcaption></figure><figure><img loading="lazy" decoding="async" class="px" src="${ic('dragonzz')}" style="height:192px;background:#b9d77f" alt=""><figcaption>Asleep on its hoard</figcaption></figure>
      <figure><img loading="lazy" decoding="async" class="px" src="${ic('prof')}" style="height:192px;background:#b9d77f" alt=""><figcaption>In the cage (map)</figcaption></figure></div>
    <p class="small muted" style="margin-top:6px">${esc(P_['7,0'].text)}</p>`);

  /* ---------- maps ---------- */
  sec('maps', 'The maps', 'no fog: what the admin “Whole map” button shows', `
    <div class="maptools"><label><input type="checkbox" id="mapNames"> Show every place name</label><span class="small muted">Hover a picture for its name; click it for the details.</span></div>
    <h3>Breadventure Land <small class="cnt">${BL.COLS} × ${BL.SURF_ROWS} squares</small></h3>
    <div class="mapbox" id="mapSurf"></div>
    <div class="legend">${Object.entries(BL.LAND).filter(([t, L]) => L.col && !'cgxak'.includes(t)).map(([, L]) => `<span><i style="background:${L.col}"></i>${esc(L.name)}</span>`).join('')}<span><i style="background:#4f9fd1"></i>Water</span></div>
    <h3>The Underworld <small class="cnt">rows ${BL.UNDER0}–${BL.ROWS - 1}, under 4 rows of solid rock</small></h3>
    <div class="mapbox dark" id="mapUnder"></div>
    <div class="legend">${Object.entries(BL.LAND).filter(([t]) => 'cgxak'.includes(t)).map(([, L]) => `<span><i style="background:${L.col}"></i>${esc(L.name)}</span>`).join('')}<span><i style="background:#2b2733"></i>Rock</span><span><i style="background:#ea580c"></i>Lava</span><span><i style="background:#17384a"></i>Sunless Lake</span></div>`);

  /* ---------- bosses ---------- */
  const lootOf = P => `${P.item && ITEM(P.item) ? `<span style="display:inline-flex;gap:6px;align-items:center"><img class="px" src="${PIXEL.item(P.item)}" style="width:34px;height:34px;background:var(--soft);border:1.5px solid var(--ink)" alt=""><b>${esc(ITEM(P.item).name)}</b> <span class="tag r-${ITEM(P.item).r}">${ADV_RARITY[ITEM(P.item).r]}</span></span>` : ''}`;
  const storyOf = k => { const s = BL.BOSS_STORY[k]; return s ? `<div class="story"><p><b>Meeting it:</b> ${s.meet}</p><p><b>Taunts:</b> ${s.taunt.map(t => `<q>${t}</q>`).join(' · ')}</p><p><b>Under a third:</b> ${s.low}</p><p><b>Falls:</b> ${s.fall}</p></div>` : ''; };
  sec('bosses', 'Bosses', `${bosses.length} bosses, fought together on the map at night`, `
    <p class="lede">Boss fights happen at midnight. Step onto a boss to make camp; each move spent there is one attack, and everyone camped at the same boss fights it together, round by round. Damage = each player's Strength × 0.6–1.4, +${Math.round(BL.RALLY * 100)}% for each ally on the square at the same move (rally, up to +40%). The boss hits back for about its power × 0.5–1.5. Health is fixed and never goes back up.</p>
    <div class="grid" style="--w:560px">${bosses.map(([k, P]) => `<div class="card boss" id="pl-${k.replace(',', '-')}">
      <div class="frames">${['', '_hurt', '_down'].map((f, i) => `<figure><img class="px" src="${ic(P.icon + f)}" alt=""><figcaption>${['Normal', 'Hurt', 'Defeated'][i]}</figcaption></figure>`).join('')}</div>
      <div><h3 style="margin:0">${esc(P.name)}</h3><span class="tag" style="color:${SCOL[P.science]}">${SNAME[P.science]}</span><span class="tag">${P.deep ? 'Underworld' : P.starter ? 'Near the Cakelab' : 'Chapter ' + (P.ch || 1)}</span>${P.tier ? `<span class="tag" style="color:${{ Starter: '#16a34a', 'Next step': '#0284c7', Tough: '#b45309', 'Very tough': '#dc2626', Hardest: '#7c3aed' }[P.tier]}">${P.tier}</span>` : ''}${P.respawn ? `<span class="tag">back ${P.respawn} days after it falls</span>` : ''}${(BL.CH1 || []).includes(k) ? '<span class="tag" style="color:#b45309">🔑 key piece</span>' : ''}<span class="tag">square ${k}</span>
        <dl class="kv"><dt>Health</dt><dd>${P.max.toLocaleString()}</dd><dt>Power</dt><dd>${P.power} (hits for ${Math.round(P.power * .5)}–${Math.round(P.power * 1.5)})</dd><dt>Loot</dt><dd>${esc(P.loot.join(' · '))}</dd>${P.item ? `<dt>Item</dt><dd>${lootOf(P)}</dd>` : ''}</dl>
        <p class="small" style="margin-top:6px">${esc(P.text)}</p></div>
      <div style="grid-column:1/-1">${storyOf(k)}</div></div>`).join('')}
      <div class="card boss" id="pl-7-0"><div class="frames"><figure><img class="px" src="${ic('dragonzz')}" alt=""><figcaption>Asleep</figcaption></figure><figure><img class="px" src="${ic('dragon')}" alt=""><figcaption>Awake</figcaption></figure></div>
        <div><h3 style="margin:0">${esc(P_['7,0'].name)}</h3><span class="tag">World boss</span><span class="tag">square 7,0</span><span class="tag muted">not fightable yet</span><p class="small" style="margin-top:6px">${esc(P_['7,0'].text)}</p></div></div></div>`);

  /* ---------- small monsters ---------- */
  sec('monsters', 'Small monsters', `${dens.length} on the maps, beaten alone in a night or two`, `
    <p class="lede">Each player has their own copy, fought straight away: each move on it is one question from its science (right = you hit it for Strength × 1.2–1.8, wrong = it hits you). Beaten → +8 coins (16 in Market week) and back two days later. Wild critters can also jump you on open land (30% a step): see <a href="#land">Land</a>.</p>
    <div class="grid" style="--w:330px">${dens.map(([k, P]) => `<div class="card mon" id="pl-${k.replace(',', '-')}"><img class="px" src="${ic(P.icon, P.col)}" alt=""><div><b>${esc(P.name)}</b>
      <span class="tag" style="color:${SCOL[P.science]}">${SNAME[P.science]}</span><span class="tag">${layerOf(k)} · ${k}</span>
      <div class="hp"><i style="width:${P.max / 75 * 100}%;background:#f59e0b"></i></div><div class="small"><b>${P.max}</b> health · hits for about <b>${P.power}</b> · sprite <code>${P.icon}</code></div>
      <p class="small" style="margin-top:4px">${esc(P.text)}</p></div></div>`).join('')}</div>`);

  /* ---------- dungeons ---------- */
  sec('dungeons', 'Dungeons', 'question floors, played awake on the map', `
    <p class="lede">Walk to the door and go in. A floor = up to 4 questions: 3 right clears it, 2 wrong ends the run (a wrong answer costs 2 Health, never below 1). Floor coins: ${BL.FLOOR_COINS.map((c, i) => `floor ${i + 1} ${c}`).join(', ')}. The bottom floor also gives a brew and an unowned Common/Uncommon item. Once a day per dungeon.</p>
    <div class="grid" style="--w:420px">${dungeons.map(([k, P]) => `<div class="card" id="pl-${k.replace(',', '-')}"><div class="mon"><img class="px" src="${ic(P.icon)}" alt="" style="background:${layerOf(k) === 'Underworld' ? '#6b6475' : '#b9d77f'}"><div><b>${esc(P.name)}</b>
      ${P.science ? `<span class="tag" style="color:${SCOL[P.science]}">${SNAME[P.science]}</span>` : '<span class="tag">Mixed</span>'}<span class="tag">${layerOf(k)} · ${k}</span>${P.ch > 1 ? `<span class="tag">Chapter ${P.ch}</span>` : ''}${P.keep ? '<span class="tag" style="color:#b45309">keeps your depth</span>' : ''}<span class="tag" style="color:#7c3aed">🔓 level ${ADV.unlockLv(k === BL.MINE ? 'mine' : 'dungeons')}</span>
      <p class="small" style="margin-top:4px">${esc(P.text)}</p></div></div>
      <dl class="kv"><dt>Floors</dt><dd>${P.rooms.map((r, i) => `${i + 1}. ${esc(r)}`).join('<br>')}</dd><dt>Questions on</dt><dd>${P.subs.map(s => `<span class="tag" style="color:${SCOL[s[0]]}">${s.slice(1)}</span>${esc(subName(s))}`).join('<br>')}</dd>
        <dt>Pool</dt><dd>${(() => { const keys = new Set(); P.subs.forEach(s => SUBS[s] && SUBS[s].keys.forEach(x => keys.add(x))); const n = qs.filter(q => keys.has(q.s)); return `${n.length} questions (levels 1/2/3: ${[1, 2, 3].map(l => n.filter(q => q.lv === l).length).join(' / ')})`; })()}</dd>
        ${k === BL.MINE ? `<dt>Bottom floor</dt><dd>The first clear opens the lift to the Underworld.</dd>` : ''}</dl></div>`).join('')}</div>`);

  /* ---------- every other place ---------- */
  const others = places.filter(([, P]) => !['boss', 'monster', 'dungeon', 'worldboss'].includes(P.type));
  sec('places', 'Every other place', 'safe places, shops, mysteries and locked doors', `
    <div class="grid" style="--w:330px">${others.map(([k, P]) => `<div class="card mon" id="pl-${k.replace(',', '-')}"><img class="px" src="${ic(P.icon)}" alt="" style="background:${layerOf(k) === 'Underworld' ? '#6b6475' : '#b9d77f'}"><div><b>${esc(P.name)}</b>
      ${P.stock ? `<span class="tag" style="color:#7c3aed">🔓 level ${ADV.unlockLv('shop')}</span>` : ''}<span class="tag">${esc({ home: 'Safe place', shop: 'Shop', event: 'Mystery', cage: 'Rescue', locked: 'Locked', lift: 'Lift' }[P.type] || P.type)}</span><span class="tag">${layerOf(k)} · ${k}</span>
      <p class="small" style="margin-top:4px">${esc(P.text)}</p></div></div>`).join('')}
      <div class="card mon"><img class="px" src="${ic('crumbs')}" alt="" style="background:#b9d77f"><div><b>The crumb trail</b><span class="tag">Clue</span><span class="tag">${BL.CRUMBS.join(' → ')}</span><p class="small" style="margin-top:4px">Shows through the fog in chapter 1, leading from the Cakelab towards the dragon's lair.</p></div></div></div>`);

  /* ---------- land ---------- */
  sec('land', 'Land, water and wild critters', '', `
    <div class="wrapx"><table><thead><tr><th></th><th>Land</th><th>Map</th><th>Scenery</th><th>Wild critter (30% a step)</th><th class="n">Squares</th></tr></thead><tbody>
      ${Object.entries(BL.LAND).filter(([, L]) => L.col).map(([t, L]) => { let n = 0; for (let r = 0; r < BL.ROWS; r++) for (let c = 0; c < BL.COLS; c++) if (BL.T_AT(c, r) === t) n++;
        return `<tr><td><span class="swatch" style="background:${L.col}"></span></td><td><b>${esc(L.name)}</b></td><td>${'cgxak'.includes(t) ? 'Underworld' : 'Surface'}</td><td>${L.decor.map(([d, a]) => `<img class="px" src="${ic(d)}" width="36" title="${d} ×${a}" alt="${d}">`).join(' ')}</td><td>${esc(BL.WILD[t] || '–')}</td><td class="n">${n}</td></tr>`; }).join('')}
      <tr><td></td><td><b>${esc(BL.LAND.B.name)}</b></td><td>Surface</td><td colspan="3" class="small">The only ways across the River Tangent.</td></tr>
      ${Object.entries(BL.WATER_NAME).map(([t, [n, d]]) => `<tr><td><span class="swatch" style="background:${{ '~': '#4f9fd1', o: '#64b3dd', '=': '#64b3dd', '#': '#2b2733', L: '#ea580c', u: '#17384a' }[t] || '#999'}"></span></td><td><b>${esc(n)}</b></td><td>${'#Lu'.includes(t) ? 'Underworld' : 'Surface'}</td><td colspan="3" class="small">Can't be crossed. ${esc(d)}</td></tr>`).join('')}</tbody></table></div>`);

  /* ---------- mission misconceptions ---------- */
  sec('missions', 'Missions: the misconceptions', `${misc.length}, one per sub-topic`, `
    <p class="lede">Each mission is 10 questions against one misconception. 7 hits defeat it (a ★ question hits 1.5×); a second wind gives half-hits for corrected answers. The results card shows “What's actually true”.</p>
    <div class="sci-tabs" id="mTabs">${['B', 'C', 'P'].map((L, i) => `<button style="--sc:${SCOL[L]}" data-l="${L}" class="${i ? '' : 'on'}">${SNAME[L]} · ${misc.filter(([k]) => k[0] === L).length}</button>`).join('')}<button style="--sc:#111" data-l="*">All</button></div>
    <div id="mList"></div>`);

  /* ---------- monster sprites ---------- */
  const used = n => [...misc.filter(([, m]) => m.s === n).map(([, m]) => m.n), ...dens.filter(([, P]) => P.icon === n).map(([, P]) => P.name)];
  sec('sprites', 'Monster sprites', `${monsters20.length} monsters (20 × 20), recoloured for each science and place`, `
    <div class="grid" style="--w:300px">${monsters20.map(n => `<div class="card"><div style="display:flex;gap:4px">${[SCOL.B, SCOL.C, SCOL.P, '#7c3aed'].map(col => `<img class="px" src="${ic(n, col)}" style="width:25%;background:var(--soft);border:1.5px solid var(--line)" alt="">`).join('')}</div>
      <b style="font-family:'Barlow Condensed',sans-serif;font-size:19px;text-transform:uppercase"><code>${n}</code></b><div class="small muted">${used(n).length ? 'Used by: ' + used(n).map(esc).join(' · ') : 'Not used yet'}</div></div>`).join('')}</div>`);

  /* ---------- items ---------- */
  /* 22 Nov: one tag = rarity + level; stats and what it does on their own lines */
  const one = it => { const fig = PIXEL.figure(ADV_PUT({}, it), PIXEL.DEFAULT), fx = ADV_FX_TXT(it.fx);
    return `<div class="card item"><img loading="lazy" decoding="async" class="px ic" src="${PIXEL.item(it.id)}" alt=""><img loading="lazy" decoding="async" class="px fig" src="${fig}" alt="">
      <div><b>${esc(it.name)}</b> <span class="tag r-${it.r}">${ADV_TAG(it)}</span>
      <p class="small" style="margin-top:2px">${ADV_WHERE(it)}${it.s ? ` · <span style="font-weight:700;color:${SCOL[it.s]}">${SNAME[it.s]}</span>` : ''}${ADV_STATS_TXT(it) ? ' · <span style="font-weight:700">' + ADV_STATS_TXT(it) + '</span>' : ''}</p>
      ${fx.map(f => `<p class="small" style="color:#7c2d12;font-weight:700">★ ${esc(f)}</p>`).join('')}
      <p class="small" style="margin-top:3px"><i>${esc(it.d)}</i></p><p class="small muted">From: ${esc(it.from)}${it.dark ? ' (☠ also cursed chests)' : ''}</p></div></div>`; };
  const starter = ADV_ITEMS.filter(i => i.from === 'Starter outfit').reduce((e, i) => ADV_PUT(e, i), {});
  const legend = ADV_ITEMS.filter(i => (i.r === 'legend' || i.r === 'unhinged') && !i.two).reduce((e, i) => ADV_PUT(e, i, i.slot === 'hand' ? (e.rhand ? 'lhand' : 'rhand') : null), {});
  const SETFIG = { b: ['leafhat', 'puffer', 'genes', 'wellies', 'net'], c: ['goggles', 'labcoat', 'distill', 'galvboots', 'burette'], p: ['beanie', 'sequin', 'kilt', 'springs', 'glove', 'mirror'] };
  const setEq = k => SETFIG[k].reduce((e, id) => ADV_PUT(e, ADV_BY[id], ADV_BY[id].slot === 'hand' && !ADV_BY[id].two ? (e.rhand ? 'lhand' : 'rhand') : null), {});
  /* ---------- treasure chests (17 Nov) ---------- */
  const chestPool = C => { const no = new Set([...Object.values(BL.PLACES).map(P => P.item).filter(Boolean), 'calc67']);
    return ADV_ITEMS.filter(i => i.r !== 'legend' && i.from !== 'Starter outfit' && !no.has(i.id) && (C.dark ? i.dark : C.rar.includes(i.r))); };
  sec('chests', 'Treasure chests', 'appear on the map every night; everyone can see them through the fog', `
    <p class="lede">Each night tops the surface up to ${BL.CHEST_TARGET} chests (at most 2 new a night) and, half the time, the Underworld up to ${BL.CHEST_UNDER}. A chest lasts ${BL.CHEST_DAYS} days. Every player sees every chest, even through the fog, with a glowing outline in the chest's colour, and can head straight for it. <b>The first player to step on it opens it</b> (no extra move); the next morning's report tells everyone who found what. Loot is one item you don't own yet (coins instead if you own them all), coins, and sometimes a brew. About 1 in ${Math.round(1 / BL.MIMIC)} wooden chests is a mimic: it bites for 3 and coughs up 5 coins. Admins can drop a chest from the admin Breadventure Land tab.</p>
    <div class="grid" style="--w:300px">${Object.entries(BL.CHESTS).map(([id, C]) => `<div class="card" style="text-align:center"><div style="display:flex;justify-content:center;gap:10px;background:${id === 'cursed' ? '#2b2733' : '#b9d77f'};padding:8px;border:2px solid ${C.glow}"><img class="px" src="${ADV.icon('chest', C.col)}" style="width:64px" alt=""><img class="px" src="${ADV.icon('chest_open', C.col)}" style="width:64px" alt="">${id === 'wood' ? `<img class="px" src="${ADV.icon('mimic', C.col)}" style="width:64px" alt="">` : ''}</div>
      <h3>${esc(C.name)}</h3><p class="small">${id === 'cursed' ? 'Underworld only (60%), ' : id === 'wood' ? '60% of surface chests, ' : id === 'silver' ? '30% on top, 25% below, ' : '10% on top, 15% below, '}🪙 ${C.coins[0]}–${C.coins[1]} · ${esc(C.odds)}${C.brew ? ` · brew ${Math.round(C.brew * 100)}%` : ''}</p>
      <p class="small muted">${chestPool(C).length} items can come out of it</p></div>`).join('')}</div>`);

  sec('items', 'Items', `${ADV_ITEMS.length} things to wear`, `
    <p class="lede">Every item has a level (hats ${ADV.unlockLv('hats')}+, things to hold ${ADV.unlockLv('hands')}+; Main Character items have no level limit) and adds Strength, Health or Magic (budget: common 1, uncommon 2, rare 3, lowkey iconic 4, mythic 5, Main Character 6 points; two-handed items double; a special ability costs about 1). Some also do something (★). Things to hold go in either hand; some need both. <b>Science sets:</b> 4 or more slots filled, every item from one science → +${Math.round(ADV.SET_PCT * 100)}% of that science's stat (at least 3), a small extra and a glow: ${Object.values(ADV_SETS).map(S => `<b style="color:${S.col}">${S.name}</b> ${ADV_STAT[S.stat][1]}, ${ADV_FX_TXT(S.fx)[0].toLowerCase()}`).join(' · ')}. Rarity: ${Object.entries(ADV_RARITY).map(([r, n]) => `<span class="tag r-${r}">${n} · ${ADV_ITEMS.filter(i => i.r === r).length}</span>`).join('')}</p>
    <div class="faces" style="margin-bottom:10px"><figure><img class="px" src="${PIXEL.figure(starter, PIXEL.DEFAULT)}" style="height:160px;background:#b9d77f" alt=""><figcaption>Starter outfit</figcaption></figure>
      <figure><img class="px" src="${PIXEL.figure(legend, PIXEL.DEFAULT)}" style="height:160px;background:#b9d77f" alt=""><figcaption>Rarest of each slot</figcaption></figure>${Object.keys(ADV_SETS).map(k => `<figure><img class="px" src="${PIXEL.figure(setEq(k), PIXEL.DEFAULT)}" style="height:160px;background:#b9d77f" alt=""><figcaption>${ADV_SETS[k].name} set</figcaption></figure>`).join('')}</div>
    ${ADV_GROUPS.map(sl => { const a = ADV_ITEMS.filter(i => i.slot === sl.k).sort((x, y) => (x.lv || 1) - (y.lv || 1)); return `<h3>${sl.name} <small class="cnt">${a.length}</small></h3><div class="grid" style="--w:360px">${a.map(one).join('')}</div>`; }).join('')}`);

  /* ---------- character creator ---------- */
  const O = PIXEL.OPTIONS, D0 = PIXEL.DEFAULT, look = o => PIXEL.portrait(Object.assign({}, D0, o));
  const row = (title, list, mk, lab = o => o.name) => `<h3>${title} <small class="cnt">${list.length}</small></h3><div class="tiles" style="--tw:96px;--iw:78px">${list.map(o => `<div class="tile"><img loading="lazy" decoding="async" class="px" src="${look(mk(o))}" alt=""><span>${esc(lab(o))}</span></div>`).join('')}</div>`;
  sec('looks', 'Character creator', 'every option on the My look page', `
    <p class="lede">One body for everyone, no gender field, no pronouns. Hijab and turban/patka use the cloth colours.</p>
    ${row('Skin tones', O.skin, o => ({ skin: o.id }))}${row('Hair', O.hair, o => ({ hair: o.id }))}${row('Hair colours', O.hc, o => ({ hair: 'long', hc: o.id }))}
    ${row('Cloth colours (hijab)', O.cloth, o => ({ hair: 'hijab', hc: o.id }))}${row('Eyes', O.eyes, o => ({ eyes: o.id }))}${row('Mouths', O.mouth, o => ({ mouth: o.id }))}${row('Extras', O.extras, o => ({ extras: [o.id], hair: o.id === 'kippah' ? 'crop' : D0.hair }))}`);

  /* ---------- brews, spells, events ---------- */
  sec('brews', 'Brews, spells and weekly events', '', `
    <div class="grid" style="--w:420px">
      <div class="card"><h3 style="margin-top:0">Brews <small class="cnt">Tuck Shop, real coins</small></h3><table>${Object.values(BL.BREWS).map(b => `<tr><td style="font-size:26px">${b.ic}</td><td><b>${esc(b.name)}</b><div class="small">${esc(b.what)}</div></td><td class="n">🪙 ${b.cost}</td><td class="small muted">${b.when === 'now' ? 'straight away' : 'tonight'}</td></tr>`).join('')}</table></div>
      <div class="card"><h3 style="margin-top:0">Spells <small class="cnt">mana: +1 per flashcard, +1 per 3 right answers</small></h3><table>${BL.SPELL_INFO.map(s => `<tr><td style="font-size:26px">${s.ic}</td><td><b>${esc(s.name)}</b><div class="small">${esc(s.what)}</div></td><td class="n">🔮 ${s.cost}</td></tr>`).join('')}</table>
        <p class="small" style="margin-top:8px"><b>Helping:</b> on the same square as another player you can patch them up (3 mana, +5 Health) or give them a brew.</p></div>
      <div class="card"><h3 style="margin-top:0">Weekly events <small class="cnt">one a week, Monday to Sunday</small></h3><table>${BL.EVENTS.map(e => `<tr><td style="font-size:26px">${e.ic}</td><td><b>${esc(e.name)}</b>${BL.eventOf(BL.TODAY).id === e.id ? ' <span class="tag" style="color:#16a34a">this week</span>' : ''}<div class="small">${esc(e.text)}</div></td></tr>`).join('')}</table></div></div>`);

  /* ---------- rules & numbers ---------- */
  const lv = [...Array(16)].map((_, i) => i + 1);
  sec('rules', 'Rules and numbers', 'everything a student can earn, and how', `
    <div class="grid" style="--w:420px">
      <div class="card"><h3 style="margin-top:0">Stats</h3><dl class="kv"><dt>Strength</dt><dd>${ADV.BASE.str} + Physics spec points secured + ${ADV.LV.str} per level + gear</dd><dt>Health</dt><dd>${ADV.BASE.hp} + Biology spec points secured + ${ADV.LV.hp} per level + gear</dd>
        <dt>Magic</dt><dd>Chemistry spec points secured + ${ADV.LV.mag} per level + gear</dd><dt>Mana</dt><dd>up to 10 + Magic</dd><dt>Level cap</dt><dd>2 + 1 per 8 spec points secured</dd><dt>Spec points</dt><dd>Biology ${ADV.TOTAL.b} · Chemistry ${ADV.TOTAL.c} · Physics ${ADV.TOTAL.p}</dd></dl>
        <div class="wrapx" style="margin-top:8px;border-width:1px"><table><tr><th>Level</th>${lv.map(l => `<td class="n">${l}</td>`).join('')}</tr><tr><th>XP</th>${lv.map(l => `<td class="n small">${ADV.xpFor(l)}</td>`).join('')}</tr></table></div></div>
      <div class="card"><h3 style="margin-top:0">Securing and XP</h3><dl class="kv"><dt>Question</dt><dd>right first time on two different days (true/false counts half)</dd><dt>Spec point</dt><dd>secured questions + cards ≥ its value (max 4)</dd><dt>Rusty</dt><dd>${QE.RUST_DAYS} days without a correct answer</dd>
        <dt>XP</dt><dd>5 per right answer (10 for ★), +20 per secured question, +100 per new spec point</dd><dt>Flashcards</dt><dd>+${QE.CARD.xp} XP (max ${QE.CARD.xpCap} a day), +${QE.CARD.hp} Health, +${QE.CARD.mana} mana per due card; 1 coin per ${QE.CARD.coinEvery}; ${QE.CARD.doneAt} cards = today's revision</dd></dl></div>
      <div class="card"><h3 style="margin-top:0">Missions</h3><dl class="kv"><dt>Length</dt><dd>${QE.MISSION_LEN} questions</dd><dt>Defeat</dt><dd>7 hits (★ = 1.5 hits); second wind: half a hit per corrected answer, a quarter for true/false</dd><dt>Coins</dt><dd>10, +10 if defeated, +10 if flawless</dd><dt>Loot</dt><dd>one Common/Uncommon item every mission</dd><dt>Health</dt><dd>+${QE.HEAL_MISSION} per right answer</dd></dl></div>
      <div class="card"><h3 style="margin-top:0">Moves and the night</h3><dl class="kv"><dt>First day</dt><dd>${BL.FIRST_MOVES} moves</dd><dt>When</dt><dd>moves happen as you make them; only boss fights wait for midnight (camp on the boss: one attack per move spent there; walking away gives them back)</dd><dt>Every night</dt><dd>+${BL.DAILY_MOVES}, banked up to ${BL.MOVE_BANK}</dd><dt>Revision</dt><dd>+1 for the day's first mission, practice set or flashcards (cap ${ADV.MOVE_CAP})</dd><dt>Extra</dt><dd>moves you give from the admin console: no cap, kept until used</dd>
        <dt>Sight</dt><dd>${BL.SIGHT} squares round anywhere visited (Lift the Fog: 4)</dd><dt>Healing</dt><dd>+${BL.HEAL.rest} once a day for resting in the Cakelab (double in Cosy week)</dd><dt>Knocked out</dt><dd>back to the Cakelab on a quarter of Health; nothing lost</dd><dt>Puddle</dt><dd>once a day, 40%: 5 coins</dd></dl></div>
      <div class="card"><h3 style="margin-top:0">The question bank</h3><dl class="kv"><dt>Questions</dt><dd>${qs.length.toLocaleString()}</dd><dt>Biology</dt><dd>${bySci('B')}</dd><dt>Chemistry</dt><dd>${bySci('C')}</dd><dt>Physics</dt><dd>${bySci('P')}</dd><dt>Levels 1 / 2 / 3 ★</dt><dd>${[1, 2, 3].map(l => qs.filter(q => q.lv === l).length).join(' / ')}</dd>
        <dt>True/false</dt><dd>${qs.filter(q => q.tf !== undefined).length}</dd><dt>Generated</dt><dd>${qs.filter(q => q.gen || /-g\d/.test(q.id)).length} (new numbers every time)</dd><dt>Spec points</dt><dd>${Object.keys(QE.POINT_QS).length} with questions</dd></dl></div></div>`);

  /* ---------- level unlocks ---------- */
  sec('unlocks', 'Level unlocks', 'the game starts simple; these open as students level up', `
    <p class="lede">Level comes from XP but is capped at 2 + 1 per 8 spec points secured, so every unlock is earned by revision. Nothing a student already owns is taken away: worn items stay on and brews stay in the bag; they just can't be changed or used until the level. A pop-up shows what's new at each level.</p>
    <div class="wrapx"><table><thead><tr><th class="n">Level</th><th class="n">XP</th><th class="n">Spec points</th><th>Unlocks</th></tr></thead><tbody>
      ${[...new Set(ADV.UNLOCKS.map(u => u.lv))].map(lv => `<tr><td class="n"><b>${lv}</b></td><td class="n">${ADV.xpFor(lv)}</td><td class="n">${Math.max(0, (lv - 2) * 8)}</td><td>${ADV.UNLOCKS.filter(u => u.lv === lv).map(u => `${u.ic} <b>${esc(u.name)}</b> <span class="small muted">${esc(u.what)}</span>`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`);

  /* ---------- every sprite ---------- */
  const bySize = {}; icons.forEach(n => { const g = ADV.ICONS[n], s = Math.max(g.length, ...g.map(r => r.length)); (bySize[s] = bySize[s] || []).push(n); });
  sec('icons', 'Every pixel sprite', `${icons.length} drawn in code, plus the Professor`, Object.keys(bySize).sort((a, b) => b - a).map(s => `<h3>${s} × ${s} <small class="cnt">${bySize[s].length}</small></h3>
    <div class="tiles" style="--tw:${s >= 28 ? 132 : s >= 20 ? 110 : 92}px;--iw:${s >= 28 ? 112 : s >= 20 ? 90 : 60}px">${bySize[s].map(n => `<div class="tile"><img loading="lazy" decoding="async" class="px" src="${ic(n)}" alt="" style="background:var(--soft)"><span>${n}</span></div>`).join('')}</div>`).join(''));
}

/* ===================== render ===================== */
function render() {
  build();
  $('toc').innerHTML = '<b>On this page</b>' + SECS.map(s => `<a href="#${s.id}">${esc(s.title)}</a>`).join('');
  $('main').innerHTML = SECS.map(s => `<section class="sec" id="${s.id}"><h2>${esc(s.title)}${s.sub ? ` <small>${esc(s.sub)}</small>` : ''}</h2>${s.html}</section>`).join('');
  const maps = () => { const n = $('mapNames').checked; $('mapSurf').innerHTML = worldSVG(false, n); $('mapUnder').innerHTML = worldSVG(true, n); };
  maps(); $('mapNames').onchange = maps;
  /* misconceptions, by science and topic */
  const drawM = L => {
    const list = Object.entries(MISCON).filter(([k]) => L === '*' || k[0] === L), tops = [...new Set(list.map(([k]) => k.slice(0, 2)))];
    $('mList').innerHTML = tops.map(t => `<h3>${SNAME[t[0]]} ${t.slice(1)} · ${esc(TOPIC[t] || '')}</h3><div class="grid" style="--w:380px">${list.filter(([k]) => k.slice(0, 2) === t).map(([k, m]) => `<div class="card misc" style="--sc:${SCOL[k[0]]}">
      <div class="top"><img class="px" src="${ic(ADV.ICONS[m.s] ? m.s : 'boss', SCOL[k[0]])}" alt=""><div><b>${esc(m.n)}</b><span class="small muted">${k.slice(1)} · ${esc(subName(k))}${SUBS[k] ? ` · ${SUBS[k].nq} questions` : ''}</span></div></div>
      <p class="small" style="margin-top:6px"><b>Opens:</b> <q>${esc(m.o)}</q></p>
      <ul><li><b>When you're wrong:</b> ${m.w.map(x => `<q>${esc(x)}</q>`).join(' · ')}</li><li><b>When hit:</b> ${m.h.map(x => `<q>${esc(x)}</q>`).join(' · ')}</li><li><b>Last words:</b> <q>${esc(m.d)}</q></li></ul>
      <div class="truth"><b>What's actually true:</b> ${esc(m.t)}</div></div>`).join('')}</div>`).join('');
  };
  drawM('B');
  $('mTabs').onclick = e => { const b = e.target.closest('[data-l]'); if (!b) return; $('mTabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); drawM(b.dataset.l); };
  if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
}

/* open to anyone with the link (user, 17 Nov: "let me access it without admin login"). It only shows game content
   that is already public in the game's files; it reads and writes no student data. Still noindex and unlinked for students. */
$('gate').style.display = 'none'; $('layout').hidden = false; render();
</script>
</body>
</html>
