<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Cakebread Science</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--cream:#eeeae0;--paper:#fff;--muted:#5a5a5a;--line:#d8d3c4;--soft:#f6f4ee;--green:#00a03a;--dk:#005e22;
  --bio:#2e7d32;--chem:#c8001e;--phys:#d08000;--s:#16a34a;--r:#ea580c;--l:#facc15;--n:#e7e2d6;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.4;font-size:15px}
a{color:var(--dk)}
h1,h2,h3,.tabs button,.big{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:900;text-transform:uppercase;line-height:1.05}
header{background:#111;color:var(--cream);padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:44px}
header h1{font-size:28px}header h1 span{color:var(--green)}
header .who{margin-left:auto;font-size:13px;color:#aaa;display:flex;gap:10px;align-items:center}
header .who button{background:none;border:1px solid #555;color:#ddd;padding:3px 10px;cursor:pointer;font:inherit}
.tabs{display:flex;gap:4px;padding:0 22px;background:#111;overflow-x:auto}
.tabs button{background:#222;color:#bbb;border:0;padding:9px 16px 7px;font-size:17px;cursor:pointer;white-space:nowrap;border-top:3px solid transparent}
.tabs button.on{background:var(--cream);color:var(--ink);border-top-color:var(--green)}
main{max-width:1400px;margin:0 auto;padding:20px 22px 60px}
.panel{display:none}.panel.on{display:block}
.gate{max-width:460px;margin:60px auto;background:var(--paper);border:2px solid var(--ink);padding:24px;text-align:center}
.gate p{margin:10px 0 16px;color:var(--muted)}
.btn{display:inline-block;background:var(--ink);color:var(--cream);border:2px solid var(--ink);padding:7px 14px;font:700 14px 'Barlow',Arial;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--paper);color:var(--ink)}.btn.warn{background:var(--bad);border-color:var(--bad)}.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--paper);border:2px solid var(--ink);padding:10px 14px}
.kpi .big{font-size:38px}.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi.link{cursor:pointer}.kpi.link:hover{background:#fffbe6}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;margin-bottom:16px}
.card h2{font-size:22px;margin-bottom:8px}
.card h3{font-size:18px;margin:12px 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{font:inherit;padding:6px 9px;border:2px solid var(--ink);background:var(--paper)}
table{border-collapse:collapse;width:100%;background:var(--paper)}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft);position:sticky;top:0;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#fffbe6}
.wrapx{overflow-x:auto;border:2px solid var(--ink)}
.sname{min-width:190px}
.nick{font-size:12px;background:#ede9fe;color:#5b21b6;padding:0 6px;margin-left:6px;white-space:nowrap}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;padding:1px 6px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.tag.red{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.tag.green{background:#dcfce7;border-color:#86efac;color:#166534}
.sci{display:inline-flex;gap:3px}.sci b{font-size:12px;padding:0 5px;color:#fff}
.sci .B{background:var(--bio)}.sci .C{background:var(--chem)}.sci .P{background:var(--phys)}
.strip{display:flex;gap:2px}.strip i{width:14px;height:22px;background:var(--n);position:relative}
.strip i.m{background:var(--s)}.strip i.c{background:#60a5fa}.strip i.mc{background:linear-gradient(var(--s) 50%,#60a5fa 50%)}
.bar{display:flex;height:12px;background:var(--n);min-width:80px}.bar i{display:block}
.bar .s{background:var(--s)}.bar .r{background:var(--r)}.bar .l{background:var(--l)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0 10px}.legend span::before{content:'';display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* spec map */
.map td,.map th{padding:3px 4px;border:1px solid #fff;text-align:center;font-size:12px}
.map th{position:sticky;top:0;writing-mode:vertical-rl;transform:rotate(180deg);height:110px;cursor:default;background:var(--soft)}
.map th.row,.map td.row{writing-mode:horizontal-tb;transform:none;text-align:left;position:sticky;left:0;background:var(--paper);min-width:230px;max-width:320px;height:auto;z-index:1}
.map tr.topic td.row{font-weight:700;cursor:pointer}.map tr.topic td.row::before{content:'▸ ';color:var(--muted)}.map tr.topic.open td.row::before{content:'▾ '}
.map tr.pt td.row{padding-left:22px;font-size:12px;color:#333}
.map td.c{min-width:34px;height:24px;color:#111}
/* drawer */
.dim{position:fixed;inset:0;background:#0006;z-index:20;display:none}.dim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--cream);border-left:3px solid var(--ink);z-index:21;overflow-y:auto;padding:18px 20px 40px;transform:translateX(100%);transition:transform .2s}
.drawer.on{transform:none}
.drawer .x{position:absolute;right:14px;top:10px;font-size:28px;background:none;border:0;cursor:pointer}
.drawer h2{font-size:30px;margin-right:30px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.msg{font-size:13px;margin-top:6px}.msg.err{color:var(--bad)}.msg.ok{color:var(--dk)}
.qtext{max-width:520px}.qtext .ans{color:var(--dk);font-weight:700}
.pct{font-weight:700}.pct.low{color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.links a{display:block;padding:4px 0}
.nuc{display:inline-flex;align-items:center;font-family:'Barlow Condensed',sans-serif;font-size:1.2em;line-height:1;vertical-align:middle} .nuc .ns{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.55em;line-height:1.05;margin-right:1px} 
</style>
</head>
<body>
<header><img src="/img/mascot/head-pixel-hd.webp" alt=""><h1>Cakebread <span>Admin</span></h1><div class="who" id="who"></div></header>
<nav class="tabs" id="tabs" hidden>
  <button data-t="overview" class="on">Overview</button><button data-t="students">Students</button><button data-t="map">Spec map</button>
  <button data-t="questions">Questions</button><button data-t="boards">Leaderboards</button><button data-t="bland">Breadventure Land</button><button data-t="backup">Backup</button>
</nav>
<main>
  <div class="gate" id="gate"><h2>Admin</h2><p id="gateMsg">Checking who you are…</p><div id="gateBtn"></div></div>

  <section class="panel on" id="p-overview"></section>
  <section class="panel" id="p-students">
    <div class="toolbar"><input id="sq" placeholder="Search name, email or Questing name" size="34"><label class="small"><input type="checkbox" id="sAll"> Include people who never used Questing, Flashcards or the trackers</label><button class="btn alt sm" data-reload>↻ Reload data</button></div>
    <div class="wrapx" id="sTable"></div>
  </section>
  <section class="panel" id="p-map">
    <div class="toolbar"><select id="mSci"><option value="">All sciences</option><option>Biology</option><option>Chemistry</option><option>Physics</option></select>
      <label class="small"><input type="checkbox" id="mOpen"> Open every topic</label></div>
    <div class="legend"><span style="--c:var(--s)">Secured</span><span style="--c:var(--r)">Rusty</span><span style="--c:var(--l)">Learning</span><span style="--c:var(--n)">Not started</span><span class="muted">Topic cells: % of points secured. Click a topic to see its points.</span></div>
    <div class="wrapx" id="mTable"></div>
  </section>
  <section class="panel" id="p-questions">
    <div class="toolbar"><select id="qSci"><option value="">All sciences</option><option value="B">Biology</option><option value="C">Chemistry</option><option value="P">Physics</option></select>
      <label class="small">At least <select id="qMin"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>10</option></select> answers</label>
      <select id="qSort"><option value="pct">Hardest first</option><option value="n">Most answered</option><option value="rep">Reported first</option></select>
      <a class="btn alt sm" href="/interactive/spec-quiz/reports.html">⚑ Student reports →</a></div>
    <div id="qSum" class="small muted" style="margin-bottom:8px"></div>
    <div class="wrapx" id="qTable"></div>
  </section>
  <section class="panel" id="p-boards"></section>
  <section class="panel" id="p-bland"></section>
  <section class="panel" id="p-backup">
    <div class="card"><h2>Back up everything</h2><p class="muted">Downloads every student's saved data (Questing, flashcards, trackers, long answers) as one file.</p>
      <div class="acts"><button class="btn" id="exp">💾 Download backup</button><button class="btn alt" id="impBtn">📂 Restore from a backup…</button><input type="file" id="imp" accept=".json" hidden></div><div class="msg" id="bMsg"></div></div>
  </section>
</main>
<div class="dim" id="dim"></div>
<aside class="drawer" id="drawer"><button class="x" id="dx" aria-label="Close">×</button><div id="dBody"></div></aside>

<script>window.QE_PASSIVE = true;</script>
<script src="/js/firebase-config.js"></script>
<script src="/js/admin-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="/interactive/spec-quiz/spec.js"></script>
<script src="/interactive/spec-quiz/questions.js"></script>
<script src="/interactive/spec-quiz/gens.js"></script>
<script src="/interactive/spec-quiz/cards.js"></script>
<script src="/interactive/spec-quiz/questing-engine.js"></script>
<script src="/interactive/spec-quiz/bland.js"></script>
<script>
/* Admin console (rebuilt 10 Nov 2026): the whole site + Cakebread Questing. Reads Firestore users/*, specProgress/*,
   and Realtime Database specQuizBoard, specQuizReports, gameScores. Progress maths comes from QE.analyse (same rules as the game). */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = s => String(s || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
const SCI = { B: 'Biology', C: 'Chemistry', P: 'Physics' };
const DAY = 864e5, TODAY = QE.TODAY, WEEK = QE.WEEK;
const dstr = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const lastDays = n => { const t = new Date(TODAY + 'T12:00:00').getTime(); return [...Array(n)].map((_, i) => dstr(t - (n - 1 - i) * DAY)); };
const ago = t => { if (!t) return 'never'; const d = (Date.now() - t) / DAY; return d < 1 / 24 ? 'just now' : d < 1 ? Math.round(d * 24) + 'h ago' : d < 2 ? 'yesterday' : d < 30 ? Math.floor(d) + ' days ago' : new Date(t).toLocaleDateString('en-GB'); };
const xpFor = l => 100 * l * (l - 1) / 2;
const levelOf = (xp, pts) => { let l = 1; while (xpFor(l + 1) <= xp) l++; return Math.min(l, 2 + Math.floor(pts / 8)); };
const QBYID = {}; QUESTIONS.forEach(q => QBYID[q.id] = q);
const TOPICS = []; SPEC.forEach(s => s.topics.forEach(t => { const keys = []; t.subs.forEach(sb => { if (sb.name === 'Units') return; sb.points.forEach(p => { if (QE.POINT_QS[p.key]) keys.push(p.key); }); }); if (keys.length) TOPICS.push({ key: s.name[0] + t.n, sci: s.name, name: t.name, keys }); }));

let DB, RT, ME, D = null;   // D = loaded data

/* ---------- sign in (admins only) ---------- */
firebase.initializeApp(window.firebaseConfig);
const auth = firebase.auth();
auth.onAuthStateChanged(u => {
  ME = u;
  $('who').innerHTML = u ? `${esc(u.email)} <button id="so">Sign out</button>` : '';
  if (u) $('so').onclick = () => auth.signOut();
  const isAdmin = u && (window.ADMIN_EMAILS || []).includes(u.email);
  $('tabs').hidden = !isAdmin; $('gate').style.display = isAdmin ? 'none' : '';
  document.querySelectorAll('.panel').forEach(p => p.style.visibility = isAdmin ? '' : 'hidden');
  if (!u) { $('gateMsg').textContent = 'Sign in with your admin Google account.'; $('gateBtn').innerHTML = '<button class="btn" id="si">Sign in with Google</button>'; $('si').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); return; }
  if (!isAdmin) { $('gateMsg').textContent = 'This account is not an admin.'; $('gateBtn').innerHTML = ''; return; }
  DB = firebase.firestore(); RT = firebase.database(); load();
});

/* ---------- tabs ---------- */
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; show(b.dataset.t); };
function show(t) { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + t)); try { history.replaceState(null, '', '#' + t); } catch (e) {} }
document.addEventListener('click', e => { if (e.target.closest('[data-reload]')) load(); const g = e.target.closest('[data-go]'); if (g) show(g.dataset.go); });

/* ---------- load everything ---------- */
async function load() {
  $('p-overview').innerHTML = '<div class="empty">Loading everyone\'s data…</div>';
  const safe = p => p.catch(e => { console.warn(e); return null; });
  const [us, sp, board, reps, games] = await Promise.all([
    safe(DB.collection('users').get()), safe(DB.collection('specProgress').get()),
    safe(RT.ref('specQuizBoard').once('value')), safe(RT.ref('specQuizReports').once('value')), safe(RT.ref('gameScores').once('value'))]);
  if (!us) { $('p-overview').innerHTML = '<div class="empty">Could not read the users. Check the Firestore rules allow admins to read <code>users</code>.</div>'; return; }
  const specMap = {}; if (sp) sp.forEach(d => specMap[d.id] = d.data());
  const days7 = lastDays(7), days14 = lastDays(14);
  const students = [];
  us.forEach(doc => {
    const u = doc.data(), prog = u.specQuiz || null, game = u.questing || {};
    const a = prog ? QE.analyse(prog) : null;
    const fc = Object.values(u.progress || {}).filter(p => p && p.repetitions > 0).length;
    const subj = (specMap[doc.id] && specMap[doc.id].subjects) || u.specSubjects || {};
    const trk = ['biology', 'chemistry', 'physics'].map(k => { const s = subj[k]; if (!s) return null; const it = s.items || {}, tot = s.total || Object.keys(it).length; return tot ? Math.round(Object.values(it).filter(v => v && v.checkbox).length / tot * 100) : null; });
    const times = [Date.parse(u.lastAccess), Date.parse(u.settings && u.settings.lastStudyDate), Date.parse(u.specQuizSummary && u.specQuizSummary.updatedAt), prog && prog.updatedAt, game.updatedAt].filter(x => x && !isNaN(x));
    const day = d => ({ m: (game.days || {})[d] || 0, c: ((game.cd || {})[d] || {}).n || 0 });
    const st = a ? a.stats : { securedP: 0, securedQ: 0, per: { Biology: 0, Chemistry: 0, Physics: 0 } };
    students.push({
      uid: doc.id, raw: u, prog, game, a,
      name: u.displayName || u.email || doc.id, email: u.email || '',
      nick: game.nick && !QE.checkName(game.nick) ? game.nick : '', badNick: game.nick && game.nick !== '-' && QE.checkName(game.nick) ? game.nick : '',
      last: times.length ? Math.max(...times) : 0,
      xp: prog ? prog.xp || 0 : 0, pts: st.securedP, secQ: st.securedQ, per: st.per,
      level: prog ? levelOf(prog.xp || 0, st.securedP) : 0,
      answered: prog ? Object.values(prog.q || {}).reduce((n, x) => n + (x.n || 0), 0) : 0,
      wk: prog ? (prog.weeks || {})[WEEK] || 0 : 0,
      m7: days7.reduce((n, d) => n + day(d).m, 0), c7: days7.reduce((n, d) => n + day(d).c, 0),
      d14: days14.map(d => Object.assign({ d }, day(d))), fc, trk, hide: !!(prog && prog.hide),
      used: !!(prog && Object.keys(prog.q || {}).length) || fc > 0 || trk.some(x => x != null) || !!(u.longAnswers),
      weak: prog ? Object.keys(prog.weak || {}) : [], coins: game.coins || 0, bag: (game.bag || []).length,
      pending: game.nickPending && !QE.checkName(game.nickPending) ? game.nickPending : '', pendingAt: game.nickAt || 0,
    });
  });
  students.sort((a, b) => b.last - a.last);
  D = { students, board: (board && board.val()) || {}, reps: (reps && reps.val()) || {}, games: (games && games.val()) || {}, at: Date.now(), rtOk: !!board };
  drawOverview(); drawStudents(); drawMap(); drawQuestions(); drawBoards(); loadBland();
  const h = location.hash.slice(1); if (h && $('p-' + h)) show(h);
}

/* ---------- Overview ---------- */
function openReports() { return Object.values(D.reps).filter(r => r && !r.resolved).length; }
function questionStats() {
  const o = {};
  D.students.forEach(s => { if (!s.prog) return; for (const [id, x] of Object.entries(s.prog.q || {})) { if (!x.n) continue; const q = o[id] = o[id] || { id, n: 0, r: 0, who: 0 }; q.n += x.n; q.r += x.r || 0; q.who++; } });
  const rep = {}; Object.values(D.reps).forEach(r => { if (r && !r.resolved) rep[r.qid] = (rep[r.qid] || 0) + 1; });
  return Object.values(o).map(q => Object.assign(q, { pct: q.n ? q.r / q.n : 0, rep: rep[q.id] || 0 }));
}
function drawOverview() {
  const S = D.students, act = S.filter(s => s.used), now = Date.now();
  const today = S.filter(s => dstr(s.last) === TODAY).length, week = S.filter(s => now - s.last < 7 * DAY).length;
  const players = S.filter(s => s.prog && s.answered).length;
  const m7 = S.reduce((n, s) => n + s.m7, 0), c7 = S.reduce((n, s) => n + s.c7, 0), wk = S.reduce((n, s) => n + s.wk, 0);
  const qs = questionStats(), hard = qs.filter(q => q.n >= 3).sort((a, b) => a.pct - b.pct).slice(0, 5);
  const quiet = act.filter(s => now - s.last >= 7 * DAY).sort((a, b) => b.last - a.last).slice(0, 8);
  const top = S.filter(s => s.wk).sort((a, b) => b.wk - a.wk).slice(0, 5);
  const rep = openReports();
  const kpi = (n, label, go) => `<div class="kpi ${go ? 'link' : ''}" ${go ? `data-go="${go}"` : ''}><div class="big">${n}</div><small>${label}</small></div>`;
  const waiting = S.filter(s => s.pending).sort((a, b) => a.pendingAt - b.pendingAt);
  $('p-overview').innerHTML = `${waiting.length ? `<div class="card" style="border-color:#7c3aed"><h2>Names waiting for you (${waiting.length})</h2><table>${waiting.map(s => `<tr><td><b class="nick" style="font-size:15px">${esc(s.pending)}</b></td><td>${esc(s.name)} <span class="small muted">now shown as ${esc(s.nick || googleName(s))} · asked ${ago(s.pendingAt)}</span></td><td style="text-align:right;white-space:nowrap"><button class="btn sm" data-ok="${s.uid}">Approve</button> <button class="btn alt sm" data-no="${s.uid}">Reject</button></td></tr>`).join('')}</table><div class="msg" id="nqMsg"></div></div>` : ''}
    <div class="kpis">${kpi(act.length, 'students who have used the site', 'students')}${kpi(today, 'active today', 'students')}${kpi(week, 'active in the last 7 days', 'students')}
      ${kpi(players, 'play Cakebread Questing', 'students')}${kpi(m7, 'missions in the last 7 days')}${kpi(c7, 'flashcards reviewed, last 7 days')}${kpi(wk, 'right answers this week')}
      <a class="kpi link" href="/interactive/spec-quiz/reports.html" style="text-decoration:none;color:inherit${rep ? ';border-color:var(--bad)' : ''}"><div class="big" style="${rep ? 'color:var(--bad)' : ''}">${rep}</div><small>open question reports ⚑</small></a></div>
    <div class="cols">
      <div class="card"><h2>This week's most correct</h2>${top.length ? `<table>${top.map((s, i) => `<tr class="click" data-uid="${s.uid}"><td>${i + 1}</td><td>${esc(s.name)}${s.nick ? `<span class="nick">${esc(s.nick)}</span>` : ''}</td><td class="n">${s.wk}</td></tr>`).join('')}</table>` : '<p class="muted">Nobody has answered anything this week yet.</p>'}</div>
      <div class="card"><h2>Gone quiet <span class="small muted" style="text-transform:none;font-family:Barlow">7+ days</span></h2>${quiet.length ? `<table>${quiet.map(s => `<tr class="click" data-uid="${s.uid}"><td>${esc(s.name)}</td><td class="muted">${ago(s.last)}</td></tr>`).join('')}</table>` : '<p class="muted">Everyone has been on in the last week.</p>'}</div>
      <div class="card"><h2>Hardest questions</h2>${hard.length ? `<table>${hard.map(q => qRow(q, true)).join('')}</table><p style="margin-top:8px"><a href="#questions" data-go="questions">All questions →</a></p>` : '<p class="muted">Not enough answers yet (needs 3+ on a question).</p>'}</div>
      <div class="card links"><h2>Quick links</h2>

    </div>`;
}

/* ---------- Students ---------- */
let sSort = 'last', sDir = -1;
const sciChips = p => `<span class="sci"><b class="B">${p.Biology}</b><b class="C">${p.Chemistry}</b><b class="P">${p.Physics}</b></span>`;
const stripHtml = d14 => `<span class="strip" title="Last 14 days: green = mission, blue = flashcards">${d14.map(d => `<i class="${d.m && d.c ? 'mc' : d.m ? 'm' : d.c ? 'c' : ''}" title="${d.d}: ${d.m} mission${d.m === 1 ? '' : 's'}, ${d.c} card${d.c === 1 ? '' : 's'}"></i>`).join('')}</span>`;
function drawStudents() {
  const q = $('sq').value.trim().toLowerCase();
  let rows = D.students.filter(s => ($('sAll').checked || s.used) && (!q || (s.name + ' ' + s.email + ' ' + s.nick).toLowerCase().includes(q)));
  rows.sort((a, b) => { const x = a[sSort], y = b[sSort]; return (typeof x === 'string' ? x.localeCompare(y) : (x || 0) - (y || 0)) * sDir; });
  const th = (k, t, n) => `<th class="${n ? 'n' : ''}" data-k="${k}">${t}${sSort === k ? (sDir < 0 ? ' ▾' : ' ▴') : ''}</th>`;
  $('sTable').innerHTML = rows.length ? `<table><thead><tr>${th('name', 'Student')}${th('last', 'Last on')}${th('level', 'Level', 1)}${th('xp', 'XP', 1)}${th('pts', 'Spec points secured', 1)}${th('wk', 'Right this week', 1)}${th('m7', 'Missions 7d', 1)}${th('c7', 'Cards 7d', 1)}<th>Last 14 days</th>${th('fc', 'Cards studied (all time)', 1)}<th>Tracker ticked B / C / P</th></tr></thead><tbody>
    ${rows.map(s => `<tr class="click" data-uid="${s.uid}"><td class="sname"><b>${esc(s.name)}</b>${s.nick ? `<span class="nick">${esc(s.nick)}</span>` : ''}${s.badNick ? ' <span class="tag red">name blocked</span>' : ''}${s.pending ? ` <span class="tag" style="background:#ede9fe">wants “${esc(s.pending)}”</span>` : ''}${s.hide ? ' <span class="tag">hidden</span>' : ''}<div class="small muted">${esc(s.email)}</div></td>
      <td class="small">${ago(s.last)}</td><td class="n">${s.level || '–'}</td><td class="n">${s.xp}</td><td class="n">${s.pts} ${s.pts ? sciChips(s.per) : ''}</td><td class="n">${s.wk}</td><td class="n">${s.m7}</td><td class="n">${s.c7}</td><td>${stripHtml(s.d14)}</td><td class="n">${s.fc}</td>
      <td class="small">${s.trk.map(x => x == null ? '–' : x + '%').join(' / ')}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nobody matches.</div>';
}
$('sq').oninput = drawStudents; $('sAll').onchange = drawStudents;
$('sTable').addEventListener('click', e => { const h = e.target.closest('th[data-k]'); if (h) { const k = h.dataset.k; sDir = sSort === k ? -sDir : (k === 'name' ? 1 : -1); sSort = k; drawStudents(); } });
document.addEventListener('click', e => { const r = e.target.closest('tr[data-uid]'); if (r && !e.target.closest('button,a')) openStudent(r.dataset.uid); });

/* ---------- one student ---------- */
function topicBars(a) {
  return TOPICS.map(t => { const x = a.topics[t.key] || { n: t.keys.length, s: 0, r: 0, l: 0 }; const w = v => (v / x.n * 100).toFixed(1) + '%';
    return `<tr><td class="small" style="white-space:nowrap"><b>${t.key}</b> ${esc(t.name)}</td><td style="width:45%"><div class="bar" title="${x.s} secured, ${x.r} rusty, ${x.l} learning of ${x.n}"><i class="s" style="width:${w(x.s)}"></i><i class="r" style="width:${w(x.r)}"></i><i class="l" style="width:${w(x.l)}"></i></div></td><td class="n small">${x.s + x.r}/${x.n}</td></tr>`; }).join('');
}
function openStudent(uid) {
  const s = D.students.find(x => x.uid === uid); if (!s) return;
  const P = s.prog, missed = P ? Object.entries(P.q || {}).filter(([, x]) => x.n - (x.r || 0) >= 1).sort((a, b) => (b[1].n - (b[1].r || 0)) - (a[1].n - (a[1].r || 0))).slice(0, 8) : [];
  $('dBody').innerHTML = `<h2>${esc(s.name)}</h2><div class="small muted">${esc(s.email)} · last on ${ago(s.last)}</div>
    <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Public name</h3>
      <p>${s.nick ? `<b>${esc(s.nick)}</b> (their Cakebread Questing name)` : 'First name + initial from Google (no Questing name chosen)'}${s.badNick ? `<br><span class="tag red">blocked</span> they typed “${esc(s.badNick)}”, which the rules reject, so the boards show their Google name` : ''}</p>
      ${s.pending ? `<p style="margin-top:6px">⏳ Wants to be <b>${esc(s.pending)}</b> (asked ${ago(s.pendingAt)}) <button class="btn sm" data-ok="${s.uid}">Approve</button> <button class="btn alt sm" data-no="${s.uid}">Reject</button></p>` : ''}
      <div class="acts"><input id="nn" placeholder="New name" maxlength="16" style="font:inherit;padding:5px 8px;border:2px solid var(--ink)"><button class="btn sm" id="ren">Rename</button><button class="btn alt sm" id="clr">Use their Google name</button>
      ${s.prog ? `<button class="btn alt sm" id="hid">${s.hide ? 'Hidden from boards ✓' : 'Hide from leaderboards'}</button>` : ''}</div><div class="msg" id="dMsg"></div></div>
    ${P ? `<div class="kpis" style="margin-top:4px"><div class="kpi"><div class="big">${s.level}</div><small>level · ${s.xp} XP</small></div><div class="kpi"><div class="big">${s.pts}</div><small>spec points secured ${sciChips(s.per)}</small></div>
      <div class="kpi"><div class="big">${s.secQ}</div><small>questions secured</small></div><div class="kpi"><div class="big">${s.answered}</div><small>answers given · ${P.correct || 0} right</small></div>
      <div class="kpi"><div class="big">${P.missions || 0}</div><small>missions in total</small></div><div class="kpi"><div class="big">${s.coins}</div><small>coins · ${s.bag} items found</small></div></div>
      <div class="card"><h3 style="margin-top:0">Last 14 days</h3>${stripHtml(s.d14)}<p class="small muted" style="margin-top:4px">Green = mission, blue = flashcards. Last 7 days: ${s.m7} missions, ${s.c7} cards.</p></div>
      <div class="card"><h3 style="margin-top:0">Topics</h3><div class="legend"><span style="--c:var(--s)">Secured</span><span style="--c:var(--r)">Rusty</span><span style="--c:var(--l)">Learning</span></div><table>${topicBars(s.a)}</table></div>
      ${s.weak.length ? `<div class="card"><h3 style="margin-top:0">Flashcards they found hard</h3><p>${s.weak.map(k => `<span class="tag">${k}</span>`).join(' ')}</p></div>` : ''}
      ${missed.length ? `<div class="card"><h3 style="margin-top:0">Questions they get wrong most</h3><table>${missed.map(([id, x]) => { const q = QBYID[id]; return `<tr><td class="small"><b>${id}</b> ${q ? esc(strip(q.q || '(calculation)')).slice(0, 140) : ''}</td><td class="n small">${(x.r || 0)}/${x.n} right</td></tr>`; }).join('')}</table></div>` : ''}`
    : '<p class="muted" style="margin:12px 0">Hasn\'t played Cakebread Questing yet.</p>'}
    <div class="card"><h3 style="margin-top:0">Other tools</h3><p>Flashcards studied (all time): <b>${s.fc}</b><br>Spec tracker ticked: Biology ${s.trk[0] ?? '–'}% · Chemistry ${s.trk[1] ?? '–'}% · Physics ${s.trk[2] ?? '–'}%<br>Physics long answers: ${s.raw.longAnswersSummary && s.raw.longAnswersSummary.physics ? esc(JSON.stringify(s.raw.longAnswersSummary.physics).slice(0, 120)) : 'none'}</p></div>`;
  $('dim').classList.add('on'); $('drawer').classList.add('on'); $('drawer').scrollTop = 0;
  const msg = (t, ok) => { $('dMsg').className = 'msg ' + (ok ? 'ok' : 'err'); $('dMsg').textContent = t; };
  const setNick = async nick => {
    try {
      await DB.collection('users').doc(uid).update({ 'questing.nick': nick, 'questing.nickPending': null, 'questing.updatedAt': Date.now() });
      let boardNote = '';
      if (D.board[uid]) { const shown = nick === '-' ? googleName(s) : nick; try { await RT.ref('specQuizBoard/' + uid + '/name').set(shown); D.board[uid].name = shown; } catch (e) { boardNote = ' The Questing board updates next time they play.'; } }
      s.game.nick = nick; s.nick = nick === '-' ? '' : nick; s.badNick = ''; s.pending = '';
      msg('Saved.' + boardNote + ' Game leaderboards pick it up next time they play.', true); drawStudents(); drawBoards();
    } catch (e) { msg('Could not save: ' + (e.code || e.message) + '. The Firestore rules may not let admins edit students.'); }
  };
  $('ren').onclick = () => { const n = QE.cleanName($('nn').value), bad = QE.checkName(n); if (bad) return msg(bad); setNick(n); };
  $('clr').onclick = () => setNick('-');
  if ($('hid')) $('hid').onclick = async () => {
    if (s.hide) return msg('Already hidden. Students can switch this themselves on Base camp.', true);
    try { await DB.collection('users').doc(uid).update({ 'specQuiz.hide': true, 'specQuiz.updatedAt': Date.now() }); s.hide = true; s.prog.hide = true;
      try { if (D.board[uid]) { await RT.ref('specQuizBoard/' + uid + '/hide').set(true); D.board[uid].hide = true; } } catch (e) {}
      msg('Hidden from the Cakebread Questing boards.', true); $('hid').textContent = 'Hidden from boards ✓'; drawStudents(); drawBoards();
    } catch (e) { msg('Could not save: ' + (e.code || e.message)); }
  };
}
/* name approvals (students' new names wait for the admin) */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-ok],[data-no]'); if (!b) return;
  const uid = b.dataset.ok || b.dataset.no, ok = !!b.dataset.ok, s = D.students.find(x => x.uid === uid); if (!s || !s.pending) return;
  const out = $('dMsg') && $('drawer').classList.contains('on') ? $('dMsg') : $('nqMsg');
  try {
    const upd = { 'questing.nickPending': null, 'questing.updatedAt': Date.now() };
    if (ok) upd['questing.nick'] = s.pending;
    await DB.collection('users').doc(uid).update(upd);
    if (ok) { try { if (D.board[uid]) { await RT.ref('specQuizBoard/' + uid + '/name').set(s.pending); D.board[uid].name = s.pending; } } catch (err) {} s.nick = s.pending; s.game.nick = s.pending; }
    s.pending = ''; s.game.nickPending = null;
    drawOverview(); drawStudents(); drawBoards(); if ($('drawer').classList.contains('on')) openStudent(uid);
  } catch (err) { if (out) { out.className = 'msg err'; out.textContent = 'Could not save: ' + (err.code || err.message) + '. The Firestore rules may not let admins edit students.'; } }
});
const googleName = s => { const n = (s.raw.displayName || 'Student').trim().split(/\s+/); return n[0] + (n.length > 1 ? ' ' + n[n.length - 1][0] + '.' : ''); };
const closeD = () => { $('dim').classList.remove('on'); $('drawer').classList.remove('on'); };
$('dx').onclick = closeD; $('dim').onclick = closeD; document.addEventListener('keydown', e => { if (e.key === 'Escape') closeD(); });

/* ---------- Spec map ---------- */
const COL = { s: 'var(--s)', r: 'var(--r)', l: 'var(--l)', n: 'var(--n)' };
const open = new Set();
function drawMap() {
  const S = D.students.filter(s => s.a && s.answered + Object.keys(s.prog.cards || {}).length > 0);
  if (!S.length) { $('mTable').innerHTML = '<div class="empty">Nobody has started Cakebread Questing or Flashcards yet.</div>'; return; }
  const sci = $('mSci').value, all = $('mOpen').checked;
  const short = s => s.nick || googleName(s);
  const shade = p => p == null ? 'var(--n)' : `color-mix(in srgb, var(--s) ${Math.round(p * 100)}%, #f3f0e6)`;
  let h = `<table class="map"><thead><tr><th class="row">Topic / spec point</th><th>Everyone</th>${S.map(s => `<th title="${esc(s.name)}">${esc(short(s))}</th>`).join('')}</tr></thead><tbody>`;
  TOPICS.filter(t => !sci || t.sci === sci).forEach(t => {
    const isOpen = all || open.has(t.key);
    const pc = s => { const x = s.a.topics[t.key]; return x ? (x.s + x.r) / x.n : 0; };
    const avg = S.reduce((n, s) => n + pc(s), 0) / S.length;
    h += `<tr class="topic ${isOpen ? 'open' : ''}" data-t="${t.key}"><td class="row">${t.key} ${esc(t.name)}</td><td class="c" style="background:${shade(avg)}"><b>${Math.round(avg * 100)}</b></td>${S.map(s => `<td class="c" style="background:${shade(pc(s))}">${Math.round(pc(s) * 100) || ''}</td>`).join('')}</tr>`;
    if (isOpen) t.keys.forEach(k => {
      const P = QE.POINTS[k], sec = S.filter(s => ['s', 'r'].includes(s.a.points[k])).length;
      h += `<tr class="pt"><td class="row" title="${esc(P ? P.text : '')}">${k.slice(1)} ${esc(P ? strip(P.text).slice(0, 60) : '')}</td><td class="c" style="background:${shade(sec / S.length)}">${sec}/${S.length}</td>${S.map(s => `<td class="c" style="background:${COL[s.a.points[k]]}" title="${esc(short(s))}: ${({ s: 'secured', r: 'rusty', l: 'learning', n: 'not started' })[s.a.points[k]]}"></td>`).join('')}</tr>`;
    });
  });
  $('mTable').innerHTML = h + '</tbody></table>';
}
$('mSci').onchange = drawMap; $('mOpen').onchange = drawMap;
$('mTable').addEventListener('click', e => { const r = e.target.closest('tr.topic'); if (!r) return; const k = r.dataset.t; open.has(k) ? open.delete(k) : open.add(k); drawMap(); });

/* ---------- Questions ---------- */
function qSample(q) {
  if (!q) return { text: '(question no longer in the bank)', ans: '' };
  // the bank is our own HTML (nuclide notation, sub/superscripts), so it is shown as written
  if (q.gen) { try { const g = q.gen(R); return { text: g.q + ' <i class="muted">(random numbers each time)</i>', ans: g.o ? g.o[0] : '' }; } catch (e) { return { text: '(calculation)', ans: '' }; } }
  return { text: q.q, ans: 'tf' in q ? (q.tf ? 'True' : 'False') : q.o[0] };
}
function qRow(x, compact) {
  const q = QBYID[x.id], smp = qSample(q), p = Math.round(x.pct * 100);
  return `<tr><td class="small"><b>${x.id}</b>${x.rep ? ` <span class="tag red">⚑ ${x.rep}</span>` : ''}</td><td class="qtext small">${smp.text}${compact ? '' : `<br><span class="ans">✓ ${smp.ans}</span>`}</td>
    <td class="n"><span class="pct ${p < 40 ? 'low' : ''}">${p}%</span><div class="small muted">${x.r}/${x.n}${compact ? '' : ` · ${x.who} student${x.who === 1 ? '' : 's'}`}</div></td></tr>`;
}
function drawQuestions() {
  const all = questionStats(), sci = $('qSci').value, min = +$('qMin').value, sort = $('qSort').value;
  let rows = all.filter(q => q.n >= min && (!sci || q.id[0] === sci));
  rows.sort(sort === 'n' ? (a, b) => b.n - a.n : sort === 'rep' ? (a, b) => b.rep - a.rep || a.pct - b.pct : (a, b) => a.pct - b.pct || b.n - a.n);
  const answered = new Set(all.map(q => q.id));
  $('qSum').textContent = `${answered.size} of ${QUESTIONS.length} questions have been answered at least once; ${all.reduce((n, q) => n + q.n, 0)} answers in total. % = answers right (all attempts, all students). Under 40% usually means a hard question — or a wrong answer key.`;
  $('qTable').innerHTML = rows.length ? `<table><thead><tr><th>Question</th><th>Text and answer</th><th class="n">Right</th></tr></thead><tbody>${rows.slice(0, 300).map(q => qRow(q)).join('')}</tbody></table>` : '<div class="empty">No questions with that many answers yet.</div>';
}
['qSci', 'qMin', 'qSort'].forEach(id => $(id).onchange = drawQuestions);

/* ---------- Leaderboards ---------- */
function drawBoards() {
  const rows = Object.entries(D.board).map(([uid, x]) => Object.assign({ uid }, x)).sort((a, b) => (b.xp || 0) - (a.xp || 0));
  const thisWk = rows.filter(r => r.wk === WEEK);
  const leg = [['wb', 'Biology', 'Syringe of Plot Armour'], ['wc', 'Chemistry', "The Philosopher's Pebble"], ['wp', 'Physics', 'Definitely-Not-Uranium Dodgeball']].map(([k, s, item]) => {
    const best = thisWk.filter(r => !r.hide && r[k]).sort((a, b) => b[k] - a[k])[0]; return `<tr><td>${s}</td><td class="small muted">${item}</td><td>${best ? `<b>${esc(best.name)}</b> (${best[k]} right)` : '<span class="muted">nobody yet</span>'}</td></tr>`; }).join('');
  const boards = Object.keys(D.games).sort();
  $('p-boards').innerHTML = `${D.rtOk ? '' : '<div class="card" style="border-color:var(--bad)">Couldn\'t read the Realtime Database.</div>'}
    <div class="card"><h2>Legendary holders this week</h2><table>${leg}</table></div>
    <div class="card"><h2>Cakebread Questing board</h2><div class="wrapx"><table><thead><tr><th>Name on the board</th><th class="n">XP</th><th class="n">Points secured</th><th class="n">This week B / C / P</th><th>Last saved</th><th></th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><b>${esc(r.name)}</b>${r.hide ? ' <span class="tag">hidden</span>' : ''}</td><td class="n">${r.xp || 0}</td><td class="n">${r.pts || 0}</td><td class="n">${r.wk === WEEK ? `${r.wb || 0} / ${r.wc || 0} / ${r.wp || 0}` : '–'}</td><td class="small">${ago(r.t)}</td><td><button class="btn alt sm" data-del="specQuizBoard/${r.uid}">Delete</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">Empty.</td></tr>'}</tbody></table></div></div>
    <div class="card"><h2>Game leaderboards</h2><div class="toolbar"><select id="gb">${boards.map(b => `<option>${b}</option>`).join('')}</select></div><div id="gbt"></div></div>
    <div class="msg" id="lbMsg"></div>`;
  const drawG = () => { const b = $('gb') && $('gb').value; if (!b) { $('gbt').innerHTML = '<p class="muted">No scores yet.</p>'; return; }

  if ($('gb')) $('gb').onchange = drawG; drawG();
}
$('p-boards').addEventListener('click', async e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!confirm('Delete this leaderboard row?')) return;
  try { await RT.ref(b.dataset.del).remove(); const p = b.dataset.del.split('/'); if (p[0] === 'specQuizBoard') delete D.board[p[1]]; else delete D.games[p[1]][p[2]]; drawBoards(); }
  catch (err) { $('lbMsg').className = 'msg err'; $('lbMsg').textContent = 'Not allowed: the Realtime Database rules need the admin line for ' + b.dataset.del.split('/')[0] + '.'; }

/* ---------- Breadventure Land (the shared world, bland.js) ---------- */

      <div class="card"><h2>Bosses</h2><table><thead><tr><th>Boss</th><th class="n">Health</th><th class="n">Fought by</th><th>Set health</th></tr></thead><tbody>
        ${bosses.map(([k, P]) => `<tr><td><b>${esc(P.name)}</b><div class="small muted">${P.ch === 2 ? 'Chapter 2' : 'Chapter 1 · key piece'}</div></td><td class="n">${w.boss[k] ?? P.max} / ${P.max}</td><td class="n">${Object.keys((w.hit || {})[k] || {}).length}</td>
          <td><input type="number" min="0" max="${P.max}" value="${w.boss[k] ?? P.max}" data-bhp="${k}" style="width:80px;font:inherit;padding:3px 6px;border:2px solid var(--ink)"> <button class="btn alt sm" data-bset="${k}">Save</button></td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h2>World</h2>
        <p>Chapter: <select id="blCh" style="font:inherit;padding:4px"><option value="1" ${w.chapter < 2 ? 'selected' : ''}>1 · Free the Professor</option><option value="2" ${w.chapter >= 2 ? 'selected' : ''}>2 · The monsters wake</option></select> <button class="btn alt sm" id="blChSave">Save</button></p>
        <p style="margin-top:10px"><button class="btn sm" id="blRun" ${due ? '' : 'disabled'}>🌙 Run tonight's night now</button> <span class="small muted">${due ? 'Runs everyone\'s planned moves, as if a student had opened the map.' : 'Already run today. It runs again after midnight.'}</span></p>
        ${(w.log || []).length ? `<h3>What's happened</h3><ul style="margin-left:18px">${w.log.slice(-8).map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
        <h3>Danger</h3><button class="btn warn sm" id="blReset">Reset the whole world</button> <span class="small muted">Bosses back to full, chapter 1, every player back to the Cakelab with 6 moves.</span></div>
    </div>
    <div class="card"><h2>Players</h2><div class="wrapx"><table><thead><tr><th>Player</th><th>Where</th><th class="n">Health</th><th class="n">Moves</th><th>Planned tonight</th><th>Waiting to collect</th><th></th></tr></thead><tbody>
      ${players.map(({ u, st, p, s }) => { const planned = p.plan && p.plan.day === w.day ? p.plan.steps : [];
        return `<tr><td><b>${esc(p.name || '?')}</b><div class="small muted">${esc(s ? s.name : u)}</div></td><td>${esc(placeName(st.at || BL.HOME))}</td><td class="n">${st.health ?? '–'} / ${p.hp ?? '–'}</td><td class="n">${st.moves ?? 0}</td>
          <td class="small">${planned.length ? planned.map(placeName).map(esc).join(' → ') : '<span class="muted">nothing</span>'}</td><td class="small">${st.pending ? `🪙 ${st.pending.coins || 0}${(st.pending.items || []).length ? ' + ' + st.pending.items.length + ' item' : ''}` : ''}</td>
          <td style="white-space:nowrap"><button class="btn alt sm" data-bheal="${u}">Heal + to Cakelab</button> <button class="btn alt sm" data-bdel="${u}">Remove</button></td></tr>`; }).join('') || '<tr><td colspan="7" class="muted">No players yet.</td></tr>'}</tbody></table></div></div>
    <div class="msg" id="blMsg"></div>`;
  const fail = e => { $('blMsg').className = 'msg err'; $('blMsg').textContent = 'Not saved: ' + (e.code || e.message) + '. Check the bland block in the Realtime Database rules.'; };
  el.querySelectorAll('[data-bset]').forEach(b => b.onclick = async () => { const k = b.dataset.bset, v = Math.max(0, Math.min(BL.PLACES[k].max, +el.querySelector(`[data-bhp="${k}"]`).value || 0));
    try { await RT.ref('bland/world/boss/' + k).set(v); await BL.load(); drawBland(`${BL.PLACES[k].name}: health set to ${v}.`); } catch (e) { fail(e); } });
  $('blChSave').onclick = async () => { try { await RT.ref('bland/world/chapter').set(+$('blCh').value); await BL.load(); drawBland('Chapter saved.'); } catch (e) { fail(e); } };
  $('blRun').onclick = async () => { try { const r = await BL.runNightIfDue(false); await BL.load(); drawBland(r ? `Night run for ${Object.keys(r.states).length} players.` : 'Someone else ran it just now.'); } catch (e) { fail(e); } };
  $('blReset').onclick = async () => { if (!confirm('Reset Breadventure Land for everyone? Bosses, chapter, positions, fog and banked moves all start again. Coins and items already collected stay.')) return;
    try { const upd = { world: BL.newWorld() }; Object.entries(BL.states).forEach(([u, st]) => { upd['state/' + u] = Object.assign(BL.newState((BL.pubs[u] || {}).hp || 15), { pending: st.pending || null }); });
      await RT.ref('bland').update(upd); await BL.load(); drawBland('The world has been reset.'); } catch (e) { fail(e); } };
  el.querySelectorAll('[data-bheal]').forEach(b => b.onclick = async () => { const u = b.dataset.bheal; try { await RT.ref('bland/state/' + u).update({ at: BL.HOME, health: (BL.pubs[u] || {}).hp || 15 }); await BL.load(); drawBland('Sent to the Cakelab with full Health.'); } catch (e) { fail(e); } });
  el.querySelectorAll('[data-bdel]').forEach(b => b.onclick = async () => { const u = b.dataset.bdel; if (!confirm('Remove this player from Breadventure Land? They start again in the Cakelab next time they open the map.')) return;
    try { await RT.ref('bland/state/' + u).remove(); await RT.ref('bland/pub/' + u).remove(); await BL.load(); drawBland('Player removed.'); } catch (e) { fail(e); } });
}

/* ---------- Backup ---------- */
$('exp').onclick = async () => {
  try { const snap = await DB.collection('users').get(), out = { exportedAt: new Date().toISOString(), version: 2, users: {}, specProgress: {} };
    snap.forEach(d => out.users[d.id] = d.data());
    try { (await DB.collection('specProgress').get()).forEach(d => out.specProgress[d.id] = d.data()); } catch (e) {}
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
    a.download = `cakebread-backup-${TODAY}.json`; a.click(); $('bMsg').className = 'msg ok'; $('bMsg').textContent = `Downloaded ${Object.keys(out.users).length} students.`;
  } catch (e) { $('bMsg').className = 'msg err'; $('bMsg').textContent = 'Backup failed: ' + e.message; }
};
$('impBtn').onclick = () => $('imp').click();
$('imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = async () => { try { const b = JSON.parse(rd.result); if (!b.users) throw new Error('no students in this file');
    if (!confirm(`Restore the backup from ${b.exportedAt ? new Date(b.exportedAt).toLocaleString('en-GB') : 'an unknown date'}?\n\n${Object.keys(b.users).length} students. Their current data is replaced and this can't be undone.`)) return;
    for (const [uid, d] of Object.entries(b.users)) await DB.collection('users').doc(uid).set(d);
    for (const [uid, d] of Object.entries(b.specProgress || {})) await DB.collection('specProgress').doc(uid).set(d);
    $('bMsg').className = 'msg ok'; $('bMsg').textContent = 'Restored.'; load();
  } catch (err) { $('bMsg').className = 'msg err'; $('bMsg').textContent = 'Restore failed: ' + err.message; } e.target.value = ''; };
  rd.readAsText(f); };
</script>
</body>
</html>
