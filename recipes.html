<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recipes - Cakebread Science</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--green:#005e22;--green2:#00a03a;--ink:#111;--cream:#eeeae0;--paper:#fff;--muted:#555;--line:#d8d3c4;--soft:#f6f4ee;--strike:#aaa}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
body{font-family:'Barlow','Arial Narrow',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;font-size:16px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto}
.stripes{display:flex;flex-direction:column}.stripes i{display:block}
header{background:#111;padding:28px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;overflow:hidden}
@media(min-width:700px){header{padding:34px 44px 30px}}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--green) 0%,var(--green) 60%,var(--green2) 60%,var(--green2) 72%,var(--green) 72%,var(--green) 100%)}
header a{text-decoration:none}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:clamp(42px,10vw,80px);font-weight:900;text-transform:uppercase;letter-spacing:-2px;color:var(--cream);line-height:.9;display:flex;align-items:center;gap:0}
.brand .accent{color:var(--green2)}
.brand .dot{color:var(--green2);font-size:.6em;margin-left:.08em;line-height:1}
.hb-right{display:flex;align-items:center;gap:14px;color:#888;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:3px;font-size:13px}
.hb-right .home{color:var(--cream);text-decoration:none;border:2px solid var(--cream);padding:6px 12px;line-height:1;transition:all .1s}
.hb-right .home:hover{background:var(--cream);color:#111}
@media(max-width:600px){.hb-right .label{display:none}}
.wrap{max-width:1150px;margin:0 auto;padding:24px 16px 56px}
.back{display:inline-block;margin-bottom:14px;color:var(--green);font-weight:600;text-decoration:none}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(32px,6vw,48px);line-height:1;letter-spacing:-.5px}
.lede{font-size:17px;max-width:760px;margin-top:10px;color:var(--muted)}
h2{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;font-size:28px;line-height:1.05;margin-bottom:4px}
h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:21px}
button{font:inherit;cursor:pointer}

.controls{margin:22px 0 14px;display:grid;gap:10px}
.search{display:flex;border:2px solid var(--ink);background:var(--paper)}
.search input{flex:1;border:0;padding:11px 14px;font:inherit;font-size:16px;background:transparent;min-width:0}
.search input:focus{outline:none}
.search .count{padding:11px 14px;background:var(--ink);color:var(--cream);font-weight:600;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--soft);border:2px solid var(--ink);padding:5px 12px;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.5px;font-family:'Barlow Condensed',sans-serif;color:var(--ink);line-height:1.2}
.chip:hover{background:var(--cream)}
.chip.on{background:var(--ink);color:var(--cream)}
.chip.star-chip{padding:5px 10px;font-size:17px;line-height:1;color:#f0a000;background:var(--paper);border-color:var(--ink)}
.chip.star-chip:hover{background:#fff8e0}
.chip.star-chip.on{background:#f0a000;border-color:#f0a000;color:#fff;text-shadow:0 0 1px #111}

.grid{display:grid;grid-template-columns:340px 1fr;gap:16px;margin-top:16px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}

.list{background:var(--paper);border:2px solid var(--ink);max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media(max-width:820px){.list{max-height:50vh}}
.grp{background:var(--ink);color:var(--cream);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;padding:6px 12px;position:sticky;top:0;z-index:1;font-family:'Barlow Condensed',sans-serif}
.row{position:relative;display:flex;justify-content:flex-start;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 32px 10px 12px;color:inherit}
.row .star{position:absolute;top:8px;right:10px;color:#f0a000;font-size:18px;line-height:1;text-shadow:0 0 1px #111}
.hero .star{position:absolute;top:12px;right:14px;color:#f0a000;font-size:28px;line-height:1;text-shadow:0 0 2px #000}
.row:hover{background:var(--soft)}
.row.on{background:#e3f1e6;box-shadow:inset 5px 0 0 var(--green)}
.row .emo{flex:0 0 26px;font-size:20px;line-height:1;text-align:center}
.row .meat{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;line-height:1.2}
.row .s{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.panel{background:var(--paper);border:2px solid var(--ink);min-height:300px}
.panel .bar{display:flex;height:6px}.panel .bar i{display:block}
.panel .in{padding:0}
.hero{display:flex;align-items:center;gap:16px;padding:18px 20px;background:linear-gradient(90deg,var(--green) 0%,var(--green) 55%,var(--ink) 55%,var(--ink) 100%);color:var(--cream);position:relative;overflow:hidden}
.hero .big{font-size:64px;line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
.hero .ht{flex:1;min-width:0}
.hero h2{color:var(--cream)}
.hero .tag.serv{background:var(--cream);color:var(--green);border-color:var(--cream)}
.hero .tag{background:transparent;color:var(--cream);border-color:var(--cream)}
.body{padding:16px 20px 24px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;background:var(--cream);border:1px solid var(--ink);font-family:'Barlow Condensed',sans-serif}
.tag.serv{background:var(--green);color:var(--cream);border-color:var(--green)}
.tag.check{background:#c62828;color:var(--cream);border-color:#c62828}
.row .check-flag{display:inline-block;background:#c62828;color:var(--cream);font-size:9px;font-weight:700;padding:1px 5px;letter-spacing:1px;margin-left:6px;vertical-align:middle;font-family:'Barlow Condensed',sans-serif}

.scaler{display:flex;align-items:stretch;gap:0;margin:14px 0 6px;border:2px solid var(--ink);width:max-content;background:var(--paper)}
.scaler .lbl{padding:8px 12px;background:var(--ink);color:var(--cream);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;display:flex;align-items:center}
.scaler button{background:var(--soft);border:0;padding:0 16px;font-weight:700;font-size:22px;border-left:2px solid var(--ink);color:var(--ink);line-height:1;min-width:44px}
.scaler button:hover{background:var(--cream)}
.scaler button:active{background:var(--green);color:var(--cream)}
.scaler .n{padding:8px 14px;font-weight:700;font-size:16px;min-width:100px;text-align:center;background:var(--paper);border-left:2px solid var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.5px}
.scale-hint{font-size:12px;color:var(--muted);margin-top:4px}

.sect{margin-top:18px}
.sect h3{margin-bottom:8px;color:var(--green);border-bottom:2px solid var(--ink);padding-bottom:4px}
.subhead{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:1px;margin:12px 0 6px;color:var(--ink)}

ul.ings,ol.steps{list-style:none}
ul.ings li{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer;line-height:1.4}
ul.ings li:last-child{border-bottom:0}
ul.ings .box{flex:0 0 18px;height:18px;border:2px solid var(--ink);background:var(--paper);margin-top:2px;position:relative}
ul.ings li.done .box::after{content:"";position:absolute;inset:1px;background:var(--green)}
ul.ings li.done{color:var(--strike);text-decoration:line-through}
ul.ings .q{font-weight:700;font-variant-numeric:tabular-nums;min-width:80px}
ul.ings .q.scaled{color:var(--green)}

ol.steps{counter-reset:s;margin-top:4px}
ol.steps li{counter-increment:s;display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;line-height:1.45}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);flex:0 0 28px;height:28px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-family:'Barlow Condensed',sans-serif;display:flex;align-items:center;justify-content:center;font-size:16px}
ol.steps li.done::before{background:var(--green);color:var(--cream);border-color:var(--green)}
ol.steps li.done{color:var(--strike)}
ol.steps strong{color:var(--ink)}
ol.steps li.done strong{color:var(--strike)}

.notes{margin-top:14px;background:var(--soft);border-left:4px solid var(--green);padding:10px 14px;font-size:14.5px}
.notes h3{font-size:14px;color:var(--green);margin-bottom:4px;border:0;padding:0}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>

<div class="stripes"><i style="height:4px;background:#005e22"></i><i style="height:2px;background:#111"></i><i style="height:16px;background:#005e22"></i><i style="height:3px;background:#111"></i><i style="height:2px;background:#005e22"></i></div>

function fmtQty(n){
  if(n==null) return "";
  if(n===0) return "0";
  const sign = n<0?"-":""; n = Math.abs(n);
  const whole = Math.floor(n);
  const frac = n - whole;
  if(frac < 0.04){ return sign + (whole || "0"); }
  if(frac > 0.96){ return sign + (whole+1); }
  const marks = [[0.125,"⅛"],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[0.875,"⅞"]];
  let best = null, bestDiff = 1;
  for(const [v,s] of marks){
    const d = Math.abs(frac - v);
    if(d < bestDiff){ bestDiff = d; best = s; }
  }
  if(bestDiff < 0.05){
    return sign + (whole>0 ? whole + best : best);
  }
  if(n >= 10) return sign + Math.round(n);
  return sign + (Math.round(n*10)/10);
}

const CAT_ORDER = ["Breads","Mains","Bits","Dressings","Pickles","Preserves","Meat","Sweet"];
let activeId = RECIPES[0].id;
let scale = {};
let catFilter = "All";
let starsOnly = false;
let query = "";
const presentCats = CAT_ORDER.filter(c => RECIPES.some(r => r.cat === c));
const cats = ["All", ...presentCats];

const chipsEl = document.getElementById("chips");
// Star toggle chip (independent of category)
const starChip = document.createElement("button");
starChip.className = "chip star-chip";
starChip.innerHTML = "★";
starChip.title = "Show favourites only";
starChip.setAttribute("aria-label","Show favourites only");
starChip.onclick = ()=>{starsOnly = !starsOnly; starChip.classList.toggle("on", starsOnly); renderList();};
chipsEl.appendChild(starChip);
// Category chips
cats.forEach(c=>{
  const b = document.createElement("button");
  b.className = "chip" + (c===catFilter?" on":"");
  b.textContent = c;
  b.onclick = ()=>{catFilter = c; renderChips(); renderList();};
  chipsEl.appendChild(b);
});
function renderChips(){
  // star chip is at index 0, cats start at index 1
  cats.forEach((c,i)=>chipsEl.children[i+1].classList.toggle("on", c===catFilter));
}

const listEl = document.getElementById("list");
function renderList(){
  listEl.innerHTML = "";
  const groups = {};
  RECIPES.forEach(r=>{
    const show = (catFilter==="All" || r.cat===catFilter) && (!starsOnly || r.star) && matchQuery(r);
    if(!show) return;
    (groups[r.cat] = groups[r.cat] || []).push(r);
  });
  const total = Object.values(groups).reduce((n,a)=>n+a.length,0);
  document.getElementById("count").textContent = total;
  if(total===0){
    listEl.innerHTML = '<div class="empty">No matches.</div>';
    return;
  }
  CAT_ORDER.forEach(cat=>{
    if(!groups[cat]) return;
    const g = document.createElement("div"); g.className="grp"; g.textContent=cat;
    listEl.appendChild(g);
    groups[cat].forEach(r=>{
      const b = document.createElement("button");
      b.className = "row" + (r.id===activeId?" on":"");
      const checkFlag = r.tags.includes("CHECK") ? '<span class="check-flag">CHECK</span>' : '';
      const starMark = r.star ? '<span class="star" aria-label="favourite">★</span>' : '';
      b.innerHTML = `<span class="emo">${r.emo||""}</span><div class="meat"><div class="t">${r.title}${checkFlag}</div><div class="s">${r.tags.filter(t=>t!=="CHECK").slice(0,3).join(" · ")}</div></div>${starMark}`;
      b.onclick = ()=>{activeId = r.id; renderList(); renderPanel(); if(window.innerWidth<=820){document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"start"});}};
      listEl.appendChild(b);
    });
  });
}
function matchQuery(r){
  if(!query) return true;
  const q = query.toLowerCase();
  if(r.title.toLowerCase().includes(q)) return true;
  if(r.tags.some(t=>t.toLowerCase().includes(q))) return true;
  if(r.ings.some(i=>i.name && i.name.toLowerCase().includes(q))) return true;
  return false;
}

function renderPanel(){
  const r = RECIPES.find(x=>x.id===activeId);
  const el = document.getElementById("panelIn");
  if(!r){ el.innerHTML = '<div class="empty">Pick a recipe.</div>'; return; }
  const servings = scale[r.id] ?? r.yield;
  const factor = servings / r.yield;

  let ingsHtml = '<ul class="ings">';
  r.ings.forEach((i,idx)=>{
    if(i.head){ ingsHtml += `<li style="cursor:default;border:0;padding:0"><div class="subhead" style="margin-top:${idx?10:0}px">${i.head}</div></li>`; return; }
    const scaled = i.q==null ? "" : fmtQty(i.q * factor);
    const qClass = factor===1 ? "q" : "q scaled";
    const unit = i.u ? " " + i.u : "";
    ingsHtml += `<li data-i="${idx}"><span class="box"></span><span class="${qClass}">${scaled}${unit}</span><span>${i.name}</span></li>`;
  });
  ingsHtml += "</ul>";

  let stepsHtml = '<ol class="steps">';
  r.steps.forEach((s,idx)=>{
    const head = s.h ? `<strong>${s.h}:</strong> ` : "";
    stepsHtml += `<li data-s="${idx}">${head}${s.t||""}</li>`;
  });
  stepsHtml += "</ol>";

  const label = servings===1 ? r.yieldLabel : r.yieldPlural;
  const origLabel = r.yield===1 ? r.yieldLabel : r.yieldPlural;

  el.innerHTML = `
    <div class="hero" style="position:relative">
      <div class="big">${r.emo||""}</div>
      <div class="ht">
        <h2>${r.title}</h2>
        <div class="tags">
          <span class="tag serv">${r.yield} ${origLabel}</span>
          ${r.tags.map(t=>`<span class="tag${t==='CHECK'?' check':''}">${t}</span>`).join("")}
        </div>
      </div>
      ${r.star ? '<span class="star" aria-label="favourite">★</span>' : ''}
    </div>
    <div class="body">
      <div class="scaler">
        <span class="lbl">Scale</span>
        <button id="dec" aria-label="less">−</button>
        <span class="n" id="n">${servings} ${label}</span>
        <button id="inc" aria-label="more">+</button>
      </div>
      ${factor!==1 ? `<div class="scale-hint">Scaled ×${(factor).toFixed(2).replace(/\.?0+$/,"")} from ${r.yield} ${origLabel}.</div>` : ""}
      <div class="sect"><h3>Ingredients</h3>${ingsHtml}</div>
      <div class="sect"><h3>Steps</h3>${stepsHtml}</div>
      ${r.notes ? `<div class="notes"><h3>Notes</h3>${r.notes}</div>` : ""}
    </div>
  `;

  const minY = 1, maxY = Math.max(r.yield*4, 24);
  el.querySelector("#dec").onclick = ()=>{ if(servings>minY){ scale[r.id] = servings-1; renderPanel(); } };
  el.querySelector("#inc").onclick = ()=>{ if(servings<maxY){ scale[r.id] = servings+1; renderPanel(); } };

  el.querySelectorAll("ul.ings li[data-i]").forEach(li=>{
    li.onclick = ()=>li.classList.toggle("done");
  });
  el.querySelectorAll("ol.steps li[data-s]").forEach(li=>{
    li.onclick = ()=>li.classList.toggle("done");
  });
}

document.getElementById("q").oninput = (e)=>{query = e.target.value.trim(); renderList();};

renderList();
renderPanel();
</script>
