<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <rect width="380" height="200" fill="#fff"/>
  <circle cx="108" cy="100" r="76" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="108" cy="100" r="62" fill="#fff" stroke="#1e40af" stroke-width="2.5"/>
  <!-- Valve flaps hint inside lumen -->
  <path d="M 78 118 Q 108 86 138 118" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="210" y="50" font-family="Barlow, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Thinner wall</text>
  <text x="210" y="66" font-family="Barlow, Arial, sans-serif" font-size="12" fill="#444">(less muscle &amp; elastic tissue)</text>
  <line x1="176" y1="66" x2="206" y2="50" stroke="#111" stroke-width="1.5"/>
  <text x="210" y="106" font-family="Barlow, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Wide lumen</text>
  <text x="210" y="122" font-family="Barlow, Arial, sans-serif" font-size="12" fill="#444">(low pressure blood flow)</text>
  <line x1="142" y1="98" x2="206" y2="104" stroke="#111" stroke-width="1.5"/>
  <text x="210" y="158" font-family="Barlow, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">Contains valves</text>
  <text x="210" y="174" font-family="Barlow, Arial, sans-serif" font-size="12" fill="#444">(prevent backflow)</text>
  <line x1="128" y1="112" x2="206" y2="156" stroke="#15803d" stroke-width="1.5"/>
</svg>
