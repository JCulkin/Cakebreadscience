  <text x="105" y="26" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Healthy plant</text>
  <text x="315" y="26" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">Magnesium deficiency</text>
  <!-- Healthy plant -->
  <line x1="30" y1="156" x2="180" y2="156" stroke="#78350f" stroke-width="2"/>
  <line x1="105" y1="68" x2="105" y2="156" stroke="#15803d" stroke-width="5"/>
