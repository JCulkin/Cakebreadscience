  <path d="M 105 156 L 86 184 M 105 156 L 105 188 M 105 156 L 124 184" stroke="#78350f" stroke-width="2.5"/>
  <text x="105" y="198" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#166534" text-anchor="middle">Tall stem · deep green leaves</text>
