<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250">
  <rect width="420" height="250" fill="#fff"/>
  <!-- Outer villus finger outline (1-cell-thick epithelium) -->
  <path d="M 80 232 L 80 96 C 80 30 200 30 200 96 L 200 232" fill="#fef3c7" stroke="#b45309" stroke-width="10"/>
  <path d="M 88 232 L 88 96 C 88 40 192 40 192 96 L 192 232" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <!-- Microvilli wavy brush border on top -->
  <path d="M 96 58 Q 104 42 112 52 Q 120 38 128 48 Q 136 35 144 46 Q 152 35 160 48 Q 168 38 176 52 Q 184 44 190 58" fill="none" stroke="#92400e" stroke-width="2"/>
  <!-- Central lacteal (yellow/green) -->
  <path d="M 134 232 L 134 94 C 134 80 146 80 146 94 L 146 232" fill="#fde047" stroke="#a16207" stroke-width="2"/>
  <!-- Capillary network (red/blue loops) -->
  <path d="M 106 232 L 106 100 C 106 62 174 62 174 100 L 174 232" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M 106 135 Q 140 120 174 135 M 106 175 Q 140 160 174 175" fill="none" stroke="#ef4444" stroke-width="3.5"/>
  <path d="M 174 110 L 174 232" fill="none" stroke="#2563eb" stroke-width="5" opacity=".7"/>
  <!-- Labels -->
  <text x="234" y="48" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Microvilli</text>
  <text x="234" y="62" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#444">(huge surface area)</text>
  <line x1="172" y1="48" x2="228" y2="48" stroke="#111" stroke-width="1.5"/>

  <text x="234" y="96" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">1-cell-thick wall</text>
  <text x="234" y="110" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#444">(short diffusion distance)</text>
  <line x1="201" y1="96" x2="228" y2="96" stroke="#111" stroke-width="1.5"/>

  <text x="234" y="148" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626">Capillary network</text>
  <text x="234" y="162" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#444">(absorbs glucose &amp; amino acids;</text>
  <text x="234" y="176" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#444">keeps steep gradient)</text>
  <line x1="176" y1="148" x2="228" y2="148" stroke="#dc2626" stroke-width="1.5"/>

  <text x="234" y="210" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#a16207">Lacteal</text>
  <text x="234" y="224" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#444">(absorbs fatty acids &amp; glycerol)</text>
  <line x1="147" y1="208" x2="228" y2="208" stroke="#a16207" stroke-width="1.5"/>
</svg>
