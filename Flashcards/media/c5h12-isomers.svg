<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" width="640" height="326">
  <rect width="640" height="326" fill="#fff"/>
  <style>
    .a { font-family: Barlow, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; dominant-baseline: central; }
    .b { stroke: #111; stroke-width: 2.2; stroke-linecap: round; }
    .lbl { font-family: Barlow, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #c8001e; text-anchor: middle; }
  </style>

  <!-- 1. PENTANE (top-left, full displayed formula: 5 C in a row, 12 H) -->
  <g transform="translate(18, 10)">
    <line class="b" x1="22" y1="50" x2="36" y2="50"/>
    <line class="b" x1="60" y1="50" x2="80" y2="50"/>
    <line class="b" x1="104" y1="50" x2="124" y2="50"/>
    <line class="b" x1="148" y1="50" x2="168" y2="50"/>
    <line class="b" x1="192" y1="50" x2="212" y2="50"/>
    <line class="b" x1="236" y1="50" x2="250" y2="50"/>
    <line class="b" x1="48" y1="24" x2="48" y2="38"/><line class="b" x1="48" y1="62" x2="48" y2="76"/>
    <line class="b" x1="92" y1="24" x2="92" y2="38"/><line class="b" x1="92" y1="62" x2="92" y2="76"/>
    <line class="b" x1="136" y1="24" x2="136" y2="38"/><line class="b" x1="136" y1="62" x2="136" y2="76"/>
    <line class="b" x1="180" y1="24" x2="180" y2="38"/><line class="b" x1="180" y1="62" x2="180" y2="76"/>
    <line class="b" x1="224" y1="24" x2="224" y2="38"/><line class="b" x1="224" y1="62" x2="224" y2="76"/>
    <text class="a" x="12" y="50">H</text>
    <text class="a" x="48" y="50">C</text><text class="a" x="48" y="14">H</text><text class="a" x="48" y="86">H</text>
    <text class="a" x="92" y="50">C</text><text class="a" x="92" y="14">H</text><text class="a" x="92" y="86">H</text>
    <text class="a" x="136" y="50">C</text><text class="a" x="136" y="14">H</text><text class="a" x="136" y="86">H</text>
    <text class="a" x="180" y="50">C</text><text class="a" x="180" y="14">H</text><text class="a" x="180" y="86">H</text>
    <text class="a" x="224" y="50">C</text><text class="a" x="224" y="14">H</text><text class="a" x="224" y="86">H</text>
    <text class="a" x="260" y="50">H</text>
    <text class="lbl" x="136" y="112">1. pentane</text>
  </g>

  <!-- 2. 2-METHYLBUTANE (bottom-left, generous vertical clearance for methyl H atoms) -->
  <g transform="translate(38, 146)">
    <!-- Methyl branch above C2 (x=92, y=38), backbone lowered to y=104 for crisp spacing -->
    <line class="b" x1="92" y1="14" x2="92" y2="26"/>
    <line class="b" x1="66" y1="38" x2="80" y2="38"/>
    <line class="b" x1="104" y1="38" x2="118" y2="38"/>
    <line class="b" x1="92" y1="50" x2="92" y2="92"/>
    <text class="a" x="92" y="4">H</text>
    <text class="a" x="56" y="38">H</text>
    <text class="a" x="92" y="38">C</text>
    <text class="a" x="128" y="38">H</text>

    <!-- 4-C horizontal backbone: x = 48, 92, 136, 180 at y = 104 -->
    <line class="b" x1="22" y1="104" x2="36" y2="104"/>
    <line class="b" x1="60" y1="104" x2="80" y2="104"/>
    <line class="b" x1="104" y1="104" x2="124" y2="104"/>
    <line class="b" x1="148" y1="104" x2="168" y2="104"/>
    <line class="b" x1="192" y1="104" x2="206" y2="104"/>
    <!-- Vertical C-H bonds -->
    <line class="b" x1="48" y1="78" x2="48" y2="92"/><line class="b" x1="48" y1="116" x2="48" y2="130"/>
    <line class="b" x1="92" y1="116" x2="92" y2="130"/>
    <line class="b" x1="136" y1="78" x2="136" y2="92"/><line class="b" x1="136" y1="116" x2="136" y2="130"/>
    <line class="b" x1="180" y1="78" x2="180" y2="92"/><line class="b" x1="180" y1="116" x2="180" y2="130"/>
    <!-- Atoms -->
    <text class="a" x="12" y="104">H</text>
    <text class="a" x="48" y="104">C</text><text class="a" x="48" y="68">H</text><text class="a" x="48" y="140">H</text>
    <text class="a" x="92" y="104">C</text><text class="a" x="92" y="140">H</text>
    <text class="a" x="136" y="104">C</text><text class="a" x="136" y="68">H</text><text class="a" x="136" y="140">H</text>
    <text class="a" x="180" y="104">C</text><text class="a" x="180" y="68">H</text><text class="a" x="180" y="140">H</text>
    <text class="a" x="216" y="104">H</text>
    <text class="lbl" x="114" y="166">2. 2-methylbutane</text>
  </g>

  <!-- 3. 2,2-DIMETHYLPROPANE (right, full displayed formula: central C + 4 methyls) -->
  <g transform="translate(362, 36)">
    <!-- Top methyl C at (130, 62) -->
    <line class="b" x1="130" y1="36" x2="130" y2="50"/>
    <line class="b" x1="104" y1="62" x2="118" y2="62"/>
    <line class="b" x1="142" y1="62" x2="156" y2="62"/>
    <line class="b" x1="130" y1="74" x2="130" y2="110"/>
    <text class="a" x="130" y="26">H</text>
    <text class="a" x="94" y="62">H</text>
    <text class="a" x="130" y="62">C</text>
    <text class="a" x="166" y="62">H</text>

    <!-- Bottom methyl C at (130, 182) -->
    <line class="b" x1="130" y1="134" x2="130" y2="170"/>
    <line class="b" x1="104" y1="182" x2="118" y2="182"/>
    <line class="b" x1="142" y1="182" x2="156" y2="182"/>
    <line class="b" x1="130" y1="194" x2="130" y2="208"/>
    <text class="a" x="94" y="182">H</text>
    <text class="a" x="130" y="182">C</text>
    <text class="a" x="166" y="182">H</text>
    <text class="a" x="130" y="218">H</text>

    <!-- Left methyl C at (70, 122) -->
    <line class="b" x1="44" y1="122" x2="58" y2="122"/>
    <line class="b" x1="70" y1="96" x2="70" y2="110"/>
    <line class="b" x1="70" y1="134" x2="70" y2="148"/>
    <line class="b" x1="82" y1="122" x2="118" y2="122"/>
    <text class="a" x="34" y="122">H</text>
    <text class="a" x="70" y="86">H</text>
    <text class="a" x="70" y="122">C</text>
    <text class="a" x="70" y="158">H</text>

    <!-- Center C -->
    <text class="a" x="130" y="122">C</text>

    <!-- Right methyl C at (190, 122) -->
    <line class="b" x1="142" y1="122" x2="178" y2="122"/>
    <line class="b" x1="190" y1="96" x2="190" y2="110"/>
    <line class="b" x1="190" y1="134" x2="190" y2="148"/>
    <line class="b" x1="202" y1="122" x2="216" y2="122"/>
    <text class="a" x="190" y="86">H</text>
    <text class="a" x="190" y="122">C</text>
    <text class="a" x="190" y="158">H</text>
    <text class="a" x="226" y="122">H</text>

    <text class="lbl" x="130" y="254">3. 2,2-dimethylpropane</text>
  </g>
</svg>
