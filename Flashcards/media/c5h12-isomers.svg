<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 205" width="600" height="205">
  <rect width="600" height="205" fill="#fff"/>
  <!-- Box 1: Pentane -->
  <rect x="8" y="8" width="212" height="188" rx="6" fill="#fafaf7" stroke="#d8d3c4" stroke-width="1.5"/>
  <text x="114" y="28" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#c8001e" text-anchor="middle">1. pentane</text>
  <text x="114" y="106" font-family="Barlow, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111" text-anchor="middle">CH₃—CH₂—CH₂—CH₂—CH₃</text>
  <text x="114" y="180" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#555" text-anchor="middle">Unbranched 5-carbon chain</text>

  <!-- Box 2: 2-methylbutane -->
  <rect x="228" y="8" width="178" height="188" rx="6" fill="#fafaf7" stroke="#d8d3c4" stroke-width="1.5"/>
  <text x="317" y="28" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#c8001e" text-anchor="middle">2. 2-methylbutane</text>
  <text x="317" y="106" font-family="Barlow, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111" text-anchor="middle">CH₃—CH—CH₂—CH₃</text>
  <line x1="303" y1="112" x2="303" y2="132" stroke="#111" stroke-width="2"/>
  <text x="303" y="148" font-family="Barlow, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">CH₃</text>
  <text x="317" y="180" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#555" text-anchor="middle">4-C chain + 1 methyl branch</text>

  <!-- Box 3: 2,2-dimethylpropane -->
  <rect x="414" y="8" width="178" height="188" rx="6" fill="#fafaf7" stroke="#d8d3c4" stroke-width="1.5"/>
  <text x="503" y="28" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#c8001e" text-anchor="middle">3. 2,2-dimethylpropane</text>
  <text x="503" y="68" font-family="Barlow, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">CH₃</text>
  <line x1="503" y1="74" x2="503" y2="90" stroke="#111" stroke-width="2"/>
  <text x="503" y="106" font-family="Barlow, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#111" text-anchor="middle">CH₃—C—CH₃</text>
  <line x1="503" y1="112" x2="503" y2="130" stroke="#111" stroke-width="2"/>
  <text x="503" y="146" font-family="Barlow, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">CH₃</text>
  <text x="503" y="180" font-family="Barlow, Arial, sans-serif" font-size="11.5" fill="#555" text-anchor="middle">3-C chain + 2 methyl branches</text>
</svg>
