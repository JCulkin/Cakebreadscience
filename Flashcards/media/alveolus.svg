<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260">
  <rect width="420" height="260" fill="#fff"/>
  <!-- Alveolus sac -->
  <path d="M 185 18 L 185 68 C 125 78 100 132 125 182 C 148 225 268 225 292 182 C 318 132 292 78 232 68 L 232 18" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <!-- Moist lining -->
  <path d="M 192 24 L 192 74 C 138 84 114 134 136 176 C 156 214 262 214 282 176 C 304 134 280 84 225 74 L 225 24" fill="#fffbeb" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- Capillary wrapping around bottom -->
  <path d="M 28 158 C 72 158 95 232 208 234 C 322 232 346 158 392 158" fill="none" stroke="#991b1b" stroke-width="28" stroke-linecap="round"/>
  <path d="M 28 158 C 72 158 95 232 208 234 C 322 232 346 158 392 158" fill="none" stroke="#ef4444" stroke-width="22" stroke-linecap="round"/>
  <path d="M 28 158 C 72 158 95 232 195 234" fill="none" stroke="#3b82f6" stroke-width="22" stroke-linecap="round" opacity=".55"/>
  <!-- Red blood cells -->
  <ellipse cx="78" cy="182" rx="10" ry="6" fill="#7f1d1d" transform="rotate(35 78 182)"/>
  <ellipse cx="148" cy="224" rx="10" ry="6" fill="#991b1b" transform="rotate(14 148 224)"/>
  <ellipse cx="222" cy="233" rx="10" ry="6" fill="#dc2626"/>
  <ellipse cx="300" cy="216" rx="10" ry="6" fill="#dc2626" transform="rotate(-22 300 216)"/>
  <ellipse cx="352" cy="172" rx="10" ry="6" fill="#dc2626" transform="rotate(-25 352 172)"/>
  <!-- Air in/out -->
  <text x="208" y="45" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#111" text-anchor="middle">Air in / out</text>
  <!-- O2 arrow (alveolus -> blood) -->
  <line x1="236" y1="154" x2="236" y2="210" stroke="#15803d" stroke-width="3.5"/>
  <polygon points="236,218 229,205 243,205" fill="#15803d"/>
  <text x="248" y="182" font-family="Barlow, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">O₂ in</text>
  <!-- CO2 arrow (blood -> alveolus) -->
  <line x1="176" y1="214" x2="176" y2="158" stroke="#1d4ed8" stroke-width="3.5"/>
  <polygon points="176,150 169,163 183,163" fill="#1d4ed8"/>
  <text x="166" y="182" font-family="Barlow, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="end">CO₂ out</text>
  <!-- Labels -->
  <text x="34" y="132" font-family="Barlow, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Deoxygenated</text>
  <text x="34" y="146" font-family="Barlow, Arial, sans-serif" font-size="12" fill="#333">blood in →</text>
  <text x="386" y="132" font-family="Barlow, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">Oxygenated</text>
  <text x="386" y="146" font-family="Barlow, Arial, sans-serif" font-size="12" fill="#333" text-anchor="end">blood out →</text>
  <text x="310" y="90" font-family="Barlow, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">1-cell-thick wall</text>
  <line x1="286" y1="98" x2="306" y2="88" stroke="#92400e" stroke-width="1.5"/>
  <text x="208" y="114" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#555" text-anchor="middle">Alveolus air space</text>
</svg>
