<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240">
  <rect width="380" height="240" fill="#fff"/>
  <!-- Semi-circular glass block -->
  <path d="M 70 118 A 120 120 0 0 0 310 118 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5"/>
  <text x="108" y="150" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Glass</text>
  <text x="108" y="96" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#555">Air</text>
  <!-- Normal -->
  <line x1="190" y1="26" x2="190" y2="232" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="190" y="20" font-family="Barlow, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Normal</text>
  <!-- Incident ray at critical angle c -->
  <line x1="115" y1="218" x2="190" y2="118" stroke="#dc2626" stroke-width="3.2"/>
  <polygon points="158,160 146,166 155,174" fill="#dc2626"/>
  <!-- Refracted ray along boundary (r = 90 deg) -->
  <line x1="190" y1="118" x2="345" y2="118" stroke="#dc2626" stroke-width="3.2"/>
  <polygon points="282,118 268,112 268,124" fill="#dc2626"/>
  <!-- Angle c arc -->
  <path d="M 190 156 A 38 38 0 0 1 167 148" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="172" y="176" font-family="Barlow, Arial, sans-serif" font-size="15" font-weight="900" fill="#b45309">c</text>
  <!-- 90 degree symbol -->
  <rect x="190" y="102" width="16" height="16" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="212" y="110" font-family="Barlow, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111">90°</text>
  <text x="288" y="84" font-family="Barlow, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">Refracts along boundary</text>
  <line x1="288" y1="90" x2="288" y2="112" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3 2"/>
</svg>
