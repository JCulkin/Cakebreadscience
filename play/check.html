<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><title>Game check</title></head>
<body>
<!-- Loaded in a hidden frame by /js/game-gate.js. Runs the site's own Firebase sign-in in its own window, so it never
     clashes with the Firebase versions the games load themselves. Tells the game page 'ok' or 'deny', and logs the play
     to Realtime Database gameLog/{id} = {uid, name, email, game, title, page, mode, t, last}. -->
<script src="/js/firebase-config.js"></script>
<script src="/js/admin-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
(function () {
  var P = new URLSearchParams(location.search);
  var mode = P.get('mode') === 'log' ? 'log' : 'gate';
  var game = (P.get('page') || '').replace(/^\/+/, '').replace(/\.html$/, '').replace(/\/index$/, '') || 'unknown';
  var KEY = 'cbs.games.ok';
  function tell(msg) { try { parent.postMessage({ cbsGate: msg }, location.origin); } catch (e) {} }
  function setOk(uid) { try { localStorage.setItem(KEY, JSON.stringify({ uid: uid, t: Date.now() })); } catch (e) {} }
  function clearOk() { try { localStorage.removeItem(KEY); } catch (e) {} }
  if (!window.firebase) { tell(mode === 'gate' ? 'offline' : 'ok'); return; }   // SDK blocked: can't confirm the player, so restricted games stay shut (17 Nov)
  var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(window.firebaseConfig);
  var auth = firebase.auth(), rt = firebase.database();
  var logged = false;

  function log(u) {
    if (logged) return; logged = true;
    var now = Date.now();
    var entry = { uid: u.uid, name: u.displayName || '', email: u.email || '', game: game.slice(0, 120),
      title: (P.get('title') || '').slice(0, 120), page: (P.get('page') || '').slice(0, 200), mode: mode, t: now, last: now };
    if (window.CBSNet) {
      CBSNet.rtPush('gameLog', entry, 8000).then(function (key) {
        if (!key) return;
        setInterval(function () { if (document.visibilityState === 'visible') CBSNet.rtUpdate('gameLog/' + key, { last: Date.now() }, 6000).catch(function () {}); }, 60000);
      }).catch(function (e) { console.warn('game log', e); });
      return;
    }
    var ref = rt.ref('gameLog').push();
    ref.set(entry).then(function () {
      setInterval(function () { if (document.visibilityState === 'visible') ref.update({ last: Date.now() }).catch(function () {}); }, 60000);
    }).catch(function (e) { console.warn('game log', e); });
  }

  var first = true;
  auth.onAuthStateChanged(function (u) {
    if (!first) return; first = false;
    if (mode === 'log') { if (u) log(u); return; }
    if (!u) { clearOk(); tell('deny'); return; }
    if ((window.ADMIN_EMAILS || []).indexOf(u.email) >= 0) { setOk(u.uid); tell('ok'); log(u); return; }
    var check = window.CBSNet ? CBSNet.rtGet('gameAccess/' + u.uid + '/status', 8000) : rt.ref('gameAccess/' + u.uid + '/status').once('value').then(function (s) { return s.val(); });
    check.then(function (val) {
      if (val === 'approved') { setOk(u.uid); tell('ok'); log(u); }
      else { clearOk(); tell('deny'); }
    }).catch(function (e) { console.warn('game access', e); clearOk(); tell('offline'); });
  });
})();
</script>
</body></html>
